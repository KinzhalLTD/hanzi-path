ئلة.","en":"No questions.","na":"فرصة ضائعة لإظهار اهتمامك.","ne":"A missed chance to show interest."},{"t":"X","zh":"什么时候可以放假？","py":"Shénme shíhou kěyǐ fàngjià?","ar":"متى الإجازة؟","en":"When can I go on holiday?","na":"سؤال سيئ التوقيت في المقابلة.","ne":"Badly timed for an interview."}]}]}]},{"k":"sec","zh":"网络安全","ar":"الأمن السيبراني","en":"Cybersecurity","sec":"cy","emo":"🛡️","scenes":[{"k":"phish","zh":"报告钓鱼邮件","ar":"الإبلاغ عن رسالة تصيّد","en":"Reporting a phishing email","pz":"小王","pa":"وانغ مهندس الأمن","pe":"Security engineer Wang","ma":"موظف","me":"Employee","sa":"اتصلت بمهندس الأمن وانغ لأن رسالة مشبوهة وصلتك.","se":"You call security engineer Wang about a suspicious email.","hsk":3,"turns":[{"p":["你好，我是安全部的小王。有什么问题？","Nǐ hǎo, wǒ shì ānquánbù de Xiǎo Wáng. Yǒu shénme wèntí?","مرحبًا، أنا وانغ من قسم الأمن. ما المشكلة؟","Hi, I’m Wang from security. What’s the problem?"],"o":[{"t":"A","zh":"我收到一封邮件，说我的账号要过期了，让我点链接。","py":"Wǒ shōudào yì fēng yóujiàn, shuō wǒ de zhànghào yào guòqī le, ràng wǒ diǎn liànjiē.","ar":"وصلتني رسالة تقول إن حسابي سينتهي، وتطلب الضغط على رابط.","en":"I got an email saying my account is about to expire and asking me to click a link.","na":"","ne":""},{"t":"B","zh":"我的电脑有问题。","py":"Wǒ de diànnǎo yǒu wèntí.","ar":"حاسوبي فيه مشكلة.","en":"My computer has a problem.","na":"كن محددًا: صف الرسالة.","ne":"Be specific: describe the email."},{"t":"X","zh":"没什么，我打错了。","py":"Méi shénme, wǒ dǎ cuò le.","ar":"لا شيء، اتصلت خطأً.","en":"Nothing, wrong number.","na":"الإبلاغ عن الرسائل المشبوهة واجب.","ne":"Reporting suspicious emails matters."}]},{"p":["你点链接了吗？","Nǐ diǎn liànjiē le ma?","هل ضغطت الرابط؟","Did you click the link?"],"o":[{"t":"A","zh":"没有点，我觉得发件人的地址很奇怪。","py":"Méiyǒu diǎn, wǒ juéde fājiànrén de dìzhǐ hěn qíguài.","ar":"لم أضغطه، شعرت أن عنوان المرسل غريب.","en":"No, I thought the sender’s address looked strange.","na":"","ne":""},{"t":"B","zh":"好像没有吧。","py":"Hǎoxiàng méiyǒu ba.","ar":"لا أظن.","en":"I don’t think so.","na":"أجب بوضوح؛ الدقة مهمة للتحقيق.","ne":"Answer clearly; precision matters for the investigation."},{"t":"X","zh":"点了，可是没关系吧？","py":"Diǎn le, kěshì méi guānxi ba?","ar":"ضغطته، لكن لا مشكلة، أليس كذلك؟","en":"I did, but it’s fine, right?","na":"إن ضغطت فقل ذلك فورًا ولا تقلّل من الأمر.","ne":"If you clicked, say so at once and don’t downplay it."}]},{"p":["做得很好。能把邮件转发给我吗？","Zuò de hěn hǎo. Néng bǎ yóujiàn zhuǎnfā gěi wǒ ma?","أحسنت. هل يمكنك إعادة توجيه الرسالة إليّ؟","Well done. Can you forward me the email?"],"o":[{"t":"A","zh":"可以，我用报告按钮发给你，然后删掉原邮件。","py":"Kěyǐ, wǒ yòng bàogào ànniǔ fā gěi nǐ, ránhòu shān diào yuán yóujiàn.","ar":"نعم، سأرسلها بزر الإبلاغ ثم أحذف الأصل.","en":"Sure, I’ll send it with the report button and then delete the original.","na":"","ne":""},{"t":"B","zh":"我直接删了。","py":"Wǒ zhíjiē shān le.","ar":"حذفتها مباشرة.","en":"I just deleted it.","na":"فريق الأمن يحتاج الرسالة لحجب الحملة.","ne":"Security needs the email to block the campaign."},{"t":"X","zh":"我转发给全公司提醒大家。","py":"Wǒ zhuǎnfā gěi quán gōngsī tíxǐng dàjiā.","ar":"سأرسلها لكل الشركة لتنبيههم.","en":"I’ll forward it to the whole company as a warning.","na":"قد يضغط غيرك الرابط؛ دع فريق الأمن يتولى التنبيه.","ne":"Someone else might click it; let security send the warning."}]},{"p":["收到了。这是一个钓鱼网站，专门偷密码。","Shōudào le. Zhè shì yí ge diàoyú wǎngzhàn, zhuānmén tōu mìmǎ.","وصلت. هذا موقع تصيّد مخصص لسرقة كلمات المرور.","Got it. It’s a phishing site built to steal passwords."],"o":[{"t":"A","zh":"还好我没输入密码。需要我改密码吗？","py":"Háihǎo wǒ méi shūrù mìmǎ. Xūyào wǒ gǎi mìmǎ ma?","ar":"من حسن الحظ أنني لم أُدخل كلمة المرور. هل أغيّرها؟","en":"Good thing I didn’t enter my password. Should I change it?","na":"","ne":""},{"t":"B","zh":"太可怕了！","py":"Tài kěpà le!","ar":"هذا مخيف جدًا!","en":"That’s terrifying!","na":"الهدوء والخطوة التالية أهم من القلق.","ne":"Calm and a next step beat alarm."},{"t":"X","zh":"那我用同一个密码也没事。","py":"Nà wǒ yòng tóng yí ge mìmǎ yě méishì.","ar":"إذن لا بأس أن أستخدم كلمة المرور نفسها في كل مكان.","en":"Then it’s fine to use the same password everywhere.","na":"إعادة استخدام كلمة المرور خطر كبير.","ne":"Reusing passwords is a big risk."}]},{"p":["不用，不过建议你开启多因素认证。","Búyòng, búguò jiànyì nǐ kāiqǐ duō yīnsù rènzhèng.","لا داعي، لكن أنصحك بتفعيل المصادقة متعددة العوامل.","No need, but I recommend turning on multi-factor authentication."],"o":[{"t":"A","zh":"好的，我今天就开。谢谢你！","py":"Hǎo de, wǒ jīntiān jiù kāi. Xièxie nǐ!","ar":"حسنًا، سأفعّلها اليوم. شكرًا لك!","en":"OK, I’ll turn it on today. Thank you!","na":"","ne":""},{"t":"B","zh":"以后再说吧。","py":"Yǐhòu zài shuō ba.","ar":"لاحقًا.","en":"Maybe later.","na":"التأجيل يترك الحساب مكشوفًا.","ne":"Putting it off leaves the account exposed."},{"t":"X","zh":"太麻烦了，我不想开。","py":"Tài máfan le, wǒ bù xiǎng kāi.","ar":"مزعجة جدًا، لا أريد تفعيلها.","en":"Too much hassle; I don’t want it.","na":"المصادقة متعددة العوامل توقف معظم سرقات الحسابات.","ne":"MFA stops most account takeovers."}]}]},{"k":"incident","zh":"勒索软件应急会议","ar":"اجتماع طارئ لحادثة فدية","en":"Ransomware incident call","pz":"陈经理","pa":"المدير تشن، قائد الاستجابة","pe":"Incident lead Chen","ma":"محلل الأمن","me":"Security analyst","sa":"اجتماع طارئ بعد اكتشاف برنامج فدية على خوادم الشركة.","se":"An emergency call after ransomware was found on company servers.","hsk":4,"turns":[{"p":["大家好，现在开始应急会议。先说一下目前的情况。","Dàjiā hǎo, xiànzài kāishǐ yìngjí huìyì. Xiān shuō yíxià mùqián de qíngkuàng.","مرحبًا جميعًا، نبدأ الاجتماع الطارئ. لنبدأ بالوضع الحالي.","Hello all, starting the incident call. First, the current situation."],"o":[{"t":"A","zh":"早上六点发现两台文件服务器被加密，勒索信要求比特币。","py":"Zǎoshang liù diǎn fāxiàn liǎng tái wénjiàn fúwùqì bèi jiāmì, lèsuǒxìn yāoqiú bǐtèbì.","ar":"في السادسة صباحًا اكتشفنا تشفير خادمَي ملفات، ورسالة الفدية تطلب بيتكوين.","en":"At 6 a.m. we found two file servers encrypted; the ransom note demands bitcoin.","na":"","ne":""},{"t":"B","zh":"情况很糟糕，很多东西都坏了。","py":"Qíngkuàng hěn zāogāo, hěn duō dōngxi dōu huài le.","ar":"الوضع سيئ جدًا، أشياء كثيرة تعطلت.","en":"It’s really bad; lots of things are broken.","na":"قدّم وقائع محددة: ماذا ومتى وأين.","ne":"Give specific facts: what, when, where."},{"t":"X","zh":"我们付钱吧，最快。","py":"Wǒmen fù qián ba, zuì kuài.","ar":"لندفع، هذا الأسرع.","en":"Let’s pay; it’s quickest.","na":"الدفع لا يضمن الاستعادة وقراره ليس لك.","ne":"Paying guarantees nothing and isn’t your call."}]},{"p":["有没有扩散到其他系统？","Yǒu méiyǒu kuòsàn dào qítā xìtǒng?","هل انتشر إلى أنظمة أخرى؟","Has it spread to other systems?"],"o":[{"t":"A","zh":"我们已经把这两台服务器断网隔离了，正在检查其他服务器。","py":"Wǒmen yǐjīng bǎ zhè liǎng tái fúwùqì duàn wǎng gélí le, zhèngzài jiǎnchá qítā fúwùqì.","ar":"عزلنا الخادمين عن الشبكة، ونفحص بقية الخوادم.","en":"We’ve isolated those two servers and are checking the others.","na":"","ne":""},{"t":"B","zh":"应该没有吧。","py":"Yīnggāi méiyǒu ba.","ar":"غالبًا لا.","en":"Probably not.","na":"التخمين خطير في الحادثة؛ قل ما تم فحصه.","ne":"Guessing is dangerous in an incident; say what was checked."},{"t":"X","zh":"我们把所有服务器都关机了。","py":"Wǒmen bǎ suǒyǒu fúwùqì dōu guānjī le.","ar":"أطفأنا كل الخوادم.","en":"We shut down every server.","na":"الإطفاء يمحو أدلة الذاكرة ويوقف الأعمال بلا داعٍ.","ne":"Shutting down wipes memory evidence and halts business needlessly."}]},{"p":["很好。知道攻击者是怎么进来的吗？","Hěn hǎo. Zhīdào gōngjīzhě shì zěnme jìnlái de ma?","جيد. هل نعرف كيف دخل المهاجم؟","Good. Do we know how the attacker got in?"],"o":[{"t":"A","zh":"日志显示有人通过一个没有多因素认证的远程桌面账号登录。","py":"Rìzhì xiǎnshì yǒu rén tōngguò yí ge méiyǒu duō yīnsù rènzhèng de yuǎnchéng zhuōmiàn zhànghào dēnglù.","ar":"السجلات تُظهر دخولًا عبر حساب سطح مكتب بعيد بلا مصادقة متعددة العوامل.","en":"The logs show a login through a remote desktop account without MFA.","na":"","ne":""},{"t":"B","zh":"可能是黑客吧。","py":"Kěnéng shì hēikè ba.","ar":"ربما هاكر.","en":"Maybe a hacker.","na":"هذا لا يضيف معلومة؛ اذكر الدليل.","ne":"That adds nothing; cite the evidence."},{"t":"X","zh":"这个不重要，先恢复吧。","py":"Zhège bú zhòngyào, xiān huīfù ba.","ar":"ليس مهمًا، لنستعد أولًا.","en":"That doesn’t matter; let’s restore first.","na":"إن لم تُسد الثغرة سيعود المهاجم.","ne":"If the hole isn’t closed the attacker comes back."}]},{"p":["那个账号处理了吗？","Nàge zhànghào chǔlǐ le ma?","هل عولج ذلك الحساب؟","Has that account been dealt with?"],"o":[{"t":"A","zh":"已经禁用了，也重置了所有管理员的密码。","py":"Yǐjīng jìnyòng le, yě chóngzhì le suǒyǒu guǎnlǐyuán de mìmǎ.","ar":"عُطّل، وأعدنا تعيين كلمات مرور كل المديرين.","en":"It’s disabled, and we’ve reset all admin passwords.","na":"","ne":""},{"t":"B","zh":"我明天再处理。","py":"Wǒ míngtiān zài chǔlǐ.","ar":"سأعالجه غدًا.","en":"I’ll handle it tomorrow.","na":"في الحادثة كل ساعة مهمة.","ne":"In an incident every hour counts."},{"t":"X","zh":"我把密码发到群里了。","py":"Wǒ bǎ mìmǎ fā dào qún lǐ le.","ar":"أرسلت كلمات المرور في المجموعة.","en":"I posted the passwords in the group chat.","na":"لا تشارك كلمات المرور في الدردشة أبدًا.","ne":"Never share passwords in chat."}]},{"p":["好。备份情况怎么样？什么时候能恢复？","Hǎo. Bèifèn qíngkuàng zěnmeyàng? Shénme shíhou néng huīfù?","جيد. ما وضع النسخ الاحتياطية؟ متى نستعيد؟","Good. How are the backups? When can we restore?"],"o":[{"t":"A","zh":"离线备份是完好的，预计今天下午可以恢复，恢复后我们会继续监控。","py":"Líxiàn bèifèn shì wánhǎo de, yùjì jīntiān xiàwǔ kěyǐ huīfù, huīfù hòu wǒmen huì jìxù jiānkòng.","ar":"النسخ غير المتصلة سليمة، ونتوقع الاستعادة عصر اليوم، ثم نواصل المراقبة.","en":"The offline backups are intact; we expect to restore this afternoon and will keep monitoring.","na":"","ne":""},{"t":"B","zh":"应该很快。","py":"Yīnggāi hěn kuài.","ar":"يُفترض قريبًا.","en":"Should be soon.","na":"الإدارة تحتاج تقديرًا واضحًا.","ne":"Management needs a clear estimate."},{"t":"X","zh":"备份我没检查过。","py":"Bèifèn wǒ méi jiǎnchá guo.","ar":"لم أفحص النسخ الاحتياطية.","en":"I never checked the backups.","na":"اختبار الاستعادة جزء من التحضير.","ne":"Testing restores is part of preparation."}]}]},{"k":"audit","zh":"合规审计面谈","ar":"مقابلة تدقيق الامتثال","en":"Compliance audit interview","pz":"刘老师","pa":"المدقّقة ليو","pe":"Auditor Liu","ma":"مسؤول أمن المعلومات","me":"Information security officer","sa":"المدققة ليو تراجع ضوابط الأمن في شركتك.","se":"Auditor Liu is reviewing your company’s security controls.","hsk":4,"turns":[{"p":["您好，今天我想了解一下你们的访问控制。","Nín hǎo, jīntiān wǒ xiǎng liǎojiě yíxià nǐmen de fǎngwèn kòngzhì.","مرحبًا، أود اليوم فهم ضوابط الوصول لديكم.","Hello, today I’d like to understand your access controls."],"o":[{"t":"A","zh":"好的。我们按角色分配权限，每个季度审查一次。","py":"Hǎo de. Wǒmen àn juésè fēnpèi quánxiàn, měi ge jìdù shěnchá yí cì.","ar":"حسنًا. نوزّع الصلاحيات حسب الأدوار ونراجعها كل ربع سنة.","en":"Certainly. We assign permissions by role and review them every quarter.","na":"","ne":""},{"t":"B","zh":"我们的权限都没问题。","py":"Wǒmen de quánxiàn dōu méi wèntí.","ar":"صلاحياتنا كلها سليمة.","en":"Our permissions are all fine.","na":"المدقق يحتاج وصف الضابط لا الطمأنة.","ne":"The auditor needs the control described, not reassurance."},{"t":"X","zh":"这个您不用看。","py":"Zhège nín búyòng kàn.","ar":"لا داعي أن تنظري في هذا.","en":"You don’t need to look at that.","na":"التهرب من المدقق علامة سيئة.","ne":"Dodging the auditor is a bad sign."}]},{"p":["能给我看一下上次审查的记录吗？","Néng gěi wǒ kàn yíxià shàng cì shěnchá de jìlù ma?","هل يمكنني رؤية سجل المراجعة الأخيرة؟","Could I see the record of the last review?"],"o":[{"t":"A","zh":"当然，这是九月份的审查报告，有部门经理的签字。","py":"Dāngrán, zhè shì jiǔ yuèfèn de shěnchá bàogào, yǒu bùmén jīnglǐ de qiānzì.","ar":"بالطبع، هذا تقرير مراجعة سبتمبر وعليه توقيعات مديري الأقسام.","en":"Of course, here is September’s review report, signed by the department managers.","na":"","ne":""},{"t":"B","zh":"我找一下，可能没有。","py":"Wǒ zhǎo yíxià, kěnéng méiyǒu.","ar":"سأبحث، ربما غير موجود.","en":"I’ll look; maybe there isn’t one.","na":"ضابط بلا دليل يُعد غير مطبق.","ne":"A control without evidence counts as not implemented."},{"t":"X","zh":"我们口头审查的。","py":"Wǒmen kǒutóu shěnchá de.","ar":"نراجع شفهيًا.","en":"We review verbally.","na":"التدقيق يتطلب دليلًا موثقًا.","ne":"Audits require documented evidence."}]},{"p":["员工离职以后，账号多久会禁用？","Yuángōng lízhí yǐhòu, zhànghào duōjiǔ huì jìnyòng?","بعد مغادرة الموظف، متى يُعطَّل حسابه؟","When an employee leaves, how soon is their account disabled?"],"o":[{"t":"A","zh":"人事系统会自动通知，我们在离职当天禁用账号。","py":"Rénshì xìtǒng huì zìdòng tōngzhī, wǒmen zài lízhí dàngtiān jìnyòng zhànghào.","ar":"نظام الموارد البشرية يُبلغ تلقائيًا، ونعطّل الحساب يوم المغادرة.","en":"The HR system notifies us automatically and we disable the account the same day.","na":"","ne":""},{"t":"B","zh":"一般很快。","py":"Yìbān hěn kuài.","ar":"عادة بسرعة.","en":"Usually quickly.","na":"حدد المدة والآلية.","ne":"State the timeframe and the mechanism."},{"t":"X","zh":"有时候一直不禁用。","py":"Yǒu shíhou yìzhí bú jìnyòng.","ar":"أحيانًا لا يُعطَّل أبدًا.","en":"Sometimes it never gets disabled.","na":"الحسابات اليتيمة ثغرة شائعة يجب علاجها.","ne":"Orphaned accounts are a common gap to fix."}]},{"p":["我发现有两个离职员工的账号还是启用的。","Wǒ fāxiàn yǒu liǎng ge lízhí yuángōng de zhànghào háishi qǐyòng de.","وجدت حسابين لموظفين غادروا ما زالا مفعّلين.","I found two leavers’ accounts that are still enabled."],"o":[{"t":"A","zh":"谢谢指出。我们今天就禁用，并且查一下流程哪里出了问题。","py":"Xièxie zhǐchū. Wǒmen jīntiān jiù jìnyòng, bìngqiě chá yíxià liúchéng nǎlǐ chū le wèntí.","ar":"شكرًا للتنبيه. سنعطّلهما اليوم ونفحص أين أخفقت العملية.","en":"Thanks for pointing it out. We’ll disable them today and find where the process failed.","na":"","ne":""},{"t":"B","zh":"这不是我的责任。","py":"Zhè bú shì wǒ de zérèn.","ar":"هذه ليست مسؤوليتي.","en":"That’s not my responsibility.","na":"تقبّل الملاحظة وعالج السبب الجذري.","ne":"Accept the finding and fix the root cause."},{"t":"X","zh":"这两个账号不重要。","py":"Zhè liǎng ge zhànghào bú zhòngyào.","ar":"هذان الحسابان غير مهمين.","en":"Those two accounts don’t matter.","na":"أي حساب مفعّل بلا مالك هدف للمهاجمين.","ne":"Any live account without an owner is a target."}]},{"p":["好的，我会把它写进审计发现，给你们一个整改期限。","Hǎo de, wǒ huì bǎ tā xiě jìn shěnjì fāxiàn, gěi nǐmen yí ge zhěnggǎi qīxiàn.","حسنًا، سأدرجها في نتائج التدقيق وأمنحكم مهلة للمعالجة.","OK, I’ll record it as an audit finding and give you a remediation deadline."],"o":[{"t":"A","zh":"明白，我们会在期限前提交整改证据。","py":"Míngbai, wǒmen huì zài qīxiàn qián tíjiāo zhěnggǎi zhèngjù.","ar":"مفهوم، سنقدّم دليل المعالجة قبل الموعد.","en":"Understood; we’ll submit evidence of the fix before the deadline.","na":"","ne":""},{"t":"B","zh":"能不能不写？","py":"Néng bu néng bù xiě?","ar":"هل يمكن ألا تكتبيها؟","en":"Could you leave it out?","na":"طلب إخفاء نتيجة غير مهني.","ne":"Asking to hide a finding is unprofessional."},{"t":"X","zh":"期限越长越好。","py":"Qīxiàn yuè cháng yuè hǎo.","ar":"كلما طالت المهلة كان أفضل.","en":"The longer the deadline the better.","na":"الهدف إغلاق الثغرة لا كسب الوقت.","ne":"The goal is closing the gap, not buying time."}]}]},{"k":"pentest","zh":"确定渗透测试范围","ar":"تحديد نطاق اختبار الاختراق","en":"Scoping a penetration test","pz":"赵总","pa":"السيد تشاو، مدير تقنية المعلومات","pe":"IT director Zhao","ma":"مستشار الأمن","me":"Security consultant","sa":"تلتقي مدير تقنية المعلومات تشاو لتحديد نطاق اختبار اختراق.","se":"You meet IT director Zhao to scope a penetration test.","hsk":4,"turns":[{"p":["我们想做一次渗透测试，你们一般怎么开始？","Wǒmen xiǎng zuò yí cì shèntòu cèshì, nǐmen yìbān zěnme kāishǐ?","نريد إجراء اختبار اختراق، كيف تبدؤون عادة؟","We’d like a penetration test. How do you usually start?"],"o":[{"t":"A","zh":"首先要确定测试范围和目标，然后签授权书。","py":"Shǒuxiān yào quèdìng cèshì fànwéi hé mùbiāo, ránhòu qiān shòuquánshū.","ar":"أولًا نحدد النطاق والأهداف، ثم نوقّع خطاب التفويض.","en":"First we agree on the scope and goals, then sign an authorisation letter.","na":"","ne":""},{"t":"B","zh":"我们马上就开始测。","py":"Wǒmen mǎshàng jiù kāishǐ cè.","ar":"نبدأ الاختبار فورًا.","en":"We’ll start testing right away.","na":"الاختبار بلا تفويض مكتوب غير قانوني.","ne":"Testing without written authorisation is illegal."},{"t":"X","zh":"范围不重要，我们测所有东西。","py":"Fànwéi bú zhòngyào, wǒmen cè suǒyǒu dōngxi.","ar":"النطاق غير مهم، سنختبر كل شيء.","en":"Scope doesn’t matter; we’ll test everything.","na":"نطاق غير محدد قد يمس أنظمة أطراف أخرى.","ne":"An undefined scope may hit third-party systems."}]},{"p":["我们最担心的是网上商城和支付接口。","Wǒmen zuì dānxīn de shì wǎngshàng shāngchéng hé zhīfù jiēkǒu.","أكثر ما يقلقنا المتجر الإلكتروني وواجهة الدفع.","Our biggest worry is the online store and the payment API."],"o":[{"t":"A","zh":"好的，那我们把这两个系统放在范围里，支付服务商的系统要先得到他们的同意。","py":"Hǎo de, nà wǒmen bǎ zhè liǎng ge xìtǒng fàng zài fànwéi lǐ, zhīfù fúwùshāng de xìtǒng yào xiān dédào tāmen de tóngyì.","ar":"حسنًا، ندرج هذين النظامين، وأنظمة مزوّد الدفع تحتاج موافقته أولًا.","en":"OK, those two go in scope; the payment provider’s systems need their consent first.","na":"","ne":""},{"t":"B","zh":"支付接口我们随便测。","py":"Zhīfù jiēkǒu wǒmen suíbiàn cè.","ar":"سنختبر واجهة الدفع كما نشاء.","en":"We’ll test the payment API however we like.","na":"أنظمة الطرف الثالث تحتاج إذنه.","ne":"Third-party systems need their owner’s permission."},{"t":"X","zh":"只测首页就够了。","py":"Zhǐ cè shǒuyè jiù gòu le.","ar":"يكفي اختبار الصفحة الرئيسية.","en":"Testing the home page is enough.","na":"المخاطر الأكبر في الدفع وليس الصفحة الرئيسية.","ne":"The biggest risk is in payments, not the home page."}]},{"p":["测试会不会影响我们的业务？","Cèshì huì bu huì yǐngxiǎng wǒmen de yèwù?","هل سيؤثر الاختبار على أعمالنا؟","Will testing affect our business?"],"o":[{"t":"A","zh":"我们不做拒绝服务测试，高风险的操作会在晚上进行，并提前通知你们。","py":"Wǒmen bú zuò jùjué fúwù cèshì, gāo fēngxiǎn de cāozuò huì zài wǎnshang jìnxíng, bìng tíqián tōngzhī nǐmen.","ar":"لن نجري اختبار حجب الخدمة، والعمليات الخطرة ليلًا مع إشعار مسبق.","en":"We won’t run denial-of-service tests; risky steps happen at night with advance notice.","na":"","ne":""},{"t":"B","zh":"不会的，放心吧。","py":"Bú huì de, fàngxīn ba.","ar":"لن يؤثر، اطمئن.","en":"It won’t, don’t worry.","na":"اشرح ضوابط تقليل الأثر بدل الطمأنة.","ne":"Explain the safeguards instead of just reassuring."},{"t":"X","zh":"可能会停几天。","py":"Kěnéng huì tíng jǐ tiān.","ar":"قد يتوقف بضعة أيام.","en":"It might be down for a few days.","na":"اختبار مهني يُخطط ليتجنب التوقف.","ne":"A professional test is planned to avoid outages."}]},{"p":["如果你们发现严重漏洞怎么办？","Rúguǒ nǐmen fāxiàn yánzhòng lòudòng zěnme bàn?","ماذا إن وجدتم ثغرة خطيرة؟","What if you find a serious vulnerability?"],"o":[{"t":"A","zh":"严重漏洞我们会马上电话通知你们，不会等到最后的报告。","py":"Yánzhòng lòudòng wǒmen huì mǎshàng diànhuà tōngzhī nǐmen, bú huì děng dào zuìhòu de bàogào.","ar":"نتصل بكم فورًا للثغرات الخطيرة، ولا ننتظر التقرير النهائي.","en":"We’ll phone you at once for serious flaws rather than waiting for the final report.","na":"","ne":""},{"t":"B","zh":"都写在报告里。","py":"Dōu xiě zài bàogào lǐ.","ar":"كل شيء في التقرير.","en":"It’ll all be in the report.","na":"الثغرات الحرجة تحتاج إبلاغًا فوريًا.","ne":"Critical flaws need immediate notice."},{"t":"X","zh":"我们会把漏洞发到网上。","py":"Wǒmen huì bǎ lòudòng fā dào wǎng shàng.","ar":"سننشر الثغرة على الإنترنت.","en":"We’ll post the vulnerability online.","na":"نتائج الاختبار سرية للعميل.","ne":"Test results are confidential to the client."}]},{"p":["最后的报告包括什么内容？","Zuìhòu de bàogào bāokuò shénme nèiróng?","ماذا يتضمن التقرير النهائي؟","What does the final report include?"],"o":[{"t":"A","zh":"管理层摘要、每个漏洞的风险等级、复现步骤和修复建议，修复后我们还会复测。","py":"Guǎnlǐcéng zhāiyào, měi ge lòudòng de fēngxiǎn děngjí, fùxiàn bùzhòu hé xiūfù jiànyì, xiūfù hòu wǒmen hái huì fùcè.","ar":"ملخص للإدارة، ودرجة خطورة كل ثغرة، وخطوات إعادة الإنتاج، وتوصيات الإصلاح، ونعيد الاختبار بعد الإصلاح.","en":"An executive summary, each flaw’s risk rating, reproduction steps and fixes, and we retest after you fix them.","na":"","ne":""},{"t":"B","zh":"一个漏洞列表。","py":"Yí ge lòudòng lièbiǎo.","ar":"قائمة ثغرات.","en":"A list of vulnerabilities.","na":"القائمة وحدها لا تكفي لاتخاذ القرار.","ne":"A bare list isn’t enough to act on."},{"t":"X","zh":"报告不重要，测试才重要。","py":"Bàogào bú zhòngyào, cèshì cái zhòngyào.","ar":"التقرير غير مهم، الاختبار هو المهم.","en":"The report doesn’t matter; the testing does.","na":"قيمة الاختبار تظهر في التقرير والإصلاحات.","ne":"A test’s value shows in the report and the fixes."}]}]},{"k":"vulnfix","zh":"和开发讨论漏洞","ar":"مناقشة ثغرة مع مطوّر","en":"Discussing a flaw with a developer","pz":"小李","pa":"المطوّر لي","pe":"Developer Li","ma":"مهندس أمن التطبيقات","me":"Application security engineer","sa":"تشرح للمطوّر لي ثغرة وجدتها في كوده.","se":"You explain a flaw you found in developer Li’s code.","hsk":4,"turns":[{"p":["听说你在我的代码里找到了一个漏洞？","Tīngshuō nǐ zài wǒ de dàimǎ lǐ zhǎodào le yí ge lòudòng?","سمعت أنك وجدت ثغرة في كودي؟","I hear you found a vulnerability in my code?"],"o":[{"t":"A","zh":"对，订单查询接口有越权问题，改一下订单号就能看到别人的订单。","py":"Duì, dìngdān cháxún jiēkǒu yǒu yuèquán wèntí, gǎi yíxià dìngdānhào jiù néng kàndào biérén de dìngdān.","ar":"نعم، واجهة الاستعلام عن الطلبات فيها تجاوز صلاحيات؛ بتغيير رقم الطلب ترى طلبات غيرك.","en":"Yes, the order lookup API has an access-control flaw: change the order number and you see other people’s orders.","na":"","ne":""},{"t":"B","zh":"你的代码写得太差了。","py":"Nǐ de dàimǎ xiě de tài chà le.","ar":"كودك سيئ جدًا.","en":"Your code is terrible.","na":"انتقد المشكلة لا الشخص.","ne":"Critique the issue, not the person."},{"t":"X","zh":"没什么大问题。","py":"Méi shénme dà wèntí.","ar":"ليست مشكلة كبيرة.","en":"It’s no big deal.","na":"كشف بيانات العملاء مشكلة كبيرة.","ne":"Exposing customer data is a big deal."}]},{"p":["可是用户要先登录才能访问啊。","Kěshì yònghù yào xiān dēnglù cái néng fǎngwèn a.","لكن المستخدم يجب أن يسجّل الدخول أولًا.","But users have to log in first."],"o":[{"t":"A","zh":"登录只证明他是谁，还要检查这个订单是不是属于他。","py":"Dēnglù zhǐ zhèngmíng tā shì shéi, hái yào jiǎnchá zhège dìngdān shì bu shì shǔyú tā.","ar":"الدخول يثبت هويته فقط، ويجب التحقق أن الطلب يخصه.","en":"Login only proves who they are; you also have to check the order belongs to them.","na":"","ne":""},{"t":"B","zh":"对，登录就够了。","py":"Duì, dēnglù jiù gòu le.","ar":"صحيح، الدخول يكفي.","en":"Right, login is enough.","na":"المصادقة ليست تفويضًا.","ne":"Authentication isn’t authorisation."},{"t":"X","zh":"那我们取消登录吧。","py":"Nà wǒmen qǔxiāo dēnglù ba.","ar":"إذن لنلغِ تسجيل الدخول.","en":"Then let’s remove login.","na":"هذا يزيد المشكلة سوءًا.","ne":"That makes it worse."}]},{"p":["明白了。那应该怎么改？","Míngbai le. Nà yīnggāi zěnme gǎi?","فهمت. كيف أصلحها إذن؟","Got it. So how should I fix it?"],"o":[{"t":"A","zh":"在服务端查询的时候加上当前用户的条件，只返回他自己的订单。","py":"Zài fúwùduān cháxún de shíhou jiā shàng dāngqián yònghù de tiáojiàn, zhǐ fǎnhuí tā zìjǐ de dìngdān.","ar":"أضف شرط المستخدم الحالي في استعلام الخادم، فلا يُعاد إلا طلباته.","en":"Add the current user as a condition in the server-side query so only their own orders return.","na":"","ne":""},{"t":"B","zh":"在前端把按钮藏起来。","py":"Zài qiánduān bǎ ànniǔ cáng qǐlái.","ar":"أخفِ الزر في الواجهة الأمامية.","en":"Hide the button in the front end.","na":"الواجهة الأمامية يمكن تجاوزها بسهولة.","ne":"The front end is easy to bypass."},{"t":"X","zh":"把订单号改成很长就行了。","py":"Bǎ dìngdānhào gǎi chéng hěn cháng jiù xíng le.","ar":"يكفي جعل رقم الطلب طويلًا جدًا.","en":"Just make the order numbers really long.","na":"الإخفاء ليس ضابط وصول.","ne":"Obscurity is not access control."}]},{"p":["好，我今天改。还有别的地方有同样的问题吗？","Hǎo, wǒ jīntiān gǎi. Hái yǒu biéde dìfang yǒu tóngyàng de wèntí ma?","حسنًا، سأصلحها اليوم. هل توجد المشكلة نفسها في أماكن أخرى؟","OK, I’ll fix it today. Is the same problem anywhere else?"],"o":[{"t":"A","zh":"发票和地址接口也要检查，我们可以写一个自动化测试覆盖所有接口。","py":"Fāpiào hé dìzhǐ jiēkǒu yě yào jiǎnchá, wǒmen kěyǐ xiě yí ge zìdònghuà cèshì fùgài suǒyǒu jiēkǒu.","ar":"يجب فحص واجهتي الفواتير والعناوين، ويمكننا كتابة اختبار آلي يغطي كل الواجهات.","en":"Check the invoice and address APIs too; we can write an automated test covering every endpoint.","na":"","ne":""},{"t":"B","zh":"应该没有了。","py":"Yīnggāi méiyǒu le.","ar":"غالبًا لا.","en":"Probably not.","na":"الأخطاء تتكرر بالنمط نفسه؛ افحص.","ne":"Bugs repeat in the same pattern; check."},{"t":"X","zh":"别的不是我写的。","py":"Biéde bú shì wǒ xiě de.","ar":"البقية ليست من كتابتي.","en":"I didn’t write the others.","na":"الأمن مسؤولية الفريق كله.","ne":"Security is the whole team’s job."}]},{"p":["这个主意很好。修完以后请你帮我复测一下。","Zhège zhǔyi hěn hǎo. Xiū wán yǐhòu qǐng nǐ bāng wǒ fùcè yíxià.","فكرة ممتازة. بعد الإصلاح أرجو أن تعيد الاختبار.","Great idea. Please retest it for me after the fix."],"o":[{"t":"A","zh":"没问题，修完告诉我，我马上复测。","py":"Méi wèntí, xiū wán gàosu wǒ, wǒ mǎshàng fùcè.","ar":"لا مشكلة، أخبرني عند الانتهاء وأعيد الاختبار فورًا.","en":"No problem; tell me when it’s done and I’ll retest right away.","na":"","ne":""},{"t":"B","zh":"下个月吧。","py":"Xià ge yuè ba.","ar":"الشهر القادم.","en":"Next month.","na":"الثغرة مكشوفة طوال الانتظار.","ne":"The flaw stays exposed while you wait."},{"t":"X","zh":"你自己测吧，我很忙。","py":"Nǐ zìjǐ cè ba, wǒ hěn máng.","ar":"اختبرها بنفسك، أنا مشغول.","en":"Test it yourself; I’m busy.","na":"التعاون يغلق الثغرات أسرع.","ne":"Working together closes flaws faster."}]}]}]}]</script><script type="application/json" id="d-art">{"longbao_happy":"data:image/webp;base64,UklGRuIcAABXRUJQVlA4INYcAAAQcQCdASrIAMgAPmEskkakIqGhKDTa2IAMCWJEQlQF4gQG//Vz9z9nnvK8i9wftzTrvm+1uhvOj/yfVZ+qvYF57Hmb/bz9wPeM/5P7Ve8P+8eot/Xf9V1oPoLeXh7OH99/7/pb9fdwPm1X5dfknunyduxvMv7evyvOTvx+Y+oX7f8D3dlb/5inuj9y86f7vzl/jP9F7AH61cbJQE/Qnq3f6/k8+xPYMLOLmbW5Nt7Z0BoRffcnFqtxv4rKjwHs7cIYu6A0YA6Wdwax2LZzMCa7+H7S3QC2soNpGE9NpxhSrT3dC5vbkV6mcE8pOFd4+2xba1527FJlzFEjPdgchWm5gjjzxMrvPZtoHkb+ES4D4jgBHuZXF5vJ2YPRuHLZNDiafBaxdqq6dpZu9CFA2Clrxia2kd8SsacZwZZkvUyvgDuy3RIO0/ZluKbRW0D8z0heG8cIuz9cpA2uk1stN426hSHfqUj69VfxtJr/r3KhAADLNGtGJ94mP74mc0n9KKM31nOVn40bcuDR43clQLRz6I5hISOnH4Dm9jdbzLP8jQopZv8O9BdykOnJu4O0h5Fnbjo0g+sNZdlqKC+JuwL0PiHwCrRX9n4ey/LTz+5raPQJ0UY8YL7AnFCDAwh/RJD6901/nafPJHLWTyFGo55diCbQ5Z6Y7dQCausO+QJeKFX4kq7LG60UPmQa4KT76E2KRHF7eKKCFoE6xPjrheXX6ojuhwLn/M2Hjg31yyGcNhHc5z/hK/dB7u1zJ6pFAbbJsWEtG+3oY6pdO/5viWKF3fuA4az32cAPP2yYW7oPCPr/TphauyD4Wqd0Y6aRW+OzUI3VKGpzhNhisjJPS755GFrmb71U2/TEgGOUxjdf3fMwvN+NtoSPCAWsBiAzJ7lgd6t7GwzVw2ujmYFo1Dd0FQKWAhQYPdaItNB+jr5FiuCMCGUFcrO4UP9ebdaAa8lrrIbbtn7vmKmjGzbHUYHgYNEmdZ6a0OpuZzH9fx9luTVH1/ZSNWoxu1GDDnLmQbD/wypL659P09yI6+iny function pluck(f,t=0,vol=.16,len=.9){ const c=sctx(); if(!c) return; const t0=c.currentTime+t;
  const g=c.createGain(), lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(5200,t0); lp.frequency.exponentialRampToValueAtTime(700,t0+len*.8); lp.Q.value=2;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.004); g.gain.exponentialRampToValueAtTime(.0001,t0+len);
  [['triangle',1,1],['sawtooth',1.003,.35],['sine',2,.25]].forEach(([ty,m,a])=>{ const o=c.createOscillator(), og=c.createGain(); o.type=ty; o.frequency.setValueAtTime(f*m*1.012,t0); o.frequency.exponentialRampToValueAtTime(f*m,t0+.05); og.gain.value=a; o.connect(og).connect(lp); o.start(t0); o.stop(t0+len+.05); });
  lp.connect(g).connect(SND.out); }
function noiseHit(t,dur,freq,q,vol,type='bandpass'){ const c=sctx(); if(!c) return; const t0=c.currentTime+t, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=SND.noise; f.type=type; f.frequency.value=freq; f.Q.value=q; g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); s.connect(f).connect(g).connect(SND.out); s.start(t0); s.stop(t0+dur+.02); }
function wood(t=0,vol=.22,f=1900){ noiseHit(t,.045,f,9,vol); const c=sctx(); if(!c) return; const t0=c.currentTime+t, o=c.createOscillator(), g=c.createGain(); o.frequency.value=f*.5; g.gain.setValueAtTime(vol*.5,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.05); o.connect(g).connect(SND.out); o.start(t0); o.stop(t0+.06); }
function drum(t=0,vol=.5){ const c=sctx(); if(!c) return; const t0=c.currentTime+t, o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(120,t0); o.frequency.exponentialRampToValueAtTime(48,t0+.28);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+.42); o.connect(g).connect(SND.out); o.start(t0); o.stop(t0+.45); noiseHit(t,.08,900,1,vol*.35,'lowpass'); }
function bell(f,t=0,vol=.09,len=1.2){ const c=sctx(); if(!c) return; const t0=c.currentTime+t;
  [[1,1],[2.76,.45],[5.4,.22],[8.9,.1]].forEach(([m,a],i)=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f*m; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol*a,t0+.003); g.gain.exponentialRampToValueAtTime(.0001,t0+len/(1+i*.6)); o.connect(g).connect(SND.out); o.start(t0); o.stop(t0+len); }); }
function gongS(t=0,vol=.32){ const c=sctx(); if(!c) return; const t0=c.currentTime+t;
  [[72,1,2.6],[108,.5,2.2],[151,.35,1.8],[227,.2,1.4],[301,.12,1]].forEach(([f,a,len])=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(f*1.02,t0); o.frequency.exponentialRampToValueAtTime(f,t0+.4);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol*a,t0+.04); g.gain.exponentialRampToValueAtTime(.0001,t0+len); o.connect(g).connect(SND.out); o.start(t0); o.stop(t0+len+.05); });
  noiseHit(t,.9,3200,.6,vol*.12); }
function whoosh(t=0,vol=.1){ const c=sctx(); if(!c) return; const t0=c.currentTime+t, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=SND.noise;
  f.type='bandpass'; f.Q.value=1.2; f.frequency.setValueAtTime(400,t0); f.frequency.exponentialRampToValueAtTime(2600,t0+.22); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.08); g.gain.exponentialRampToValueAtTime(.0001,t0+.3);
  s.connect(f).connect(g).connect(SND.out); s.start(t0); s.stop(t0+.32); }
Object.assign(SFX,{
  tap:()=>wood(0,.16,2100),
  ok:()=>{ pluck(note(2),0,.15,.7); pluck(note(4),.07,.15,.9); bell(note(9),.12,.05,.8); },
  bad:()=>{ pluck(note(-6),0,.14,.45); drum(.02,.22); },
  win:()=>{ [0,1,2,3,4,5,7].forEach((n,i)=>pluck(note(n),i*.07,.13,.9)); bell(note(10),.5,.08,1.6); drum(0,.35); },
  coin:()=>{ bell(2093,0,.07,.5); bell(2637,.07,.06,.6); },
  gong:()=>gongS(),
  hit:()=>{ drum(0,.45); noiseHit(.01,.12,2400,2,.18); },
  scan:()=>{ for(let i=0;i<5;i++) wood(i*.045,.1,1500+i*250); },

  stamp:()=>{ drum(0,.38); wood(.02,.2,700); },

  chest:()=>{ drum(0,.4); [0,2,4,5,7,9,10].forEach((n,i)=>pluck(note(n),.12+i*.06,.12,1)); gongS(.6,.22); bell(note(12),.6,.07,1.8); }

/* ---------- daily quests 每日任务: three seeded quests, each pays bits; all three open the treasure chest ---------- */
const QUEST_POOL=[['right',10,'أجب 10 إجابات صحيحة','Answer 10 questions right'],['right',20,'أجب 20 إجابة صحيحة','Answer 20 questions right'],['lab',1,'حلّ مختبرًا واحدًا','Solve 1 lab'],['lab',3,'حلّ 3 مختبرات','Solve 3 labs'],

function quests(){ const d=today(); if(!S.qd||S.qd.d!==d){ const r=seeded('quest'+d); const pool=QUEST_POOL.slice(), pick3=[]; const kinds=new Set();
    while(pick3.length<3&&pool.length){ const q=pool.splice(Math.floor(r()*pool.length),1)[0]; if(kinds.has(q[0])) continue; kinds.add(q[0]); pick3.push({k:q[0],goal:q[1],n:0,a:q[2],e:q[3],done:0}); }
    S.qd={d,q:pick3,chest:0}; save(); } return S.qd; }
function questEvent(kind,n=1,max=false){ try{ const qd=quests(); let changed=false;
  qd.q.forEach(q=>{ if(q.k!==kind||q.done) return; q.n=max?Math.max(q.n,n):q.n+n; changed=true;
    if(q.n>=q.goal){ q.n=q.goal; q.done=1; setTimeout(()=>{ SFX.quest(); haptic('success'); toast(`📜 ${isAr()?'مهمة منجزة':'Quest done'}: ${isAr()?q.a:q.e} · +15`); S.coins+=15; save(); updateTop(); },300); } });
  if(changed) save(); }catch(e){} }

/* ===== Voice: studio recordings first, the best phone voice as fallback =====
   Studio clips (Google Chirp 3 HD, recorded by scripts/voice_gen.py) ship inside the iPhone app in voice packs.
   Every spoken line is looked up by voiceKey(voice, text) (same cyrb53 hash as scripts/voice_corpus.py); the native
   side returns the clip bytes and it plays here with pitch-preserving speed control. Lines without a clip, and the
   browser version, use the best installed system voice (premium/enhanced first). Voices: 'n' narrator (male studio
   voice, matched to the owner's reference recording) and 'p' conversation partner (female), so dialogues have two voices.
   say(text,{voice:'n'|'p', rate, lang, py, hl}) returns a promise that settles when the line has finished (or was cut off),
   so conversations can play turn by turn. Speeds: S.vSpeed = 'slow' | 'normal' (default) | 'fast'. */
function cyrb53(str,seed=0){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0); }
const voiceKey=(v,t,py)=>cyrb53(v+'|'+String(t).replace(/[\s·・]+/g,'')+(py?'#'+py:'')).toString(36);   // py: a reading-specific recording (车 'ju1')
const VOICE={cache:new Map(), cur:null, gen:0, studio:null, clips:0, web:{}};
const vSpeedMul=()=>S.vSpeed==='slow'?0.72:S.vSpeed==='fast'?1.15:1;
async function voiceInfo(){ if(!RN) return {studio:false,clips:0}; if(VOICE.studio!==null) return {studio:VOICE.studio,clips:VOICE.clips};
  const r=await native('voiceInfo',{}); VOICE.studio=!!(r&&r.ok&&r.clips>0); VOICE.clips=(r&&r.clips)||0; return {studio:VOICE.studio,clips:VOICE.clips}; }
async function studioClip(v,text,py){ if(!RN||VOICE.studio===false) return null; const k=voiceKey(v,text,py);
  if(VOICE.cache.has(k)){ const u=VOICE.cache.get(k); VOICE.cache.delete(k); VOICE.cache.set(k,u); return u; }
  const r=await native('voice',{k}); if(!r||r.unsupported){ VOICE.studio=false; return null; } if(!r.b64) return null;
  const bin=atob(r.b64), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([u8],{type:'audio/mpeg'})); VOICE.cache.set(k,url);
  if(VOICE.cache.size>80){ const [ok,ou]=VOICE.cache.entries().next().value; VOICE.cache.delete(ok); try{URL.revokeObjectURL(ou);}catch(e){} }
  return url; }
/* best browser voice per language: quality first; gender only breaks ties (narrator male, partner female), and the
   partner gets a different voice than the narrator when one of similar quality exists, otherwise a raised pitch */
const VOICE_MALE=/(yunxi|yunyang|yunjian|kangkang|li-?mu|male|男|maged|hamed|shakir|tarik|daniel|aaron|arthur|fred|guy|david|mark|alex|tom)/i;
function webVoice(lang,role){ try{ const vs=speechSynthesis.getVoices(); if(!vs.length) return null; const key=lang+role; if(VOICE.web[key]!==undefined) return VOICE.web[key]; const male=role!=='p';
  const L=lang.toLowerCase(), base=L.split('-')[0]; let pool=vs.filter(v=>v.lang.toLowerCase().replace('_','-')===L); if(!pool.length) pool=vs.filter(v=>v.lang.toLowerCase().startsWith(base));
  if(base==='zh') pool=pool.filter(v=>!/hk|tw|yue|cantonese|粤/i.test(v.lang+v.name)).concat(pool.filter(v=>/tw/i.test(v.lang))).filter((v,i,a)=>a.indexOf(v)===i);
  const q=v=>(/premium|neural|natural|enhanced|online|xiaoxiao|xiaoyi|yunxi|tingting|lili|google/i.test(v.name)?6:0)+(/premium|neural|natural/i.test(v.name)?4:0)+(v.localService?1:0);
  const sc=v=>q(v)*2+(VOICE_MALE.test(v.name)===male?1:0); const ranked=pool.sort((a,b)=>sc(b)-sc(a));
  let pick=ranked[0]||null;
  if(role==='p'){ const nar=webVoice(lang,'n'); const alt=ranked.find(v=>v!==nar&&q(v)>=q(nar||v)-4); pick=alt||nar; }
  return VOICE.web[key]=pick; }catch(e){ return null; } }
try{ speechSynthesis.onvoiceschanged=()=>{ VOICE.web={}; }; }catch(e){}
function ttsSay(text,{voice='n',rate=.8,lang='zh-CN'}={}){ const r=Math.max(.35,Math.min(1.4,rate*vSpeedMul()));
  if(RN) return native('speak',{text,lang,rate:r,voice}).then(()=>{});
  return new Promise(res=>{ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=r;
      const wv=webVoice(lang,voice); if(wv) u.voice=wv; if(voice==='p'&&wv&&wv===webVoice(lang,'n')) u.pitch=1.18;
      u.onend=u.onerror=()=>res(); speechSynthesis.speak(u); setTimeout(res,1500+[...text].length*450/r); }catch(e){ res(); } }); }
function stopVoice(){ VOICE.gen++; if(VOICE.cur){ try{ VOICE.cur.pause(); }catch(e){} VOICE.cur=null; }
  try{ if(RN) RN.postMessage(JSON.stringify({type:'speakStop'})); else speechSynthesis.cancel(); }catch(e){} }
function say(text,o={}){ if(!S.sound||!text) return Promise.resolve(); text=String(text).trim(); if(!text) return Promise.resolve();
  const v=o.voice||'n', lang=o.lang||'zh-CN', rate=o.rate||.8, g=++VOICE.gen;
  if(VOICE.cur){ try{ VOICE.cur.pause(); }catch(e){} VOICE.cur=null; }
  // studio clips are Mandarin; regional voices (zh-HK, zh-TW) and other languages stay on the phone voice
  return (async()=>{ const url=lang==='zh-CN'?await studioClip(v,text,o.py):null; if(g!==VOICE.gen) return;
    const el=lang.startsWith('zh')?sayTarget(text,o.hl):null; let unhl=()=>{};
    if(url){ const a=new Audio(url); a.preservesPitch=true; a.webkitPreservesPitch=true; a.playbackRate=Math.max(.5,Math.min(1.5,vSpeedMul()*rate/.8));
      VOICE.cur=a; a.onloadedmetadata=()=>{ const s=(a.duration||2)/a.playbackRate; try{ musDuck(s+.4); }catch(e){} unhl(); unhl=karaoke(el,s); };
      await new Promise(res=>{ a.onended=a.onerror=a.onpause=()=>res(); a.play().catch(()=>res()); });
      unhl(); if(VOICE.cur===a) VOICE.cur=null; return; }
    const est=(.35+[...hanOf(text)].length*.27)*.8/rate/vSpeedMul();
    try{ musDuck(est+1); }catch(e){} unhl=karaoke(el,est);
    await ttsSay(text,{voice:v,rate,lang}); unhl(); })(); }
/* karaoke: while a line plays, light up its words in the sentence on screen (found automatically: the visible token
   group whose characters spell the line; o.hl can name the element). Word timing = clip length split by character count. */
const hanOf=s=>[...String(s)].filter(c=>/[\u3400-\u9fff〇]/.test(c)).join('');
function sayTarget(text,hl){ if(hl) return hl; const want=hanOf(text); if([...want].length<3) return null; let best=null;
  const groups=new Set(); document.querySelectorAll('.tok').forEach(t=>{ if(t.parentElement) groups.add(t.parentElement); });
  groups.forEach(g=>{ if(!g.isConnected||!g.getClientRects().length) return; if(hanOf([...g.querySelectorAll(':scope > .tok')].map(t=>(t.querySelector('.han')||t).textContent).join(''))===want) best=g; });
  return best; }
function karaoke(el,secs){ const toks=el?[...el.querySelectorAll(':scope > .tok')]:[]; if(!toks.length||!(secs>0)) return ()=>{};
  const w=toks.map(t=>Math.max(.4,[...hanOf((t.querySelector('.han')||t).textContent)].length)); const tot=w.reduce((a,b)=>a+b,0); let acc=0;
  const off=()=>toks.forEach(x=>x.classList.remove('say-on'));
  const tm=toks.map((t,i)=>{ const at=acc/tot*secs*1000; acc+=w[i]; return setTimeout(()=>{ off(); t.classList.add('say-on'); },at); });
  tm.push(setTimeout(off,secs*1000+250)); return ()=>{ tm.forEach(clearTimeout); off(); }; }
/* play several lines in order, alternating voices: [[text,'p'],[text,'n'],…]; returns a stop function */
function sayAll(lines,gap=350){ let stop=false; (async()=>{ for(const [t,v] of lines){ if(stop) return; await say(t,{voice:v}); if(stop) return; await new Promise(r=>setTimeout(r,gap)); } })(); return ()=>{ stop=true; stopVoice(); }; }

/* ===== Feel: touch response, haptics and screen transitions =====
   - iOS only shows :active pressed states when the page has a touch listener, so one passive listener is installed.
   - Light haptic tick on tab and primary-button presses (native app; ignored in the browser). Kinds: select, light,
     medium, success, error (mobile/src/HanziBridge.js maps them to expo-haptics).
   - screenEnter(): short staggered rise for the top blocks of a screen, mirrored for "back"; respects Reduce Motion.
   - Taps on the active tab scroll the screen back to the top, like native iOS tab bars. */
document.addEventListener('touchstart', () => {}, { passive: true });
const REDUCED = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
let _lastTick = 0;
function tick(kind) { const n = Date.now(); if (n - _lastTick < 60) return; _lastTick = n; if (S.haptics === false) return; haptic(kind || 'select'); }
document.addEventListener('click', e => {   // on release, so a scroll that starts on a button never ticks
  const el = e.target.closest && e.target.closest('.tab,.btn,.opt,.modc,.step,.ltile,.track,.plan,.logl,.revl,.tkopt,.lang button');
  if (!el || el.disabled) return;
  tick(el.classList.contains('tab') ? 'select' : 'light');
}, { capture: true });
document.addEventListener('click', e => {
  const tb = e.target.closest && e.target.closest('.tab[aria-current="page"]');
  if (tb && route.name === tb.dataset.k && window.scrollY > 0) { e.stopImmediatePropagation(); e.preventDefault(); window.scrollTo({ top: 0, behavior: REDUCED() ? 'auto' : 'smooth' }); }
}, true);
function screenEnter(back) {
  if (REDUCED()) return; const sc = $('#app > .screen'); if (!sc || sc.classList.contains('full')) return;
  sc.classList.remove('enter', 'enter-back'); sc.classList.add(back ? 'enter-back' : 'enter');
  setTimeout(() => sc.classList.remove('enter', 'enter-back'), 520);
}

 tests:[['payload("eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJsaW5hIiwicm9sZSI6ImFkbWluIn0.sig")',{sub:'lina',role:'admin'}],['payload("x.eyJpZCI6NDJ9.y").id',42],['payload("a." + btoa(JSON.stringify({q: "a?b>c"})).replace(/\\+/g, "-").replace(/\\//g, "_").replace(/=+$/, "") + ".b")',{q:'a?b>c'}]],
 ha:'خذ token.split(".")[1]، وحوّل - إلى + و_ إلى /، ثم atob ثم JSON.parse.',he:'Take token.split(".")[1], turn - into + and _ into /, then atob, then JSON.parse.',
 sol:'function payload(token) {\n  const part = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");\n  return JSON.parse(atob(part));\n}'},
{k:'caesar',tr:'cy',mod:'cy-crypto',zh:'凯撒密码',py:'Kǎisā mìmǎ',ar:'شيفرة قيصر',en:'Caesar cipher',
 pa:'اكتب `caesar(text, shift)` التي تزيح كل حرف إنجليزي (كبير أو صغير) بمقدار shift مع الالتفاف، وتترك بقية الرموز كما هي. الإزاحة قد تكون سالبة لفك التشفير.',pe:'Write `caesar(text, shift)` shifting each English letter (upper or lower case) by shift with wrap-around, leaving other characters unchanged. A negative shift decrypts.',
 start:'function caesar(text, shift) {\n  // your code\n}',
 tests:[['caesar("abc", 1)','bcd'],['caesar("xyz", 3)','abc'],['caesar("Hello, World!", 13)','Uryyb, Jbeyq!'],['caesar("Khoor", -3)','Hello'],['caesar("abc", 27)','bcd']],
 ha:'لكل حرف احسب (code - base + shift) % 26، وأضف 26 قبل الباقي لمعالجة السالب.',he:'For each letter compute (code - base + shift) % 26, adding 26 to handle negatives.',
 sol:'function caesar(text, shift) {\n  return text.replace(/[a-z]/gi, c => {\n    const base = c <= "Z" ? 65 : 97;\n    return String.fromCharCode(((c.charCodeAt(0) - base + shift) % 26 + 26) % 26 + base);\n  });\n}'},
{k:'ipv4',tr:'cy',mod:'cy-net',zh:'验证IP地址',py:'yànzhèng IP dìzhǐ',ar:'التحقق من عنوان IPv4',en:'Validate an IPv4 address',
 pa:'اكتب `isIPv4(s)`: أربعة أرقام بين 0 و255 تفصلها نقاط، دون أصفار بادئة (مثل 01) ودون مسافات أو رموز أخرى.',pe:'Write `isIPv4(s)`: four numbers from 0 to 255 separated by dots, with no leading zeros (like 01) and no spaces or other characters.',
 start:'function isIPv4(s) {\n  // your code\n}',
 tests:[['isIPv4("192.168.1.10")',true],['isIPv4("0.0.0.0")',true],['isIPv4("256.1.1.1")',false],['isIPv4("1.2.3")',false],['isIPv4("1.2.3.04")',false],['isIPv4("1.2.3.4 ")',false],['isIPv4("a.b.c.d")',false]],
 ha:'قسّم على "."، وتحقق أن الأجزاء أربعة، وكل جزء يطابق /^(0|[1-9]\\d{0,2})$/ وقيمته ≤ 255.',he:'Split on ".", require four parts, each matching /^(0|[1-9]\\d{0,2})$/ with a value ≤ 255.',
 sol:'function isIPv4(s) {\n  const parts = s.split(".");\n  return parts.length === 4 && parts.every(p => /^(0|[1-9]\\d{0,2})$/.test(p) && Number(p) <= 255);\n}'},
{k:'firewall',tr:'cy',mod:'cy-net',zh:'防火墙规则',py:'fánghuǒqiáng guīzé',ar:'قواعد الجدار الناري',en:'Firewall rules',
 pa:'اكتب `decide(rules, port)` التي تطبق مبدأ «أول قاعدة مطابقة»: كل قاعدة {action, port} حيث port رقم أو "*" لأي منفذ. أرجع action لأول قاعدة مطابقة، أو "deny" إن لم تطابق أي قاعدة.',pe:'Write `decide(rules, port)` applying first-match: each rule is {action, port} where port is a number or "*" for any. Return the action of the first matching rule, or "deny" if none match.',
 start:'function decide(rules, port) {\n  // your code\n}',
 tests:[['decide([{action:"allow",port:443},{action:"deny",port:"*"}], 443)','allow'],['decide([{action:"allow",port:443},{action:"deny",port:"*"}], 22)','deny'],['decide([{action:"deny",port:"*"},{action:"allow",port:443}], 443)','deny'],['decide([], 80)','deny'],['decide([{action:"allow",port:22}], 23)','deny']],
 ha:'استخدم find للعثور على أول قاعدة منفذها "*" أو يساوي port.',he:'Use find for the first rule whose port is "*" or equals port.',
 sol:'function decide(rules, port) {\n  const r = rules.find(r => r.port === "*" || r.port === port);\n  return r ? r.action : "deny";\n}'},
{k:'brute',tr:'cy',mod:'cy-soc',zh:'暴力破解检测',py:'bàolì pòjiě jiǎncè',ar:'كشف هجوم التخمين',en:'Detect brute force',
 pa:'كل سطر سجل بالشكل "FAIL 10.0.0.5" أو "OK 10.0.0.5". اكتب `suspects(lines, limit)` التي تُرجع عناوين IP التي فشلت limit مرة أو أكثر، مرتبة أبجديًا.',pe:'Each log line looks like "FAIL 10.0.0.5" or "OK 10.0.0.5". Write `suspects(lines, limit)` returning the IPs with limit or more failures, sorted.',
 start:'function suspects(lines, limit) {\n  // your code\n}',
 tests:[['suspects(["FAIL 1.1.1.1","FAIL 1.1.1.1","OK 2.2.2.2","FAIL 1.1.1.1"], 3)',['1.1.1.1']],['suspects(["FAIL 9.9.9.9","FAIL 5.5.5.5","FAIL 9.9.9.9","FAIL 5.5.5.5"], 2)',['5.5.5.5','9.9.9.9']],['suspects(["OK 1.1.1.1"], 1)',[]]],
 ha:'عُدّ الإخفاقات في Map حسب العنوان، ثم صفِّ ورتّب.',he:'Count failures per IP in a Map, then filter and sort.',
 sol:'function suspects(lines, limit) {\n  const fails = new Map();\n  for (const l of lines) {\n    const [status, ip] = l.split(" ");\n    if (status === "FAIL") fails.set(ip, (fails.get(ip) || 0) + 1);\n  }\n  return [...fails].filter(([, n]) => n >= limit).map(([ip]) => ip).sort();\n}'},
{k:'redirect',tr:'cy',mod:'cy-code',zh:'安全跳转',py:'ānquán tiàozhuǎn',ar:'إعادة توجيه آمنة',en:'Safe redirects',
 pa:'ثغرة «إعادة التوجيه المفتوحة» تسمح بتوجيه الضحية إلى موقع خبيث. اكتب `safeRedirect(url)` التي تقبل فقط المسارات الداخلية التي تبدأ بـ "/" (وليس "//" أو "/\\") وتُرجعها، وإلا تُرجع "/".',pe:'An open redirect lets attackers send victims to a malicious site. Write `safeRedirect(url)` that only accepts internal paths starting with "/" (but not "//" or "/\\") and returns them; anything else returns "/".',
 start:'function safeRedirect(url) {\n  // your code\n}',
 tests:[['safeRedirect("/account")','/account'],['safeRedirect("https://evil.example")','/'],['safeRedirect("//evil.example")','/'],['safeRedirect("/\\\\evil.example")','/'],['safeRedirect("javascript:alert(1)")','/']],
 ha:'تحقق أن الحرف الأول "/" وأن الثاني ليس "/" ولا "\\".',he:'Check the first character is "/" and the second is neither "/" nor "\\".',
 sol:'function safeRedirect(url) {\n  return /^\\/(?![\\/\\\\])/.test(url) ? url : "/";\n}'},
{k:'mask',tr:'cy',mod:'cy-code',zh:'数据脱敏',py:'shùjù tuōmǐn',ar:'إخفاء البيانات الحساسة',en:'Mask sensitive data',
 pa:'قبل كتابة السجلات يجب إخفاء أرقام البطاقات. اكتب `mask(card)` التي تزيل المسافات والشرطات ثم تستبدل كل الأرقام بـ * عدا آخر أربعة.',pe:'Card numbers must be masked before logging. Write `mask(card)` that removes spaces and dashes, then replaces every digit except the last four with *.',
 start:'function mask(card) {\n  // your code\n}',
 tests:[['mask("4111111111111111")','************1111'],['mask("4111 1111 1111 1234")','************1234'],['mask("5500-0000-0000-0004")','************0004'],['mask("1234")','1234']],
 ha:'نظّف الرقم بـ replace(/[\\s-]/g, "") ثم استخدم "*".repeat.',he:'Clean it with replace(/[\\s-]/g, "") then use "*".repeat.',
 sol:'function mask(card) {\n  const d = card.replace(/[\\s-]/g, "");\n  return "*".repeat(Math.max(0, d.length - 4)) + d.slice(-4);\n}'},
{k:'sqlsafe',tr:'cy',mod:'cy-web',zh:'参数化查询',py:'cānshùhuà cháxún',ar:'استعلام بمعاملات',en:'Parameterised query',
 pa:'اكتب `buildQuery(name)` التي لا تلصق المُدخل في نص الاستعلام، بل تُرجع {sql, params} حيث sql هو "SELECT * FROM users WHERE name = ?" وparams مصفوفة فيها name.',pe:'Write `buildQuery(name)` that never pastes input into the SQL text and instead returns {sql, params}, with sql "SELECT * FROM users WHERE name = ?" and params an array holding name.',
 start:'function buildQuery(name) {\n  // vulnerable version:\n  return "SELECT * FROM users WHERE name = \'" + name + "\'";\n}',
 tests:[['buildQuery("lina")',{sql:'SELECT * FROM users WHERE name = ?',params:['lina']}],['buildQuery("\' OR \'1\'=\'1").sql','SELECT * FROM users WHERE name = ?'],['buildQuery("\' OR \'1\'=\'1").params[0]',"' OR '1'='1"]],
 ha:'نص الاستعلام ثابت تمامًا، والمُدخل يذهب إلى params فقط.',he:'The SQL text is completely fixed; the input only goes into params.',
 sol:'function buildQuery(name) {\n  return { sql: "SELECT * FROM users WHERE name = ?", params: [name] };\n}'},
{k:'entropy',tr:'cy',mod:'cy-iam',zh:'密码熵',py:'mìmǎ shāng',ar:'إنتروبيا كلمة المرور',en:'Password entropy',
 pa:'الإنتروبيا التقريبية = الطول × log2(حجم مجموعة الرموز). المجموعة: 26 للحروف الصغيرة، +26 للكبيرة، +10 للأرقام، +33 للرموز الأخرى إن وُجدت. اكتب `entropy(p)` وأرجعها مقرّبة لأقرب عدد صحيح.',pe:'Approximate entropy = length × log2(pool size). The pool adds 26 for lower case, 26 for upper case, 10 for digits and 33 for any other symbols present. Write `entropy(p)`, rounded to the nearest integer.',
 start:'function entropy(p) {\n  // your code\n}',
 tests:[['entropy("abc")',14],['entropy("Abc1")',24],['entropy("correcthorsebatterystaple")',118],['entropy("")',0],['entropy("P@ss")',26]],
 ha:'استخدم اختبارات مثل /[a-z]/.test(p) لبناء حجم المجموعة، ثم Math.round(p.length * Math.log2(pool)).',he:'Use tests such as /[a-z]/.test(p) to build the pool, then Math.round(p.length * Math.log2(pool)).',
 sol:'function entropy(p) {\n  let pool = 0;\n  if (/[a-z]/.test(p)) pool += 26;\n  if (/[A-Z]/.test(p)) pool += 26;\n  if (/[0-9]/.test(p)) pool += 10;\n  if (/[^a-zA-Z0-9]/.test(p)) pool += 33;\n  return pool ? Math.round(p.length * Math.log2(pool)) : 0;\n}'},
{k:'xor',tr:'cy',mod:'cy-crypto',zh:'异或加密',py:'yìhuò jiāmì',ar:'تشفير XOR',en:'XOR cipher',
 pa:'XOR أساس كثير من الشيفرات: a ^ k ^ k = a. اكتب `xor(bytes, key)` التي تطبق XOR بين كل بايت ومفتاح متكرر (key مصفوفة بايتات)، وتُرجع مصفوفة جديدة. تطبيقها مرتين يعيد الأصل.',pe:'XOR underlies many ciphers: a ^ k ^ k = a. Write `xor(bytes, key)` XOR-ing each byte with a repeating key (an array of bytes) and returning a new array. Applying it twice gives back the original.',
 start:'function xor(bytes, key) {\n  // your code\n}',
 tests:[['xor([1, 2, 3], [1])',[0,3,2]],['xor([72, 105], [42, 7])',[98,110]],['xor(xor([10, 20, 30, 40], [5, 6]), [5, 6])',[10,20,30,40]],['xor([], [9])',[]]],
 ha:'bytes.map((b, i) => b ^ key[i % key.length]).',he:'bytes.map((b, i) => b ^ key[i % key.length]).',
 sol:'function xor(bytes, key) {\n  return bytes.map((b, i) => b ^ key[i % key.length]);\n}'}
];

/* ---------- 龙宝: a small red dragon drawn in SVG; moods: happy, cool, wow, sad, think ---------- */
/* Canva artwork (art/canva/longbao_<mood>.png) wins over the drawn SVG when it exists */
const DRAGON_ART={happy:['longbao_happy'],cool:['longbao_cool','longbao_win'],wow:['longbao_win'],sad:['longbao_sad'],think:['longbao_happy']};
function dragon(mood='happy',size=96){ const a=(DRAGON_ART[mood]||[]).map(k=>ART[k]).find(Boolean);

/* ---------- celebration: firecrackers + falling glyphs ---------- */
function fireworks(n=3){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; const c=document.createElement('canvas'); c.style.cssText='position:fixed;inset:0;z-index:95;pointer-events:none'; c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio; document.body.appendChild(c);
  const x=c.getContext('2d'); x.scale(devicePixelRatio,devicePixelRatio); const P=[], cols=['#ffd978','#f2c14e','#ff6f4f','#e2483a','#fff1c9'];
  for(let k=0;k<n;k++){ const cx=innerWidth*(.2+.6*Math.random()), cy=innerHeight*(.18+.3*Math.random()), col=cols[k%cols.length]; for(let i=0;i<46;i++){ const a=Math.PI*2*i/46, v=2+Math.random()*4.5; P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:60+Math.random()*30,c:col,d:k*12}); } }
  try{ [0,1,2].forEach(i=>{ tone(180+i*60,.12,'square',.04,i*.2); tone(1400,.05,'triangle',.03,i*.2+.05); }); }catch(e){}
  let f=0; (function step(){ x.clearRect(0,0,innerWidth,innerHeight); P.forEach(p=>{ if(f<p.d) return; p.vy+=.06; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.l--; if(p.l>0){ x.globalAlpha=Math.min(1,p.l/30); x.fillStyle=p.c; x.beginPath(); x.arc(p.x,p.y,2.2,0,7); x.fill(); } });
    x.globalAlpha=1; if(++f<130) requestAnimationFrame(step); else c.remove(); })(); }

function checkBadges(){ S.badges=S.badges||{}; const h=new Date().getHours(); if(h<4&&S.todayXP>0) S.owl=1; let got=null;

/* dashed river joining the stones: measured after layout, redrawn on resize */
function drawPath(map){ if(!map) return; const go=()=>{ const r=map.getBoundingClientRect(); const pts=$$('.pnode',map).map(n=>{ const b=n.getBoundingClientRect(); return [b.left+b.width/2-r.left,b.top+b.height/2-r.top]; }); if(pts.length<2) return;
  let d=`M${pts[0][0]} ${pts[0][1]}`; for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i], my=(y0+y1)/2; d+=` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`; }
  let svgEl=$('svg.river',map); if(!svgEl){ map.insertAdjacentHTML('afterbegin','<svg class="river" aria-hidden="true"><path/></svg>'); svgEl=$('svg.river',map); }
  svgEl.setAttribute('width',r.width); svgEl.setAttribute('height',r.height); $('path',svgEl).setAttribute('d',d); };
  requestAnimationFrame(go); const ro=window.ResizeObserver?new ResizeObserver(go):null; if(ro){ ro.observe(map); const prev=cleanup; cleanup=()=>{ ro.disconnect(); prev&&prev(); }; } }
/* the track is a winding path of seal-stamped stones; the next stone carries Lóngbǎo, every stone has a boss */
SCREENS.track=(m,tr)=>{ tr=tr==='cy'?'cy':'se'; const ms=TRACK(tr), d=ms.filter(x=>modDone(x.k)).length, cur=nextMod(tr);
  const X=[50,22,50,78]; const node=(x,i)=>{ const s=S.mods[x.k]||{}, free=modFree(x), here=cur&&cur.k===x.k, b=bossOf(x.k);
    return `<div class="pstep" style="--x:${X[i%4]}%"><div class="pcol"><button class="pnode ${s.done?'done':''} ${free?'':'locked'} ${here?'here':''}" data-k="${x.k}" aria-label="${esc(L(x))}">
      <span class="pic">${s.done?'<span class="stampmark">斩</span>':free?x.ic:ICON.lock}</span>${here?`<span class="phere">${dragon('happy',44)}</span>`:''}<span class="pboss" title="${esc(b.name)}">${b.e}</span></button>
      <div class="plabel"><b>${esc(L(x))}</b><span class="zh">${esc(x.zh)}</span>${s.done?stars(s.stars||1):`<span class="sub">${modStepsDone(x.k)}/4</span>`}</div></div></div>`; };

  <div class="seg" id="tsg"><button data-t="se" aria-pressed="${tr==='se'}">💻 ${t('trSE')}</button><button data-t="cy" aria-pressed="${tr==='cy'}">🛡️ ${t('trCY')}</button></div>
  <div class="row card"><div class="grow"><div class="bar ${tr}"><i style="width:${d/ms.length*100}%"></i></div><div class="sub" style="margin-top:6px"><span class="num">${d}/${ms.length}</span> ${t('done')} · <span class="num">${d}</span> ${isAr()?'وحوش هُزمت':'bosses defeated'}</div></div><button class="btn sm ghost" id="ex">📝 ${t('exam')}</button></div>
  <div class="pathmap">${ms.map(node).join('')}<div class="pend"><span class="brushzh">${tr==='se'?'毕业':'护法'}</span></div></div>
  ${certCard(tr)}`);
  $('#bk',m).onclick=()=>goBack('learn'); $('#ex',m).onclick=()=>go('exam',tr);
  $$('#tsg button',m).forEach(b=>b.onclick=()=>{ SFX.tap(); go('track',b.dataset.t); });
  $$('.pnode',m).forEach(b=>b.onclick=()=>{ SFX.tap(); const x=MOD[b.dataset.k]; if(!modFree(x)) return paywall(); go('module',x.k); });
  bindCert(m,tr); drawPath($('.pathmap',m)); const h=$('.pnode.here',m); if(h&&!NAV.stack.slice(-1)[0].y) setTimeout(()=>h.scrollIntoView({block:'center',behavior:'smooth'}),250); };

SCREENS.module=(m,k)=>{ const x=MOD[k]; if(!x) return SCREENS.learn(m); if(!modFree(x)){ m.insertAdjacentHTML('beforeend',topbar()); return paywall(); }
  const s=mst(x.k), lab=CODE_LABS.find(l=>l.mod===x.k);
  const step=(id,n,label,sub,done)=>`<button class="step ${done?'done':''}" data-s="${id}"><span class="sn">${done?'✓':n}</span><div class="grow"><b>${label}</b><div class="sub">${sub}</div></div><span aria-hidden="true">›</span></button>`;
  m.insertAdjacentHTML('beforeend',`${topbar()}<div class="row"><button class="icon-btn" id="bk" aria-label="${t('back')}">${backIcon()}</button><span class="tag ${x.tr}">${TRK[x.tr].name()} · <span class="num">${x.ti+1}</span></span><div class="grow"></div>${s.done?stars(s.stars||1):''}</div>
  <div class="mhero"><div class="row" style="align-items:flex-start"><div class="grow"><h1>${x.ic} ${esc(L(x))}</h1><p class="sub" style="margin-top:6px">${esc(L(x,'sa','se'))}</p></div></div>
    <div class="row"><span class="zhbig">${esc(x.zh)}</span><button class="speak" id="say" aria-label="🔊">${ICON.speak}</button></div><span class="py">${esc(x.py)}</span></div>
  <div class="steps">${step('L',1,t('stepL'),`<span class="num">${x.L.length}</span> ${t('lessons')}`,s.L)}${step('Q',2,`${bossOf(x.k).e} ${isAr()?'قاتل':'Fight'} ${esc(bossOf(x.k).name)}`,s.Qb!=null?`${t('score')}: <span class="num">${Math.round(s.Qb*100)}%</span>`:`<span class="num">${x.Q.length}</span> ${t('questions')}`,s.Q)}
    ${step('T',3,t('stepT'),`<span class="num">${x.T.length}</span> · ${x.T.slice(0,3).map(w=>`<span class="han">${esc(w.h)}</span>`).join(' · ')}`,s.T)}${step('D',4,t('stepD'),`<span class="num">${x.D.length}</span> · ${t('dialog')}`,s.D)}
    ${lab?step('lab','⌨',t('stepLab'),esc(L(lab))+' · <span class="han">'+esc(lab.zh)+'</span>',!!S.labs[lab.k]):''}</div>`);
  $('#bk',m).onclick=()=>goBack('learn'); $('#say',m).onclick=()=>speak(x.zh);
  $$('.step',m).forEach(b=>b.onclick=()=>{ SFX.tap(); const id=b.dataset.s;
    if(id==='L') go('lesson',{k,i:0}); if(id==='Q') go('quizrun',{k}); if(id==='T') go('practice',{k}); if(id==='D') dialogSheet(x); if(id==='lab') openCodeLab(lab.k); }); };

function dialogSheet(x){ let playing=false;
  sheet(`<div class="row"><h2 class="grow">💬 ${t('dialog')}</h2><button class="btn sm ghost" id="pa">▶</button></div><span class="han" style="color:var(--zh)">${esc(x.zh)}</span>
    <div class="dlg">${x.D.map((d,i)=>`<div class="dl ${d.s}"><span class="who">${d.s}</span><div class="grow"><div class="zhline han">${esc(d.zh)}</div><div class="py" style="font-size:13px">${esc(d.py)}</div><div class="sub" dir="auto">${esc(L(d))}</div></div><button class="speak" data-i="${i}" aria-label="🔊">${ICON.speak}</button></div>`).join('')}</div>
    <button class="btn block" id="dd">${t('done')} ✓</button>`,el=>{
    $$('.speak',el).forEach(b=>b.onclick=()=>{ const d=x.D[+b.dataset.i]; speak(d.zh,{voice:d.s==='A'?'n':'p'}); });
    $('#pa',el).onclick=async()=>{ if(playing){ playing=false; stopVoice(); return; } playing=true; for(const d of x.D){ if(!playing) break; await speak(d.zh,{voice:d.s==='A'?'n':'p'}); await new Promise(r=>setTimeout(r,350)); } playing=false; };
    $('#dd',el).onclick=()=>{ playing=false; stopVoice(); const s=mst(x.k); if(!s.D){ s.D=1; save(); addXP(5); } closeSheet(); const fin=checkModDone(x); render(); if(fin) moduleDone(x); }; }); }

/* ---------- quiz engine (learn mode: feedback after each answer; exam mode: feedback at the end; boss mode: HP and hearts) ---------- */
const qFrom=(q,mod)=>{ const o=q.o.map((p,j)=>({h:inl(isAr()?p[0]:p[1]),ok:j===0})); return {q:inl(L(q,'qa','qe')),opts:shuffle(o),why:inl(L(q,'wa','we')),mod}; };
function runQuiz(m,{qs,title,exam,seconds,boss,onDone,onQuit}){ let i=0, right=0, timer=null, end=seconds?Date.now()+seconds*1000:0; const log=[];
  const hearts0=boss?qs.length-Math.ceil(qs.length*.7)+1:0; let hearts=hearts0;
  const prev=cleanup; cleanup=()=>{ clearInterval(timer); prev&&prev(); };
  const fmtT=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  if(seconds) timer=setInterval(()=>{ const left=Math.max(0,Math.round((end-Date.now())/1000)); const el=$('#qt',m); if(el) el.textContent=fmtT(left); if(!left){ clearInterval(timer); finish(); } },500);
  const bossBox=()=>`<div class="boss" id="bs"><div class="row"><span class="bossface" id="bf">${boss.e}</span><div class="grow" style="min-width:0"><span class="brushzh" style="font-size:18px">${esc(boss.zh)}</span><b style="display:block">${esc(boss.name)}</b>
      <div class="hp"><i id="hp" style="width:${100-right/qs.length*100}%"></i></div></div></div>
      <div class="row" style="justify-content:space-between"><span class="hearts" aria-label="${hearts}">${'❤️'.repeat(hearts)}${'🖤'.repeat(hearts0-hearts)}</span><span class="taunt" id="tn">${esc(pickL(TAUNTS))}</span></div></div>`;
  function draw(){ const q=qs[i]; $$('.feedback').forEach(f=>f.remove());

/* ---------- code labs: run code in a throw-away Web Worker so even an infinite loop can't freeze the app ---------- */
const WORKER=`const canon=v=>v&&typeof v==='object'?(Array.isArray(v)?'['+v.map(canon).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'):JSON.stringify(v);
onmessage=async e=>{const {src,tests}=e.data;const out=[];const con={log:(...a)=>out.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' ')),error:(...a)=>out.push('✖ '+a.join(' ')),assert:(c,m)=>{ if(!c) out.push('✖ assertion failed'+(m?': '+m:'')); }};
try{ const AF=Object.getPrototypeOf(async function(){}).constructor;
 if(tests){ const R=[]; for(const [c,ex] of tests){ try{ const v=await new AF('console',src+'\\n;return ('+c+');')(con); R.push({c,ex:canon(ex),v:v===undefined?'undefined':canon(v),ok:canon(v)===canon(ex)}); }catch(err){ R.push({c,ex:canon(ex),err:err.name+': '+err.message,ok:false}); } } postMessage({out,tests:R}); return; }
 await new AF('console',src)(con); setTimeout(()=>postMessage({out}),200);
}catch(err){ setTimeout(()=>postMessage({out,err:err.name,msg:err.message}),0); } };`;
function runCode(src,tests){ return new Promise(res=>{ let wk=null; try{ wk=new Worker(URL.createObjectURL(new Blob([WORKER],{type:'text/javascript'}))); }catch(e){ wk=null; }
  if(!wk){ (async()=>{ const out=[], con={log:(...a)=>out.push(a.map(String).join(' ')),error:(...a)=>out.push('✖ '+a.join(' ')),assert:()=>{}}, canon=v=>v&&typeof v==='object'?(Array.isArray(v)?'['+v.map(canon).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'):JSON.stringify(v);
    const AF=Object.getPrototypeOf(async function(){}).constructor;   // fallback without a worker (no infinite-loop guard)
    try{ if(!tests){ await new AF('console',src)(con); return res({out}); } const R=[]; for(const [c,ex] of tests){ try{ const v=await new AF('console',src+'\n;return ('+c+');')(con); R.push({c,ex:canon(ex),v:v===undefined?'undefined':canon(v),ok:canon(v)===canon(ex)}); }catch(err){ R.push({c,ex:canon(ex),err:err.name+': '+err.message,ok:false}); } } res({out,tests:R}); }
    catch(err){ res({out,err:err.name,msg:err.message}); } })(); return; }
  const to=setTimeout(()=>{ wk.terminate(); res({out:[],err:'Timeout',msg:'> 2 s (infinite loop?)',tests:tests?tests.map(([c,ex])=>({c,ex:JSON.stringify(ex),err:'Timeout',ok:false})):null}); },2000);
  wk.onmessage=e=>{ clearTimeout(to); wk.terminate(); res(e.data); }; wk.onerror=e=>{ clearTimeout(to); wk.terminate(); res({out:[],err:'SyntaxError',msg:e.message||''}); e.preventDefault&&e.preventDefault(); };
  wk.postMessage({src,tests}); }); }
const termHTML=(r,title)=>`<div class="term"><div class="tbar"><i></i><i></i><i></i><span>${esc(title)}</span></div><pre>${[...(r.out||[]).map(esc),r.err?`<span class="trow-bad">✖ ${esc(r.err)}: ${esc(r.msg||'')}</span>`:'',
  ...(r.tests||[]).map(x=>`<span class="${x.ok?'trow-ok':'trow-bad'}">${x.ok?'✔':'✖'} ${esc(x.c)}${x.ok?'':`\n   ${t('expected')}: ${esc(x.ex)}\n   ${t('got')}: ${esc(x.err||x.v)}`}</span>`)].filter(Boolean).join('\n')||'<span class="sub">…</span>'}</pre></div>`;

const b64dec=s=>{ s=s.trim().replace(/-/g,'+').replace(/_/g,'/').replace(/\s+/g,''); while(s.length%4) s+='='; const bin=atob(s); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); };
const b64enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const hexdec=s=>{ const h=s.replace(/[^0-9a-f]/gi,''); return new TextDecoder().decode(Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16))); };
const hexenc=s=>[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join('');
const bindec=s=>new TextDecoder().decode(Uint8Array.from(s.trim().split(/\s+/).filter(Boolean),x=>parseInt(x,2)));
const rotN=(s,n)=>s.replace(/[a-z]/gi,c=>{ const b=c<='Z'?65:97; return String.fromCharCode(((c.charCodeAt(0)-b+n)%26+26)%26+b); });
const xorHex=(s,k)=>{ const h=s.replace(/[^0-9a-f]/gi,''); return String.fromCharCode(...(h.match(/../g)||[]).map(x=>parseInt(x,16)^k)); };
const TOOLS=[['b64d','Base64 → text',s=>b64dec(s)],['b64e','text → Base64',s=>b64enc(s)],['hexd','Hex → text',s=>hexdec(s)],['hexe','text → Hex',s=>hexenc(s)],['bind','Binary → text',s=>bindec(s)],['urld','URL decode',s=>decodeURIComponent(s)],['rev','Reverse',s=>[...s].reverse().join('')],['rot13','ROT13',s=>rotN(s,13)]];

/* ---------- firewall simulator: generated rules, first match wins, implicit deny ---------- */
const FW_SVC=[[22,'ssh'],[25,'smtp'],[53,'dns'],[80,'http'],[443,'https'],[3306,'mysql'],[3389,'rdp'],[5432,'postgres'],[6379,'redis']];
function fwRound(rnd,lv){ const ri=n=>Math.floor(rnd()*n), srcNets=['10.0.1.0/24','10.0.2.0/24','any'], hosts=['10.0.9.5','10.0.9.6'];
  const rules=[], n=3+lv;
  for(let j=0;j<n-1;j++){ const svc=FW_SVC[ri(FW_SVC.length)]; rules.push({a:rnd()<.6?'allow':'deny',p:lv>=3&&rnd()<.3?'udp':'tcp',src:lv>=2?srcNets[ri(3)]:'any',dst:lv>=3?hosts[ri(2)]:'any',port:svc[0]}); }
  if(lv<3) rules.push({a:'deny',p:'any',src:'any',dst:'any',port:'any'});
  const svc=rnd()<.7?rules[ri(rules.length)].port:FW_SVC[ri(FW_SVC.length)][0];
  const pk={p:lv>=3&&rnd()<.25?'udp':'tcp',src:lv>=2?(rnd()<.5?'10.0.1.':'10.0.2.')+(10+ri(200)):'198.51.100.'+(2+ri(250)),dst:lv>=3?hosts[ri(2)]:'10.0.9.5',port:svc==='any'?443:svc};
  const inNet=(ip,net)=>net==='any'||ip.startsWith(net.split('.').slice(0,3).join('.')+'.');
  const hit=rules.findIndex(r=>(r.p==='any'||r.p===pk.p)&&inNet(pk.src,r.src)&&(r.dst==='any'||r.dst===pk.dst)&&(r.port==='any'||r.port===pk.port));
  return {rules,pk,hit,ans:hit<0?'deny':rules[hit].a}; }
SCREENS.fwlab=(m,arg)=>{ const daily=arg&&arg.daily; const lv=daily?2:Math.max(1,Math.min(3,(arg&&arg.lv)|0||1)); if(!daily&&lv>1&&!S.pro) return paywall();

    m.innerHTML=`<div class="qhead"><button class="icon-btn" id="qx" aria-label="${t('close')}">${ICON.close}</button><div class="bar"><i style="width:${k/N*100}%"></i></div><span class="sub num">${k+1}/${N}</span></div>

      ${r.rules.map((x,j)=>`<tr data-j="${j}"><td>${j+1}</td><td class="${x.a==='allow'?'al':'dn'}">${x.a}</td><td>${x.p}</td><td>${x.src}</td><td>${x.dst}</td><td>${x.port}${svcName(x.port)?' '+svcName(x.port):''}</td></tr>`).join('')}</tbody></table></div>
    <div class="packet"><b>${t('packet')}</b> → ${r.pk.p.toUpperCase()} ${r.pk.src} → ${r.pk.dst}:${r.pk.port} ${svcName(r.pk.port)}</div>
    <div class="grid2"><button class="btn" id="al">✓ ${t('allow')}</button><button class="btn danger" id="dn">✕ ${t('deny')}</button></div><div id="ex"></div>`;
    $('#qx',m).onclick=()=>go(daily?'home':'labs');
    $$('#lvs button',m).forEach(b=>b.onclick=()=>{ const x=+b.dataset.l; if(x>1&&!S.pro) return paywall(); go('fwlab',{lv:x}); });
    const answer=a=>{ $$('#al,#dn',m).forEach(b=>b.disabled=true); const ok=a===r.ans; if(ok) right++; ok?SFX.ok():SFX.bad(); haptic(ok?'success':'error');
      if(r.hit>=0) $(`tr[data-j="${r.hit}"]`,m).classList.add('hit');

  const finish=()=>{ const p=right/N, ok=p>=.8; addXP(right*2); if(daily){ if(ok) dailyReward(); } else { if(ok){ S.fwBest=Math.max(S.fwBest||0,lv); addCoins(15); } } save(); ok?(SFX.win(),confetti(60)):SFX.bad();

  draw(); };

/* ---------- password & hash lab ---------- */
/* SHA-256 in plain JS so it works in every web view (crypto.subtle needs a secure context) */
function sha256(str){ const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b=[...new TextEncoder().encode(str)], l=b.length*8; b.push(0x80); while(b.length%64!==56) b.push(0); for(let i=7;i>=0;i--) b.push(i>3?0:(l>>>(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const r=(x,n)=>x>>>n|x<<(32-n);
  for(let o=0;o<b.length;o+=64){ const w=[]; for(let i=0;i<16;i++) w[i]=b[o+i*4]<<24|b[o+i*4+1]<<16|b[o+i*4+2]<<8|b[o+i*4+3];
    for(let i=16;i<64;i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^w[i-15]>>>3, s1=r(w[i-2],17)^r(w[i-2],19)^w[i-2]>>>10; w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
