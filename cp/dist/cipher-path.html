  const lg=$('#lg',m), pn=$('#pn',m); const bindSp=el=>$$('.speak',el).forEach(b=>b.onclick=()=>speak(b.dataset.z,{voice:b.dataset.v}));
  const end=()=>requestAnimationFrame(()=>{ window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); });
  function partner(){ const tn=s.turns[ti]; lg.insertAdjacentHTML('beforeend',`<div class="tkmsg them" dir="ltr"><span class="tkface">${face}</span><div class="tkbub"><span class="dots"><i></i><i></i><i></i></span></div></div>`); end(); pn.innerHTML='';
    timer=setTimeout(()=>{ lg.lastElementChild.remove(); lg.insertAdjacentHTML('beforeend',bubble('them',tn.p[0],tn.p[1],isAr()?tn.p[2]:tn.p[3])); bindSp(lg.lastElementChild); speak(tn.p[0],{voice:'p'}); choices(); end(); },600); }
  function choices(){ const tn=s.turns[ti], opts=shuffle(tn.o); let tries=0, done=false;
    pn.innerHTML=`<div class="row"><b class="grow">${isAr()?'اختر ردّك':'Choose your reply'}</b><button class="btn ghost sm" id="hi">${ICON.hint}</button></div>${opts.map((o,j)=>`<button class="tkopt" data-j="${j}" dir="ltr"><span class="han" style="font-size:16px">${esc(o.zh)}</span><span class="py" style="font-size:12px">${esc(o.py)}</span><span class="tr2" dir="auto">${esc(isAr()?o.ar:o.en)}</span></button>`).join('')}<div id="fb"></div>`;
    $('#hi',pn).onclick=()=>{ pn.classList.add('hinted'); SFX.tap(); };
    $$('.tkopt',pn).forEach(b=>b.onclick=()=>{ if(done||b.disabled) return; const o=opts[+b.dataset.j]; tries++; b.disabled=true;
      if(o.t==='A'){ done=true; score+=tries===1?3:tries===2?1:0; b.classList.add('right'); SFX.ok(); haptic('success'); $$('.tkopt',pn).forEach(x=>{ if(x!==b) x.classList.add('dim'); });
        lg.insertAdjacentHTML('beforeend',bubble('me',o.zh,o.py,isAr()?o.ar:o.en)); bindSp(lg.lastElementChild); speak(o.zh);
        $('#fb',pn).innerHTML=`<button class="btn block" id="nx">${t('next')} →</button>`; $('#nx',pn).onclick=()=>{ SFX.tap(); pn.classList.remove('hinted'); ti++; ti<s.turns.length?partner():summary(); }; end(); }
      else { b.classList.add(o.t==='B'?'meh':'wrong'); SFX.bad(); haptic('error'); $('#fb',pn).innerHTML=`<div class="tkfb ${o.t==='B'?'meh':'bad'}"><b>${o.t==='B'?'≈':'✕'}</b> ${esc(isAr()?o.na:o.ne)}</div>`; } }); }
  function summary(){ questEvent('talk'); const max=s.turns.length*3, st=score/max>=.9?3:score/max>=.6?2:1, k=d.k+'/'+s.k; S.talk=S.talk||{}; S.talk[k]=Math.max(S.talk[k]||0,st); addXP(15+score); const c=addCoins(10+st*5); save(); SFX.win(); confetti(st===3?100:50); track('talk_done',{k,st});
    pn.innerHTML=`<div class="card col" style="gap:10px;text-align:center;align-items:center"><h2>✓ ${isAr()?'أكملت المحادثة!':'Conversation complete!'}</h2>${stars(st)}<div class="sub">+${15+score} ${t('xp')} · +${c} ${t('bitsCur')}</div>
      <div class="row" style="width:100%"><button class="btn ghost grow" id="ag">↺</button>${d.scenes[si+1]?`<button class="btn grow" id="ns">${t('next')} →</button>`:`<button class="btn grow" id="dn">${t('finish')}</button>`}</div></div>`; end();
    $('#ag',pn).onclick=()=>go('talkscene',{d:d.k,i:si}); const ns=$('#ns',pn); if(ns) ns.onclick=async()=>{ await interstitial(); tkFree(si+1)?go('talkscene',{d:d.k,i:si+1}):paywall(); };
    const dn=$('#dn',pn); if(dn) dn.onclick=async()=>{ await interstitial(); go('talk',{d:d.k}); }; }
  partner(); };

/* ===== Quick games: 60-second rounds. Term sprint (Chinese → meaning), bits & hex conversions, ports & services ===== */
const GAMES={
  sprint:()=>{ const w=TERMS[Math.random()*TERMS.length|0], o=pick(TERMS.filter(x=>x.tr===w.tr&&mean(x)!==mean(w)),3);
    return {q:`<div class="gbig han">${esc(w.h)}</div><div class="py">${esc(w.p)}</div>`,opts:shuffle([w,...o]).map(x=>({h:esc(mean(x)),ok:x===w})),say:w.h}; },
  bits:()=>{ const n=Math.random()*256|0, kind=Math.random()*3|0, bin=v=>v.toString(2).padStart(8,'0'), hex=v=>'0x'+v.toString(16).toUpperCase().padStart(2,'0');
    const near=()=>{ const s=new Set([n]); while(s.size<4){ const d=[1,2,4,8,16,32,64,128][Math.random()*8|0]; s.add((n^d)&255); } return shuffle([...s]); };
    const opts=near();
    if(kind===0) return {q:`<div class="sub">${isAr()?'حوّل إلى ثنائي':'To binary'}</div><div class="gbig">${n}</div>`,opts:opts.map(v=>({h:`<span class="mono">${bin(v)}</span>`,ok:v===n}))};
    if(kind===1) return {q:`<div class="sub">${isAr()?'حوّل إلى عشري':'To decimal'}</div><div class="gbig" style="font-size:30px">${bin(n)}</div>`,opts:opts.map(v=>({h:`<span class="num">${v}</span>`,ok:v===n}))};
    return {q:`<div class="sub">${isAr()?'حوّل إلى سداسي عشري':'To hex'}</div><div class="gbig">${n}</div>`,opts:opts.map(v=>({h:`<span class="mono">${hex(v)}</span>`,ok:v===n}))}; },
  ports:()=>{ const p=PORTS[Math.random()*PORTS.length|0], o=pick(PORTS.filter(x=>x!==p),3); const rev=Math.random()<.35;
    return rev?{q:`<div class="sub">${isAr()?'ما منفذ':'Which port is'}</div><div class="gbig" style="font-size:34px">${esc(p[1])}</div>`,opts:shuffle([p,...o]).map(x=>({h:`<span class="num">${x[0]}</span>`,ok:x===p}))}
      :{q:`<div class="sub">${isAr()?'أي خدمة على المنفذ':'Which service uses port'}</div><div class="gbig">${p[0]}</div>`,opts:shuffle([p,...o]).map(x=>({h:esc(x[1]),ok:x===p}))}; }
};
SCREENS.game=(m,k)=>{ if(!GAMES[k]) return go('labs'); let score=0, streak=0, end=Date.now()+60000, iv=null, started=false;
  const prev=cleanup; cleanup=()=>{ clearInterval(iv); prev&&prev(); }; S.best=S.best||{};
  const intro=()=>{ m.innerHTML=`<div class="qhead"><button class="icon-btn" id="qx" aria-label="${t('close')}">${ICON.close}</button><span class="eyebrow grow">${t('arcade')}</span></div>
    <div class="gstage rise"><div class="gbig ${k==='sprint'?'han':''}" style="color:var(--acc)">${k==='sprint'?'中':k==='bits'?'01':'🔌'}</div><h1>${t(k)}</h1><p class="sub">${t(k+'B')}</p>${S.best[k]?`<div class="sub">★ <span class="num">${S.best[k]}</span></div>`:''}<button class="btn block" id="go">${t('start')} ▶</button></div>`;
    $('#qx',m).onclick=()=>go('labs'); $('#go',m).onclick=()=>{ started=true; end=Date.now()+60000; iv=setInterval(()=>{ const l=Math.max(0,Math.ceil((end-Date.now())/1000)); const el=$('#tm',m); if(el) el.textContent=l+'s'; if(!l) over(); },250); round(); }; };
  const round=()=>{ const r=GAMES[k]();
    m.innerHTML=`<div class="qhead"><button class="icon-btn" id="qx" aria-label="${t('close')}">${ICON.close}</button><span class="timer num" id="tm">${Math.ceil((end-Date.now())/1000)}s</span><div class="grow"></div><b class="num">★ ${score}</b>${streak>2?`<span class="tag" style="color:var(--amber)">×2</span>`:''}</div>
      <div class="gstage">${r.q}</div><div class="grid2">${r.opts.map((o,j)=>`<button class="opt" data-j="${j}" style="justify-content:center;min-height:64px">${o.h}</button>`).join('')}</div>`;
    $('#qx',m).onclick=()=>{ clearInterval(iv); go('labs'); }; if(r.say) speak(r.say);
    $$('.opt',m).forEach(b=>b.onclick=()=>{ const o=r.opts[+b.dataset.j]; if(o.ok){ streak++; score+=streak>2?2:1; questEvent('right'); SFX.combo(Math.min(14,streak)); haptic('light'); b.classList.add('right'); setTimeout(round,180); }
      else { streak=0; SFX.bad(); haptic('error'); b.classList.add('wrong'); $$('.opt',m).forEach((x,j)=>{ if(r.opts[j].ok) x.classList.add('right'); }); setTimeout(round,650); } }); };
  const over=()=>{ clearInterval(iv); const best=score>(S.best[k]||0); if(best) S.best[k]=score; addXP(Math.min(30,score)); const c=addCoins(Math.min(25,score)); save(); SFX.win(); if(best&&score) confetti(70); track('game',{k,score});
    m.innerHTML=`<div class="result rise"><div class="big num">${score}</div><h1>${best&&score?'🏆 ★':t('score')}</h1><div class="sub">★ <span class="num">${S.best[k]||0}</span> · +${c} ${t('bitsCur')}</div>
      <div class="row" style="width:100%"><button class="btn ghost grow" id="ag">↺ ${t('again')}</button><button class="btn grow" id="dn">${t('finish')}</button></div></div>`;
    $('#ag',m).onclick=()=>go('game',k); $('#dn',m).onclick=async()=>{ await interstitial(); go('labs'); }; };
  intro(); };

/* ===== Me: progress, certificates, settings, PRO paywall, shop ===== */
SCREENS.me=m=>{ const r=rankOf(S.xp), nx=RANK_XP[r+1], labsN=Object.keys(S.labs).length+['phish','logs','review','ctf'].reduce((a,k)=>a+secSolved(k),0);
  const seg=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</div>`;
  m.insertAdjacentHTML('beforeend',`${topbar()}<div class="hero"><span class="eyebrow">${t('profile')}</span><div class="row" style="gap:12px"><span class="sealchip">${RANK_ZH[r]}</span><h1 class="grow">${t('ranks')[r]}</h1></div>
    <div class="bar"><i style="width:${nx?Math.min(100,(S.xp-RANK_XP[r])/(nx-RANK_XP[r])*100):100}%"></i></div><div class="sub"><span class="num">${fmt(S.xp)}</span> ${t('xp')}${nx?` · ${t('ranks')[r+1]} <span class="num">${fmt(nx)}</span>`:''}</div></div>
  <div class="grid2"><div class="stat"><b class="num">${MODS.filter(x=>modDone(x.k)).length}/${MODS.length}</b><span>${t('statMods')}</span></div><div class="stat"><b class="num">${labsN}</b><span>${t('statLabs')}</span></div>
    <div class="stat"><b class="num">${Object.keys(S.srs).length}</b><span>${t('statTerms')}</span></div><div class="stat"><b class="num">${S.right||0}</b><span>${t('statQs')}</span></div></div>
  <div class="card col" style="gap:12px"><div class="row"><b class="grow">印章 · ${isAr()?'الأختام':'Seals'}</b><span class="sub num">${Object.keys(S.badges||{}).length}/${BADGES.length}</span></div><div class="seals">${BADGES.map(b=>sealHTML(b,!!(S.badges||{})[b[0]])).join('')}</div></div>
  <div class="card col" style="gap:10px"><b>🎓 ${t('certs')}</b>${['se','cy'].map(tr=>{ const d=TRACK(tr).filter(x=>modDone(x.k)).length, n=TRACK(tr).length; return `<button class="track ${tr}" data-c="${tr}"><span class="ti">${TRK[tr].ic}</span><div class="grow"><b>${TRK[tr].name()}</b><div class="bar ${tr}" style="margin-top:6px"><i style="width:${d/n*100}%"></i></div></div><span class="sub num">${d}/${n}</span></button>`; }).join('')}</div>
  ${S.pro?`<div class="card row"><span class="chip pro">PRO</span><span class="grow">${t('proOn')}</span></div>`:`<button class="contcard tap" id="gp" style="text-align:start"><b style="font-size:18px">⚡ ${t('payT')}</b><span class="sub">${t('payB')}</span><span class="btn block">${t('getPro')}</span></button>`}
  <h2>${t('settings')}</h2>
  <div class="card col" style="gap:14px">
    <div class="col" style="gap:6px"><b>${t('language')}</b>${seg('lng',[['ar','العربية'],['en','English']],S.lang)}</div>
    <div class="col" style="gap:6px"><b>${t('theme')}</b>${seg('thm',[['dark','🌙 '+t('dark')],['light','☀️ '+t('light')]],S.theme==='light'?'light':'dark')}</div>
    <div class="col" style="gap:6px"><b>${t('dailyGoal')}</b>${seg('gl',[[20,'20'],[30,'30'],[50,'50'],[80,'80']],S.goal)}</div>
    <div class="col" style="gap:6px"><b>${t('voiceSpeed')}</b>${seg('vsp',[['slow',t('slow')],['normal',t('normal')],['fast',t('fast')]],S.vSpeed||'normal')}<button class="btn ghost sm" id="vt" style="align-self:flex-start">🔊 网络安全</button></div>
    <div class="col" style="gap:6px"><b>${t('sound')}</b>${seg('snd',[['1',t('on')],['0',t('off')]],S.sound?'1':'0')}</div>
    <div class="col" style="gap:6px"><b>${t('reminder')}</b>${seg('rem',[['0',t('off')],['9','09:00'],['20','20:00']],S.remind||'0')}</div>
  </div>
  <div class="card col" style="gap:4px">${[['rs','restore'],['pv','privacy'],['tm','terms2'],['sp','support']].concat(window.__adPrivacy?[['ap','adPrivacy']]:[]).map(([id,k])=>`<button class="link" id="${id}" style="text-align:start">${t(k)}</button>`).join('<hr>')}</div>
  <button class="btn danger block" id="rz">${t('resetAll')}</button><div class="sub" style="text-align:center">Cipher Path 1.0 · Kinzhal</div>`);
  const segBind=(id,fn)=>$$(`#${id} button`,m).forEach(b=>b.onclick=()=>{ SFX.tap(); fn(b.dataset.v); });
  segBind('lng',v=>{ S.lang=v; save(); render(); }); segBind('thm',v=>{ if((S.theme==='light'?'light':'dark')!==v) toggleTheme(); render(); });
  segBind('gl',v=>{ S.goal=+v; save(); render(); }); segBind('vsp',v=>{ S.vSpeed=v; save(); render(); speak('网络安全'); }); segBind('snd',v=>{ S.sound=v==='1'; save(); render(); });
  segBind('rem',v=>{ S.remind=v; save(); render(); if(RN&&v!=='0') native('notify:permission',{}).then(r=>{ if(r&&r.granted) native('notify:schedule',{items:[{id:'daily',repeat:'daily',hour:+v,minute:0,title:'Cipher Path',body:isAr()?'5 دقائق اليوم تحافظ على سلسلتك 🔥':'5 minutes today keeps your streak going 🔥'}]}); }); else if(RN) native('notify:schedule',{items:[]}); });
  $('#vt',m).onclick=()=>speak('网络安全');
  $$('[data-c]',m).forEach(b=>b.onclick=()=>go('track',b.dataset.c));
  const gp=$('#gp',m); if(gp) gp.onclick=()=>paywall();
  $('#rs',m).onclick=async()=>{ const r=await restorePurchases(); toast(r&&r.active?t('proOn'):(isAr()?'لا توجد مشتريات':'No purchases found')); };
  $('#pv',m).onclick=()=>openUrl(LEGAL.privacy); $('#tm',m).onclick=()=>openUrl(LEGAL.terms); $('#sp',m).onclick=()=>openUrl(LEGAL.support);
  const ap=$('#ap',m); if(ap) ap.onclick=()=>RN&&native('ads:privacy',{});
  let armed=false; $('#rz',m).onclick=()=>{ if(!armed){ armed=true; toast(t('resetQ')); return; } const keep={lang:S.lang,theme:S.theme,pro:S.pro}; S=Object.assign({},DEFAULT,keep,{srs:{},mods:{},labs:{},sec:{},talk:{},exams:{}}); save(); go('home'); }; };

function paywall(){ track('paywall'); let plan='pro_yearly';
  const plans=[['pro_monthly',t('monthly'),price('monthly'),''],['pro_yearly',t('yearly'),price('yearly'),`${price('yearlyPm')}${t('perMonth')}`],['pro_lifetime',t('lifetime'),price('lifetime'),'']];
  sheet(`<div class="lhero ondark" style="text-align:center;align-items:center"><div class="seal" style="width:56px;height:56px;font-size:26px">码</div><h2>${t('payT')}</h2><p class="sub">${t('payB')}</p></div>
    <div class="col" style="gap:8px">${['perk1','perk2','perk3','perk4','perk5'].map(k=>`<div class="perk"><i>✓</i><span>${t(k)}</span></div>`).join('')}</div>
    <div class="col" style="gap:8px" id="pl">${plans.map(([id,n,p,sub])=>`<button class="plan" data-p="${id}" aria-pressed="${id===plan}"><div class="grow"><b>${n}</b>${sub?`<div class="sub">${sub}</div>`:''}</div>${id==='pro_yearly'?`<span class="tag" style="color:var(--acc)">${t('best')}</span>`:''}<b class="num">${p}</b></button>`).join('')}</div>
    <button class="btn block" id="buy">${t('subscribe')}</button><div class="sub" style="text-align:center">${t('cancelAny')}${RN?'':' · '+t('demo')}</div>
    <div class="row" style="justify-content:center;gap:16px"><button class="link" id="rs">${t('restore')}</button><button class="link" id="tm">${t('terms2')}</button><button class="link" id="pv">${t('privacy')}</button></div>`,el=>{
    $$('.plan',el).forEach(b=>b.onclick=()=>{ plan=b.dataset.p; $$('.plan',el).forEach(x=>x.setAttribute('aria-pressed',x===b)); SFX.tap(); });
    $('#buy',el).onclick=async()=>{ const b=$('#buy',el); b.disabled=true; const r=await purchase(plan); b.disabled=false; track('purchase',{plan,ok:!!(r&&r.ok)});
      if(r&&r.ok&&r.active){ if(!RN){ S.pro=true; save(); } closeSheet(); SFX.win(); confetti(120); toast(t('proOn')); render(); } };
    $('#rs',el).onclick=async()=>{ const r=await restorePurchases(); toast(r&&r.active?t('proOn'):(isAr()?'لا توجد مشتريات':'No purchases found')); };
    $('#tm',el).onclick=()=>openUrl(LEGAL.terms); $('#pv',el).onclick=()=>openUrl(LEGAL.privacy); }); }

function shop(){ sheet(`<div class="row"><h2 class="grow">${t('shop')}</h2><span class="chip">${coinHTML}<span class="num" data-coins>${fmtK(S.coins)}</span></span></div>
  <div class="card row" style="gap:12px"><span style="font-size:26px">🧊</span><div class="grow"><b>${t('freeze')}</b><div class="sub">${t('freezeB')} · <span class="num">${S.freezes||0}</span></div></div><button class="btn sm" id="fz">${t('buy')} · 60</button></div>
  ${S.pro?'':`<div class="card row" style="gap:12px"><span style="font-size:26px">🎬</span><div class="grow"><b>${t('watchAd')}</b><div class="sub">${t('adReward')}</div></div><button class="btn sm ghost" id="ad">▶</button></div>
  <button class="contcard tap" id="gp" style="text-align:start"><b>⚡ ${t('payT')}</b><span class="sub">${t('payB')}</span></button>`}`,el=>{
  $('#fz',el).onclick=()=>{ if(S.pro||S.coins>=60){ if(!S.pro){ S.coins-=60; } S.freezes=(S.freezes||0)+1; save(); updateTop(); SFX.coin(); shop(); } else toast(t('notEnough')); };
  const ad=$('#ad',el); if(ad) ad.onclick=async()=>{ closeSheet(); if(await rewarded()){ addCoins(25); toast(t('adReward')); } };
  const gp=$('#gp',el); if(gp) gp.onclick=()=>paywall(); }); }

render();</script>
