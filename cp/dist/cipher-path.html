rent payment or shipping methods.","c":"const listeners = [];\nconst on = fn => listeners.push(fn);\nconst emit = data => listeners.forEach(fn => fn(data));\non(d => console.log(\"log:\", d));\non(d => console.log(\"alert:\", d));\nemit(\"order #42 paid\");"},{"ta":"المحوّل وحقن الاعتماديات وإعادة الهيكلة","te":"Adapter, dependency injection and refactoring","a":"المحوّل (Adapter) يغلّف واجهة قديمة أو خارجية لتطابق الواجهة التي يتوقعها كودك.\\nحقن الاعتماديات: مرّر الأدوات التي يحتاجها الكائن (قاعدة البيانات، المسجّل) بدل إنشائها داخله، فيسهل استبدالها بنسخ وهمية في الاختبار.\\nإعادة الهيكلة (Refactoring) تحسين بنية الكود دون تغيير سلوكه، بخطوات صغيرة تحميها الاختبارات.","e":"An adapter wraps an old or third-party interface so it matches the one your code expects.\\nDependency injection: pass in the tools an object needs (database, logger) instead of creating them inside, so tests can swap in fakes.\\nRefactoring improves the structure of code without changing its behaviour, in small steps protected by tests.","c":""}],"Q":[{"qa":"أي نمط يناسب «عدة طرق دفع قابلة للتبديل خلف واجهة واحدة»؟","qe":"Which pattern fits \"several interchangeable payment methods behind one interface\"?","o":[["الاستراتيجية","Strategy"],["المفرد","Singleton"],["المراقب","Observer"],["المحوّل","Adapter"]],"wa":"كل طريقة دفع استراتيجية، والكود يختار واحدة وقت التشغيل.","we":"Each payment method is a strategy; the code picks one at run time."},{"qa":"لماذا قد يصعّب نمط المفرد الاختبار؟","qe":"Why can a singleton make testing harder?","o":[["لأنه حالة عامة مشتركة بين الاختبارات","It is global state shared across tests"],["لأنه بطيء جدًا","It is very slow"],["لأنه يمنع الوراثة","It forbids inheritance"],["لأنه يحتاج قاعدة بيانات","It needs a database"]],"wa":"حالة اختبار قد تتسرب إلى اختبار آخر عبر النسخة الوحيدة.","we":"State from one test can leak into another through the single instance."},{"qa":"مكتبة دفع خارجية واجهتها `makePayment(cents)`، وكودك يتوقع `pay(amount)`. ماذا تكتب؟","qe":"A third-party library exposes `makePayment(cents)` but your code expects `pay(amount)`. What do you write?","o":[["محوّلًا (Adapter)","An adapter"],["مصنعًا (Factory)","A factory"],["مراقبًا (Observer)","An observer"],["مفردًا (Singleton)","A singleton"]],"wa":"المحوّل يترجم بين الواجهتين دون تعديل أيٍّ منهما.","we":"The adapter translates between the two interfaces without changing either."},{"qa":"ما فائدة حقن الاعتماديات؟","qe":"What does dependency injection give you?","o":[["سهولة استبدال الاعتماديات بنسخ وهمية في الاختبارات","Easy swapping of dependencies for fakes in tests"],["تشفيرًا تلقائيًا للبيانات","Automatic data encryption"],["كودًا أقصر دائمًا","Always shorter code"],["تحديث المكتبات تلقائيًا","Automatic library updates"]],"wa":"الكائن لا ينشئ أدواته، فتمرر له ما تشاء.","we":"The object doesn't build its own tools, so you hand it whatever you like."},{"qa":"ما إعادة الهيكلة (Refactoring)؟","qe":"What is refactoring?","o":[["تحسين بنية الكود دون تغيير سلوكه","Improving code structure without changing behaviour"],["إضافة ميزات جديدة","Adding new features"],["إعادة كتابة المشروع بلغة أخرى","Rewriting the project in another language"],["حذف الاختبارات القديمة","Deleting old tests"]],"wa":"السلوك يبقى كما هو، والاختبارات تثبت ذلك بعد كل خطوة.","we":"Behaviour stays the same, and tests prove it after every step."},{"qa":"أحداث النقر في المتصفح مثال على أي نمط؟","qe":"Browser click events are an example of which pattern?","o":[["المراقب","Observer"],["المصنع","Factory"],["الاستراتيجية","Strategy"],["المحوّل","Adapter"]],"wa":"`addEventListener` يسجّل مشتركًا يُستدعى عند وقوع الحدث.","we":"`addEventListener` registers a subscriber that runs when the event fires."}],"T":[{"h":"设计模式","p":"shèjì móshì","ar":"نمط تصميم","en":"design pattern"},{"h":"单例模式","p":"dānlì móshì","ar":"نمط المفرد","en":"singleton pattern"},{"h":"工厂模式","p":"gōngchǎng móshì","ar":"نمط المصنع","en":"factory pattern"},{"h":"观察者模式","p":"guāncházhě móshì","ar":"نمط المراقب","en":"observer pattern"},{"h":"策略模式","p":"cèlüè móshì","ar":"نمط الاستراتيجية","en":"strategy pattern"},{"h":"适配器","p":"shìpèiqì","ar":"محوّل","en":"adapter"},{"h":"依赖注入","p":"yīlài zhùrù","ar":"حقن الاعتماديات","en":"dependency injection"},{"h":"重构","p":"chónggòu","ar":"إعادة الهيكلة","en":"refactoring"},{"h":"可维护性","p":"kěwéihùxìng","ar":"قابلية الصيانة","en":"maintainability"},{"h":"代码异味","p":"dàimǎ yìwèi","ar":"رائحة الكود (مؤشر خلل)","en":"code smell"}],"D":[{"s":"A","zh":"这段代码有很多重复。","py":"Zhè duàn dàimǎ yǒu hěn duō chóngfù.","ar":"في هذا الجزء من الكود تكرار كثير.","en":"There's a lot of duplication in this code."},{"s":"B","zh":"可以用策略模式重构一下。","py":"Kěyǐ yòng cèlüè móshì chónggòu yíxià.","ar":"يمكن إعادة هيكلته بنمط الاستراتيجية.","en":"We could refactor it with the strategy pattern."},{"s":"A","zh":"重构前先补几个单元测试。","py":"Chónggòu qián xiān bǔ jǐ ge dānyuán cèshì.","ar":"قبل إعادة الهيكلة لنضف بعض اختبارات الوحدات.","en":"Let's add a few unit tests before refactoring."},{"s":"B","zh":"同意，这样更安全。","py":"Tóngyì, zhèyàng gèng ānquán.","ar":"موافق، هكذا أكثر أمانًا.","en":"Agreed, that's safer."}]},{"k":"se-git","tr":"se","ic":"🌿","zh":"版本控制","py":"bǎnběn kòngzhì","ar":"التحكم في الإصدارات","en":"Version control with Git","sa":"المستودعات والإيداعات والفروع والدمج وطلبات السحب، وكيف تعمل الفرق معًا دون أن تفقد عملها.","se":"Repositories, commits, branches, merges and pull requests: how teams work together without losing work.","L":[{"ta":"المستودع والإيداع","te":"Repositories and commits","a":"Git يحفظ تاريخ المشروع كاملًا. الإيداع (commit) لقطة للملفات مع رسالة تشرح التغيير. الدورة اليومية: عدّل ← `git add` ← `git commit` ← `git push`.\\nاكتب رسالة إيداع تشرح «لماذا» لا «ماذا» فقط، واجعل كل إيداع تغييرًا منطقيًا واحدًا.","e":"Git keeps the project's whole history. A commit is a snapshot of the files plus a message explaining the change. The daily loop: edit → `git add` → `git commit` → `git push`.\\nWrite commit messages that say why, not only what, and keep each commit one logical change.","c":"git add login.js\ngit commit -m \"Lock account after 5 failed logins\"\ngit push origin main"},{"ta":"الفروع","te":"Branches","a":"الفرع خط تطوير مستقل. تعمل على ميزة في فرع `feature/payments` دون أن تمس الفرع الرئيسي `main` الذي يجب أن يبقى صالحًا للإطلاق دائمًا.\\nالفروع في Git خفيفة جدًا، فأنشئ فرعًا لكل ميزة أو إصلاح.","e":"A branch is an independent line of development. You build a feature on `feature/payments` without touching `main`, which should always stay releasable.\\nBranches in Git are cheap, so create one for each feature or fix.","c":"git switch -c feature/payments\n# ...work and commit...\ngit switch main"},{"ta":"الدمج والتعارضات","te":"Merging and conflicts","a":"الدمج (merge) يجمع تغييرات فرعين. إذا عدّل شخصان السطر نفسه يحدث تعارض (conflict)، فيضع Git العلامات `<<<<<<<` و`>>>>>>>` لتختار يدويًا الصيغة الصحيحة.\\nالفروع القصيرة العمر والدمج المتكرر يقللان التعارضات.","e":"A merge combines the changes of two branches. If two people edit the same line there is a conflict, and Git marks it with `<<<<<<<` and `>>>>>>>` so you choose the right version by hand.\\nShort-lived branches and frequent merges keep conflicts small.","c":""},{"ta":"طلبات السحب والتراجع","te":"Pull requests and rollbacks","a":"طلب السحب (Pull Request) يقترح دمج فرعك، فيراجعه الزملاء وتعمل الاختبارات الآلية قبل الدمج.\\nإذا أطلقت خطأً، فإن `git revert` ينشئ إيداعًا عكسيًا آمنًا دون إعادة كتابة التاريخ المشترك. تجنّب `push --force` على الفروع المشتركة.","e":"A pull request proposes merging your branch; teammates review it and automated tests run before it is merged.\\nIf you ship a bug, `git revert` creates a safe reverse commit without rewriting shared history. Avoid `push --force` on shared branches.","c":"git revert a1b2c3d   # undo a bad commit safely"}],"Q":[{"qa":"ما الإيداع (commit) في Git؟","qe":"What is a commit in Git?","o":[["لقطة محفوظة للملفات مع رسالة","A saved snapshot of the files with a message"],["نسخة احتياطية على قرص خارجي","A backup on an external drive"],["ملف إعدادات المستودع","The repository's config file"],["أمر يحذف الفروع القديمة","A command that deletes old branches"]],"wa":"كل إيداع نقطة في التاريخ يمكنك العودة إليها.","we":"Each commit is a point in history you can return to."},{"qa":"لماذا نعمل على ميزة في فرع منفصل؟","qe":"Why build a feature on a separate branch?","o":[["ليبقى `main` صالحًا للإطلاق","So `main` stays releasable"],["لأن Git لا يسمح بالإيداع في main","Git forbids commits to main"],["لتسريع الحاسوب","To make the computer faster"],["لإخفاء الكود عن الفريق","To hide the code from the team"]],"wa":"العمل غير المكتمل يبقى معزولًا حتى يُراجَع ويُدمج.","we":"Unfinished work stays isolated until it is reviewed and merged."},{"qa":"متى يحدث تعارض دمج؟","qe":"When does a merge conflict happen?","o":[["حين يعدّل فرعان السطر نفسه","When two branches edit the same lines"],["حين يكون في المستودع أكثر من فرعين","When there are more than two branches"],["حين تكون الرسالة طويلة","When the commit message is long"],["حين يُدمج فرع بلا تغييرات","When merging a branch with no changes"]],"wa":"Git لا يعرف أي التعديلين تريد، فيطلب قرارك.","we":"Git can't tell which edit you want, so it asks you."},{"qa":"أطلقت إيداعًا فيه خطأ على فرع مشترك. ما الطريقة الآمنة للتراجع؟","qe":"You shipped a bad commit to a shared branch. What is the safe way to undo it?","o":[["git revert","git revert"],["git push --force","git push --force"],["git reset --hard on main","git reset --hard on main"],["Delete the repository","Delete the repository"]],"wa":"`revert` يضيف إيداعًا عكسيًا ولا يعيد كتابة تاريخ يعتمد عليه الآخرون.","we":"`revert` adds a reverse commit and doesn't rewrite history others rely on."},{"qa":"ما الغرض الأساسي من طلب السحب (Pull Request)؟","qe":"What is a pull request mainly for?","o":[["مراجعة التغييرات واختبارها قبل الدمج","Reviewing and testing changes before merging"],["تنزيل المستودع","Downloading the repository"],["حذف فرع","Deleting a branch"],["تشفير الكود","Encrypting the code"]],"wa":"المراجعة تلتقط الأخطاء وتنشر المعرفة في الفريق.","we":"Review catches bugs and spreads knowledge across the team."},{"qa":"أي رسالة إيداع أفضل؟","qe":"Which commit message is better?","o":[["«قفل الحساب بعد 5 محاولات دخول فاشلة»","\"Lock account after 5 failed logins\""],["«تعديلات»","\"changes\""],["«إصلاح»","\"fix\""],["«عمل اليوم»","\"today's work\""]],"wa":"الرسالة الجيدة تخبر القارئ بعد سنة بما تغيّر ولماذا.","we":"A good message tells a reader a year later what changed and why."}],"T":[{"h":"版本控制","p":"bǎnběn kòngzhì","ar":"التحكم في الإصدارات","en":"version control"},{"h":"仓库","p":"cāngkù","ar":"مستودع","en":"repository"},{"h":"提交","p":"tíjiāo","ar":"إيداع (commit)","en":"commit"},{"h":"分支","p":"fēnzhī","ar":"فرع","en":"branch"},{"h":"合并","p":"hébìng","ar":"دمج","en":"merge"},{"h":"冲突","p":"chōngtū","ar":"تعارض","en":"conflict"},{"h":"拉取请求","p":"lāqǔ qǐngqiú","ar":"طلب سحب","en":"pull request"},{"h":"克隆","p":"kèlóng","ar":"استنساخ","en":"clone"},{"h":"回滚","p":"huígǔn","ar":"تراجع (rollback)","en":"rollback"},{"h":"主分支","p":"zhǔ fēnzhī","ar":"الفرع الرئيسي","en":"main branch"}],"D":[{"s":"A","zh":"合并的时候出现冲突了。","py":"Hébìng de shíhou chūxiàn chōngtū le.","ar":"ظهر تعارض أثناء الدمج.","en":"A conflict came up during the merge."},{"s":"B","zh":"哪个文件？我们一起看看。","py":"Nǎge wénjiàn? Wǒmen yìqǐ kànkan.","ar":"أي ملف؟ لننظر فيه معًا.","en":"Which file? Let's look at it together."},{"s":"A","zh":"登录模块，我们俩都改了同一行。","py":"Dēnglù mókuài, wǒmen liǎ dōu gǎi le tóng yì háng.","ar":"وحدة تسجيل الدخول، كلانا عدّل السطر نفسه.","en":"The login module; we both changed the same line."},{"s":"B","zh":"保留你的版本，然后重新跑测试。","py":"Bǎoliú nǐ de bǎnběn, ránhòu chóngxīn pǎo cèshì.","ar":"احتفظ بنسختك، ثم أعد تشغيل الاختبارات.","en":"Keep your version, then rerun the tests."}]},{"k":"se-test","tr":"se","ic":"🧪","zh":"软件测试","py":"ruǎnjiàn cèshì","ar":"الاختبار والجودة","en":"Testing and quality","sa":"اختبارات الوحدات والتكامل، والتطوير الموجّه بالاختبار، والتغطية، ومراجعة الكود، والاختبارات الارتدادية.","se":"Unit and integration tests, test-driven development, coverage, code review and regression testing.","L":[{"ta":"هرم الاختبارات","te":"The test pyramid","a":"القاعدة العريضة اختبارات وحدات سريعة تفحص دالة واحدة بمعزل عن غيرها. فوقها اختبارات تكامل تفحص أجزاء تعمل معًا (الكود مع قاعدة البيانات). وفي القمة اختبارات شاملة قليلة تحاكي المستخدم من البداية للنهاية.\\nكلما صعدت صار الاختبار أبطأ وأكثر هشاشة، لذلك تكون الكثرة في القاعدة.","e":"The wide base is fast unit tests that check one function in isolation. Above them, integration tests check parts working together (code plus database). At the top, a few end-to-end tests act like a real user.\\nHigher tests are slower and more brittle, so most tests live at the base.","c":""},{"ta":"كتابة اختبار وحدة","te":"Writing a unit test","a":"الاختبار الجيد يتبع النمط: رتّب (Arrange)، نفّذ (Act)، تحقّق (Assert). يختبر سلوكًا واحدًا واسمه يصف ذلك السلوك.\\nاختبر الحالات الحدية: القيمة الفارغة، والصفر، والسالب، والقيمة القصوى.","e":"A good test follows Arrange, Act, Assert. It checks one behaviour and its name describes that behaviour.\\nTest the edge cases: empty values, zero, negatives and the maximum.","c":"function discount(total) { return total >= 100 ? total * 0.9 : total; }\n// test: \"gives 10% off from 100\"\nconsole.assert(discount(100) === 90);\nconsole.assert(discount(99) === 99);\nconsole.log(\"tests passed\");"},{"ta":"التطوير الموجّه بالاختبار","te":"Test-driven development","a":"دورة TDD: أحمر ← أخضر ← إعادة هيكلة. اكتب اختبارًا يفشل أولًا، ثم أقل كود يجعله ينجح، ثم حسّن البنية والاختبار يحميك.\\nالفائدة: تصميم أبسط، وكود قابل للاختبار من البداية، وثقة عند التعديل.","e":"The TDD loop is red → green → refactor. Write a failing test first, then the least code that passes it, then improve the structure while the test protects you.\\nThe payoff: simpler design, code that is testable from day one, and confidence when changing it.","c":""},{"ta":"التغطية ومراجعة الكود","te":"Coverage and code review","a":"نسبة التغطية تقيس الأسطر التي نفّذتها الاختبارات، لكن 100% لا تعني غياب الأخطاء؛ المهم جودة التحققات.\\nمراجعة الكود تلتقط الأخطاء المنطقية والأمنية وتنشر المعرفة. الاختبار الارتدادي يعيد تشغيل الاختبارات القديمة للتأكد أن الإصلاح الجديد لم يكسر شيئًا كان يعمل.","e":"Coverage measures which lines the tests executed, but 100% does not mean bug-free; the quality of the assertions matters.\\nCode review catches logic and security bugs and spreads knowledge. Regression tests rerun old tests to make sure a new fix hasn't broken something that worked.","c":""}],"Q":[{"qa":"أي نوع اختبار يجب أن يكون الأكثر عددًا؟","qe":"Which kind of test should be the most numerous?","o":[["اختبارات الوحدات","Unit tests"],["الاختبارات الشاملة","End-to-end tests"],["الاختبارات اليدوية","Manual tests"],["اختبارات الأداء","Performance tests"]],"wa":"سريعة ودقيقة وتحدد مكان الخطأ بالضبط.","we":"They are fast, precise and pinpoint where a bug is."},{"qa":"ما الخطوة الأولى في دورة TDD؟","qe":"What is the first step of the TDD loop?","o":[["كتابة اختبار يفشل","Write a failing test"],["كتابة الكود كاملًا","Write all the code"],["إعادة الهيكلة","Refactor"],["نشر التطبيق","Deploy the app"]],"wa":"الاختبار الفاشل يحدد بدقة ما يجب أن يفعله الكود.","we":"The failing test defines exactly what the code must do."},{"qa":"التغطية 100%. هل يعني ذلك عدم وجود أخطاء؟","qe":"Coverage is 100%. Does that mean there are no bugs?","o":[["لا، تنفيذ السطر لا يعني التحقق من صحته","No: running a line isn't checking it is right"],["نعم دائمًا","Yes, always"],["نعم إن كانت الاختبارات سريعة","Yes, if the tests are fast"],["فقط في جافاسكربت","Only in JavaScript"]],"wa":"اختبار بلا تحققات جيدة قد يمر على كل الأسطر دون أن يكتشف شيئًا.","we":"A test without good assertions can run every line and still catch nothing."},{"qa":"ما الغرض من الاختبار الارتدادي؟","qe":"What is regression testing for?","o":[["التأكد أن التغيير الجديد لم يكسر ميزات قديمة","Making sure a new change didn't break old features"],["قياس سرعة الخادم","Measuring server speed"],["اختبار تطبيق المنافس","Testing a competitor's app"],["كتابة الوثائق","Writing documentation"]],"wa":"يعاد تشغيل الاختبارات القديمة بعد كل تغيير.","we":"Old tests are rerun after every change."},{"qa":"ما ترتيب أجزاء الاختبار الجيد؟","qe":"What is the structure of a good test?","o":[["رتّب ثم نفّذ ثم تحقّق","Arrange, act, assert"],["تحقّق ثم رتّب ثم نفّذ","Assert, arrange, act"],["نفّذ فقط","Act only"],["انشر ثم اختبر","Deploy, then test"]],"wa":"وضوح البنية يجعل الاختبار سهل القراءة كالوثيقة.","we":"A clear structure makes a test read like documentation."},{"qa":"دالة `discount` تعطي خصمًا من 100. أي قيمة اختبار تكشف الحالة الحدية؟","qe":"`discount` gives 10% off from 100. Which test value checks the boundary?","o":[["99 and 100","99 and 100"],["50","50"],["1,000","1,000"],["-1 only","-1 only"]],"wa":"الأخطاء تختبئ عند الحدود: هل الشرط > أم ≥؟","we":"Bugs hide at boundaries: is the condition > or ≥?"}],"T":[{"h":"软件测试","p":"ruǎnjiàn cèshì","ar":"اختبار البرمجيات","en":"software testing"},{"h":"单元测试","p":"dānyuán cèshì","ar":"اختبار الوحدة","en":"unit test"},{"h":"集成测试","p":"jíchéng cèshì","ar":"اختبار التكامل","en":"integration test"},{"h":"测试用例","p":"cèshì yònglì","ar":"حالة اختبار","en":"test case"},{"h":"断言","p":"duànyán","ar":"تحقق (assertion)","en":"assertion"},{"h":"覆盖率","p":"fùgàilǜ","ar":"نسبة التغطية","en":"coverage"},{"h":"测试驱动开发","p":"cèshì qūdòng kāifā","ar":"التطوير الموجّه بالاختبار","en":"test-driven development"},{"h":"代码审查","p":"dàimǎ shěnchá","ar":"مراجعة الكود","en":"code review"},{"h":"缺陷","p":"quēxiàn","ar":"عيب، خلل","en":"defect"},{"h":"回归测试","p":"huíguī cèshì","ar":"اختبار ارتدادي","en":"regression test"}],"D":[{"s":"A","zh":"这个缺陷是怎么漏掉的？","py":"Zhège quēxiàn shì zěnme lòu diào de?","ar":"كيف فاتنا هذا الخلل؟","en":"How did this defect slip through?"},{"s":"B","zh":"边界情况没有测试用例。","py":"Biānjiè qíngkuàng méiyǒu cèshì yònglì.","ar":"لم تكن هناك حالة اختبار للحالة الحدية.","en":"There was no test case for the edge case."},{"s":"A","zh":"先补测试，再修代码。","py":"Xiān bǔ cèshì, zài xiū dàimǎ.","ar":"لنضف الاختبار أولًا ثم نصلح الكود.","en":"Add the test first, then fix the code."},{"s":"B","zh":"好，再跑一遍回归测试。","py":"Hǎo, zài pǎo yí biàn huíguī cèshì.","ar":"حسنًا، ثم نعيد تشغيل الاختبارات الارتدادية.","en":"OK, and rerun the regression tests."}]},{"k":"se-web","tr":"se","ic":"🌍","zh":"Web开发与接口","py":"Web kāifā yǔ jiēkǒu","ar":"الويب والواجهات البرمجية","en":"Web, HTTP and APIs","sa":"كيف يعمل الويب: العميل والخادم، وطلبات HTTP ورموز الحالة، وواجهات REST وJSON، والأداء.","se":"How the web works: client and server, HTTP requests and status codes, REST APIs and JSON, and performance.","L":[{"ta":"العميل والخادم","te":"Client and server","a":"عندما تكتب عنوانًا في المتصفح: يبحث DNS عن عنوان IP للخادم، ثم ينشئ اتصالًا مشفرًا (TLS)، ثم يرسل طلب HTTP، فيرد الخادم بصفحة HTML وملفات CSS وجافاسكربت.\\nالواجهة الأمامية (Front-end) ما يعمل في المتصفح، والخلفية (Back-end) ما يعمل على الخادم مع قاعدة البيانات.","e":"When you type an address: DNS finds the server's IP, a TLS-encrypted connection is opened, an HTTP request is sent, and the server answers with HTML, CSS and JavaScript.\\nThe front end runs in the browser; the back end runs on the server with the database.","c":""},{"ta":"طلبات HTTP","te":"HTTP methods","a":"`GET` يقرأ دون تغيير شيء، و`POST` ينشئ، و`PUT`/`PATCH` يعدّل، و`DELETE` يحذف.\\nالطلب يحمل ترويسات (Headers) مثل نوع المحتوى ورمز المصادقة، وقد يحمل جسمًا (Body) بصيغة JSON.","e":"`GET` reads without changing anything, `POST` creates, `PUT`/`PATCH` updates and `DELETE` removes.\\nA request carries headers, such as the content type and an auth token, and may carry a JSON body.","c":"const res = await fetch(\"/api/orders\", {\n  method: \"POST\",\n  headers: { \"Content-Type\": \"application/json\" },\n  body: JSON.stringify({ item: \"tea\", qty: 2 })\n});\nconsole.log(res.status); // 201 Created"},{"ta":"رموز الحالة","te":"Status codes","a":"2xx نجاح (200 تم، 201 أُنشئ). 3xx إعادة توجيه. 4xx خطأ من العميل (400 طلب غير صالح، 401 غير مصادَق، 403 ممنوع، 404 غير موجود، 429 طلبات كثيرة). 5xx خطأ في الخادم (500 خطأ داخلي، 503 الخدمة غير متاحة).","e":"2xx success (200 OK, 201 Created). 3xx redirect. 4xx client error (400 bad request, 401 unauthenticated, 403 forbidden, 404 not found, 429 too many requests). 5xx server error (500 internal error, 503 service unavailable).","c":""},{"ta":"تصميم واجهة REST","te":"Designing a REST API","a":"استخدم أسماء للموارد لا أفعالًا: `GET /orders/42` لا `GET /getOrder?id=42`. أعد أخطاء واضحة برموز صحيحة، ورقّم الإصدارات (`/v1/`)، وقسّم النتائج الكبيرة إلى صفحات.\\nالأداء: خزّن الاستجابات مؤقتًا، وضغطها، واستخدم شبكة توزيع المحتوى CDN للملفات الثابتة.","e":"Use nouns for resources, not verbs: `GET /orders/42`, not `GET /getOrder?id=42`. Return clear errors with the right codes, version the API (`/v1/`), and paginate large results.\\nPerformance: cache responses, compress them, and serve static files from a CDN.","c":""}],"Q":[{"qa":"أي طريقة HTTP تُستخدم لإنشاء مورد جديد؟","qe":"Which HTTP method creates a new resource?","o":[["POST","POST"],["GET","GET"],["DELETE","DELETE"],["HEAD","HEAD"]],"wa":"`GET` للقراءة فقط ويجب ألا يغير البيانات.","we":"`GET` is for reading only and must not change data."},{"qa":"المستخدم مسجّل دخوله لكنه لا يملك صلاحية المورد. ما الرمز الصحيح؟","qe":"The user is logged in but lacks permission for the resource. Which status code fits?","o":[["403 Forbidden","403 Forbidden"],["401 Unauthorized","401 Unauthorized"],["404 Not Found","404 Not Found"],["500 Internal Server Error","500 Internal Server Error"]],"wa":"401 تعني أن الهوية غير معروفة، و403 أنها معروفة لكنها غير مسموح لها.","we":"401 means identity is unknown; 403 means it is known but not allowed."},{"qa":"أي مسار يتبع أسلوب REST؟","qe":"Which path follows REST style?","o":[["GET /orders/42","GET /orders/42"],["GET /getOrder?id=42","GET /getOrder?id=42"],["POST /deleteOrder/42","POST /deleteOrder/42"],["GET /orders/42/delete","GET /orders/42/delete"]],"wa":"المورد اسم، والفعل هو طريقة HTTP نفسها.","we":"The resource is a noun; the verb is the HTTP method itself."},{"qa":"ماذا يعني الرمز 429؟","qe":"What does status 429 mean?","o":[["طلبات كثيرة جدًا","Too many requests"],["المورد نُقل","Resource moved"],["الخادم معطّل","Server is down"],["نجاح الطلب","Request succeeded"]],"wa":"الخادم يطبق حدًّا لمعدل الطلبات لحماية نفسه.","we":"The server is rate-limiting to protect itself."},{"qa":"ما أول خطوة عندما تكتب عنوان موقع في المتصفح؟","qe":"What happens first when you type a site address?","o":[["بحث DNS عن عنوان IP","A DNS lookup for the IP address"],["تحميل CSS","Downloading CSS"],["تشغيل جافاسكربت","Running JavaScript"],["إرسال ملفات تعريف الارتباط إلى كل المواقع","Sending cookies to every site"]],"wa":"لا يمكن الاتصال بالخادم قبل معرفة عنوانه.","we":"You can't connect to the server before knowing its address."},{"qa":"ما فائدة شبكة توزيع المحتوى CDN؟","qe":"What does a CDN do?","o":[["تقدّم الملفات الثابتة من خوادم قريبة من المستخدم","Serves static files from servers close to the user"],["تكتب الواجهة الخلفية","Writes the back end"],["تخزن كلمات المرور","Stores passwords"],["تستبدل قاعدة البيانات","Replaces the database"]],"wa":"المسافة الأقصر تعني تحميلًا أسرع وضغطًا أقل على الخادم الأصلي.","we":"Shorter distance means faster loads and less load on the origin server."}],"T":[{"h":"前端","p":"qiánduān","ar":"الواجهة الأمامية","en":"front end"},{"h":"后端","p":"hòuduān","ar":"الواجهة الخلفية","en":"back end"},{"h":"服务器","p":"fúwùqì","ar":"خادم","en":"server"},{"h":"客户端","p":"kèhùduān","ar":"عميل (برنامج)","en":"client"},{"h":"请求","p":"qǐngqiú","ar":"طلب","en":"request"},{"h":"响应","p":"xiǎngyìng","ar":"استجابة","en":"response"},{"h":"状态码","p":"zhuàngtàimǎ","ar":"رمز الحالة","en":"status code"},{"h":"浏览器","p":"liúlǎnqì","ar":"متصفح","en":"browser"},{"h":"域名","p":"yùmíng","ar":"اسم النطاق","en":"domain name"},{"h":"应用程序接口","p":"yìngyòng chéngxù jiēkǒu","ar":"واجهة برمجة التطبيقات (API)","en":"application programming interface"}],"D":[{"s":"A","zh":"这个接口为什么返回500？","py":"Zhège jiēkǒu wèishénme fǎnhuí wǔbǎi?","ar":"لماذا تُرجع هذه الواجهة 500؟","en":"Why does this API return 500?"},{"s":"B","zh":"后端日志说数据库超时了。","py":"Hòuduān rìzhì shuō shùjùkù chāoshí le.","ar":"سجل الخلفية يقول إن قاعدة البيانات تجاوزت المهلة.","en":"The back-end log says the database timed out."},{"s":"A","zh":"前端要显示友好的错误信息。","py":"Qiánduān yào xiǎnshì yǒuhǎo de cuòwù xìnxī.","ar":"يجب أن تعرض الواجهة الأمامية رسالة خطأ ودية.","en":"The front end should show a friendly error message."},{"s":"B","zh":"好，我加一个重试按钮。","py":"Hǎo, wǒ jiā yí ge chóngshì ànniǔ.","ar":"حسنًا، سأضيف زر إعادة المحاولة.","en":"OK, I'll add a retry button."}]},{"k":"se-db","tr":"se","ic":"🗄️","zh":"数据库","py":"shùjùkù","ar":"قواعد البيانات وSQL","en":"Databases and SQL","sa":"الجداول والمفاتيح، واستعلامات SQL والربط، والفهارس، والمعاملات وخصائص ACID، وقواعد NoSQL.","se":"Tables and keys, SQL queries and joins, indexes, transactions and ACID, and NoSQL databases.","L":[{"ta":"الجداول والمفاتيح","te":"Tables and keys","a":"قاعدة البيانات العلائقية تنظّم البيانات في جداول (صفوف وأعمدة). المفتاح الأساسي (Primary key) يميّز كل صف، والمفتاح الأجنبي (Foreign key) يربط صفًا بصف في جدول آخر، مثل ربط الطلب بالعميل.","e":"A relational database organises data in tables of rows and columns. A primary key identifies each row, and a foreign key links a row to one in another table, such as an order to its customer.","c":"customers(id PRIMARY KEY, name)\norders(id PRIMARY KEY, customer_id REFERENCES customers(id), total)"},{"ta":"استعلامات SQL والربط","te":"SQL queries and joins","a":"`SELECT` يقرأ، و`WHERE` يصفّي، و`ORDER BY` يرتب، و`GROUP BY` يجمّع. الربط `JOIN` يجمع صفوفًا مترابطة من جدولين.\\n`INNER JOIN` يعيد الصفوف المتطابقة فقط، و`LEFT JOIN` يعيد كل صفوف الجدول الأيسر حتى دون مطابقة.","e":"`SELECT` reads, `WHERE` filters, `ORDER BY` sorts and `GROUP BY` aggregates. A `JOIN` combines related rows from two tables.\\n`INNER JOIN` returns only matching rows; `LEFT JOIN` returns every left-table row even without a match.","c":"SELECT c.name, SUM(o.total) AS spent\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nGROUP BY c.name\nORDER BY spent DESC;"},{"ta":"الفهارس","te":"Indexes","a":"الفهرس بنية (غالبًا شجرة B) تجعل البحث في عمود سريعًا بدل المرور على كل الصفوف، كفهرس الكتاب.\\nالثمن: مساحة إضافية وكتابة أبطأ قليلًا. فهرس الأعمدة التي تبحث بها كثيرًا في `WHERE` و`JOIN`.","e":"An index (usually a B-tree) makes searching a column fast instead of scanning every row, like a book's index.\\nThe cost: extra space and slightly slower writes. Index the columns you filter and join on often.","c":""},{"ta":"المعاملات وNoSQL","te":"Transactions and NoSQL","a":"المعاملة (Transaction) مجموعة عمليات تنجح كلها أو تفشل كلها، مثل خصم من حساب وإضافة لآخر. خصائص ACID: الذرية والاتساق والعزل والديمومة.\\nقواعد NoSQL (المستندات، والمفتاح-القيمة، والرسوم البيانية) تتنازل أحيانًا عن بعض هذه الضمانات مقابل المرونة والتوسع الأفقي.","e":"A transaction is a group of operations that all succeed or all fail, such as debiting one account and crediting another. ACID: atomicity, consistency, isolation, durability.\\nNoSQL databases (document, key-value, graph) sometimes trade some of these guarantees for flexibility and horizontal scale.","c":"BEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;"}],"Q":[{"qa":"ما وظيفة المفتاح الأجنبي؟","qe":"What does a foreign key do?","o":[["يربط صفًا بصف في جدول آخر","Links a row to a row in another table"],["يشفّر العمود","Encrypts the column"],["يسرّع كل الاستعلامات","Speeds up every query"],["يحذف التكرار تلقائيًا","Removes duplicates automatically"]],"wa":"مثل `customer_id` في جدول الطلبات الذي يشير إلى العميل.","we":"Like `customer_id` in orders, which points to the customer."},{"qa":"أي ربط يعيد كل العملاء حتى من ليس لديهم طلبات؟","qe":"Which join returns every customer, even those with no orders?","o":[["customers LEFT JOIN orders","customers LEFT JOIN orders"],["customers INNER JOIN orders","customers INNER JOIN orders"],["orders INNER JOIN customers","orders INNER JOIN customers"],["CROSS JOIN only","CROSS JOIN only"]],"wa":"الربط الأيسر يُبقي كل صفوف الجدول الأيسر.","we":"A left join keeps every row of the left table."},{"qa":"استعلام يبحث بالبريد الإلكتروني بطيء جدًا في جدول من 10 ملايين صف. ما الحل الأول؟","qe":"A lookup by email is very slow on a 10-million-row table. What's the first fix?","o":[["إضافة فهرس على عمود البريد","Add an index on the email column"],["حذف نصف الصفوف","Delete half the rows"],["زيادة ذاكرة المتصفح","Add browser memory"],["تحويل الجدول إلى ملف نصي","Turn the table into a text file"]],"wa":"الفهرس يحوّل المسح الكامل إلى بحث في شجرة.","we":"An index turns a full scan into a tree search."},{"qa":"تحويل مالي خصم المبلغ ثم تعطّل الخادم قبل الإضافة. ما الذي يمنع ضياع المال؟","qe":"A transfer debited the money, then the server crashed before crediting it. What prevents the loss?","o":[["المعاملة الذرية (ACID)","An atomic transaction (ACID)"],["الفهرس","An index"],["المفتاح الأساسي","The primary key"],["ذاكرة التخزين المؤقت","A cache"]],"wa":"بدون COMMIT تُلغى العملية الأولى تلقائيًا.","we":"Without a COMMIT the first operation is rolled back."},{"qa":"ما الكلمة التي تصفّي الصفوف في SQL؟","qe":"Which SQL keyword filters rows?","o":[["WHERE","WHERE"],["ORDER BY","ORDER BY"],["SELECT","SELECT"],["FROM","FROM"]],"wa":"`ORDER BY` يرتب فقط ولا يحذف شيئًا من النتيجة.","we":"`ORDER BY` only sorts; it removes nothing."},{"qa":"ما ثمن إضافة فهرس؟","qe":"What does an index cost?","o":[["مساحة إضافية وكتابة أبطأ قليلًا","Extra storage and slightly slower writes"],["قراءة أبطأ","Slower reads"],["فقدان البيانات","Data loss"],["لا شيء أبدًا","Nothing at all"]],"wa":"كل إدراج أو تعديل يحدّث الفهرس أيضًا.","we":"Every insert or update must also update the index."}],"T":[{"h":"数据库","p":"shùjùkù","ar":"قاعدة بيانات","en":"database"},{"h":"数据表","p":"shùjùbiǎo","ar":"جدول بيانات","en":"data table"},{"h":"主键","p":"zhǔjiàn","ar":"المفتاح الأساسي","en":"primary key"},{"h":"外键","p":"wàijiàn","ar":"المفتاح الأجنبي","en":"foreign key"},{"h":"索引","p":"suǒyǐn","ar":"فهرس","en":"index"},{"h":"查询","p":"cháxún","ar":"استعلام","en":"query"},{"h":"事务","p":"shìwù","ar":"معاملة","en":"transaction"},{"h":"关系型数据库","p":"guānxìxíng shùjùkù","ar":"قاعدة بيانات علائقية","en":"relational database"},{"h":"备份","p":"bèifèn","ar":"نسخة احتياطية","en":"backup"},{"h":"字段","p":"zìduàn","ar":"حقل","en":"field"}],"D":[{"s":"A","zh":"这个查询要十秒，太慢了。","py":"Zhège cháxún yào shí miǎo, tài màn le.","ar":"هذا الاستعلام يستغرق عشر ثوانٍ، بطيء جدًا.","en":"This query takes ten seconds; it's too slow."},{"s":"B","zh":"邮箱字段有索引吗？","py":"Yóuxiāng zìduàn yǒu suǒyǐn ma?","ar":"هل على حقل البريد فهرس؟","en":"Is there an index on the email field?"},{"s":"A","zh":"没有，我现在加一个。","py":"Méiyǒu, wǒ xiànzài jiā yí ge.","ar":"لا، سأضيف واحدًا الآن.","en":"No, I'll add one now."},{"s":"B","zh":"先在测试库试一下。","py":"Xiān zài cèshìkù shì yíxià.","ar":"جرّبه أولًا على قاعدة الاختبار.","en":"Try it on the test database first."}]},{"k":"se-sys","tr":"se","ic":"🏗️","zh":"系统设计","py":"xìtǒng shèjì","ar":"تصميم الأنظمة","en":"System design","sa":"التوسع الرأسي والأفقي، وموازنة الأحمال، والتخزين المؤقت، وطوابير الرسائل، والخدمات المصغرة، ونظرية CAP.","se":"Vertical and horizontal scaling, load balancing, caching, message queues, microservices and the CAP theorem.","L":[{"ta":"التوسع","te":"Scaling","a":"التوسع الرأسي: خادم أقوى (معالج وذاكرة أكثر)، وهو بسيط لكن له سقف. التوسع الأفقي: خوادم أكثر خلف موازن أحمال، وهو بلا سقف تقريبًا لكنه يتطلب أن تكون الخوادم بلا حالة (stateless).\\nضع الحالة (الجلسات، الملفات) في مخزن مشترك كقاعدة البيانات أو Redis.","e":"Vertical scaling: a bigger server (more CPU and memory); simple, but it has a ceiling. Horizontal scaling: more servers behind a load balancer; nearly unlimited, but servers must be stateless.\\nKeep state (sessions, files) in a shared store such as the database or Redis.","c":""},{"ta":"موازنة الأحمال والتخزين المؤقت","te":"Load balancing and caching","a":"موازن الأحمال يوزّع الطلبات على الخوادم ويتجاوز الخادم المعطّل تلقائيًا.\\nالتخزين المؤقت (Cache) يحفظ النتائج المطلوبة كثيرًا في الذاكرة. أصعب ما فيه هو الإبطال: متى تعتبر النسخة المخزنة قديمة؟ استخدم مدة صلاحية TTL أو امسح المفتاح عند التحديث.","e":"A load balancer spreads requests across servers and skips a failed server automatically.\\nA cache keeps frequently requested results in memory. The hard part is invalidation: when is the cached copy stale? Use a TTL or delete the key on update.","c":""},{"ta":"طوابير الرسائل والخدمات المصغرة","te":"Queues and microservices","a":"طابور الرسائل (مثل Kafka أو RabbitMQ) يفصل المرسل عن المستقبل: يضع الخادم مهمة «أرسل الفاتورة» في الطابور ويرد فورًا، ويعالجها عامل في الخلفية.\\nالخدمات المصغرة تقسم النظام إلى خدمات صغيرة مستقلة النشر، لكنها تضيف تعقيد الشبكة والمراقبة؛ ابدأ بنظام واحد منظم جيدًا.","e":"A message queue (such as Kafka or RabbitMQ) decouples sender and receiver: the server drops a \"send invoice\" job on the queue and replies at once, and a background worker handles it.\\nMicroservices split a system into small, independently deployed services, but add network and monitoring complexity; start with a well-structured monolith.","c":""},{"ta":"نظرية CAP والإتاحة العالية","te":"CAP and high availability","a":"في نظام موزّع، عند انقطاع الشبكة بين العقد (Partition) عليك الاختيار: الاتساق (كل قراءة ترى آخر كتابة) أو الإتاحة (كل طلب يحصل على رد).\\nالإتاحة العالية تعني إزالة نقاط الفشل الوحيدة: نسخ متعددة، ومناطق متعددة، ونسخ احتياطية مُجرّبة. «99.9%» تعني نحو 8.8 ساعة توقف في السنة.","e":"In a distributed system, when the network between nodes splits (a partition) you must choose: consistency (every read sees the latest write) or availability (every request gets an answer).\\nHigh availability means removing single points of failure: replicas, multiple zones, tested backups. \"99.9%\" allows about 8.8 hours of downtime a year.","c":""}],"Q":[{"qa":"ما شرط التوسع الأفقي السهل؟","qe":"What makes horizontal scaling easy?","o":[["أن تكون الخوادم بلا حالة","Stateless servers"],["خادم واحد قوي","One powerful server"],["تخزين الجلسات في ذاكرة كل خادم","Sessions kept in each server's memory"],["قاعدة بيانات لكل مستخدم","One database per user"]],"wa":"أي خادم يستطيع خدمة أي طلب إذا كانت الحالة في مخزن مشترك.","we":"Any server can handle any request when state lives in a shared store."},{"qa":"ما أصعب جزء في التخزين المؤقت؟","qe":"What is the hardest part of caching?","o":[["إبطال البيانات القديمة","Invalidating stale data"],["اختيار اسم المفتاح","Choosing the key name"],["شراء الذاكرة","Buying memory"],["ضغط البيانات","Compressing data"]],"wa":"عرض بيانات قديمة للمستخدم قد يكون أخطر من البطء.","we":"Showing users stale data can be worse than being slow."},{"qa":"إرسال الفواتير بالبريد يبطئ الرد على المستخدم. ما الحل المناسب؟","qe":"Emailing invoices slows down the user's response. What fits?","o":[["وضع المهمة في طابور رسائل يعالجها عامل خلفي","Put the job on a message queue for a background worker"],["زيادة مهلة الانتظار","Increase the timeout"],["إلغاء الفواتير","Drop invoices"],["إرسال البريد من المتصفح","Send email from the browser"]],"wa":"المستخدم يحصل على الرد فورًا، والعمل الثقيل يتم لاحقًا.","we":"The user gets an answer at once; the heavy work happens later."},{"qa":"كم ساعة توقف تسمح بها إتاحة 99.9% سنويًا تقريبًا؟","qe":"About how much downtime per year does 99.9% availability allow?","o":[["8.8 hours","8.8 hours"],["8.8 minutes","8.8 minutes"],["3.6 days","3.6 days"],["52 minutes","52 minutes"]],"wa":"0.1% من 8760 ساعة ≈ 8.76 ساعة.","we":"0.1% of 8,760 hours ≈ 8.76 hours."},{"qa":"عند انقطاع الشبكة في نظام موزّع، ما الخيار الذي تفرضه نظرية CAP؟","qe":"During a network partition, what choice does CAP force?","o":[["بين الاتساق والإتاحة","Between consistency and availability"],["بين السرعة والأمان","Between speed and security"],["بين SQL وNoSQL","Between SQL and NoSQL"],["بين الذاكرة والقرص","Between memory and disk"]],"wa":"لا يمكن ضمان الاثنين معًا أثناء الانقسام.","we":"You cannot guarantee both during a partition."},{"qa":"ما العيب الرئيسي للخدمات المصغرة؟","qe":"What is the main downside of microservices?","o":[["تعقيد الشبكة والنشر والمراقبة","Network, deployment and monitoring complexity"],["لا يمكن توسيعها","They can't scale"],["تتطلب لغة برمجة واحدة","They require one language"],["لا تدعم قواعد البيانات","They don't support databases"]],"wa":"لهذا يُنصح بالبدء بنظام واحد منظم ثم التقسيم عند الحاجة.","we":"That's why teams often start with a well-structured monolith and split when needed."}],"T":[{"h":"系统设计","p":"xìtǒng shèjì","ar":"تصميم الأنظمة","en":"system design"},{"h":"可扩展性","p":"kěkuòzhǎnxìng","ar":"قابلية التوسع","en":"scalability"},{"h":"负载均衡","p":"fùzài jūnhéng","ar":"موازنة الأحمال","en":"load balancing"},{"h":"缓存","p":"huǎncún","ar":"ذاكرة تخزين مؤقت","en":"cache"},{"h":"消息队列","p":"xiāoxi duìliè","ar":"طابور الرسائل","en":"message queue"},{"h":"微服务","p":"wēifúwù","ar":"خدمات مصغرة","en":"microservices"},{"h":"高可用","p":"gāo kěyòng","ar":"إتاحة عالية","en":"high availability"},{"h":"延迟","p":"yánchí","ar":"زمن الاستجابة (latency)","en":"latency"},{"h":"吞吐量","p":"tūntǔliàng","ar":"الإنتاجية (throughput)","en":"throughput"},{"h":"分布式系统","p":"fēnbùshì xìtǒng","ar":"نظام موزّع","en":"distributed system"}],"D":[{"s":"A","zh":"双十一流量会翻十倍。","py":"Shuāng Shíyī liúliàng huì fān shí bèi.","ar":"حركة المرور في عيد 11/11 ستتضاعف عشر مرات.","en":"Traffic will grow tenfold on Singles' Day."},{"s":"B","zh":"我们先加缓存，再水平扩展服务器。","py":"Wǒmen xiān jiā huǎncún, zài shuǐpíng kuòzhǎn fúwùqì.","ar":"سنضيف التخزين المؤقت أولًا، ثم نوسّع الخوادم أفقيًا.","en":"We'll add caching first, then scale the servers horizontally."},{"s":"A","zh":"下单接口呢？","py":"Xià dān jiēkǒu ne?","ar":"وماذا عن واجهة إنشاء الطلبات؟","en":"What about the order API?"},{"s":"B","zh":"用消息队列削峰。","py":"Yòng xiāoxi duìliè xiāo fēng.","ar":"نستخدم طابور الرسائل لتسطيح الذروة.","en":"Use a message queue to absorb the peak."}]},{"k":"se-ops","tr":"se","ic":"🚀","zh":"DevOps与云计算","py":"DevOps yǔ yún jìsuàn","ar":"DevOps والحوسبة السحابية","en":"DevOps and cloud","sa":"التكامل والنشر المستمر، والحاويات وKubernetes، والبنية ككود، والمراقبة.","se":"Continuous integration and delivery, containers and Kubernetes, infrastructure as code, and monitoring.","L":[{"ta":"التكامل والنشر المستمر","te":"CI/CD","a":"التكامل المستمر (CI): كل إيداع يُبنى ويُختبر آليًا، فتظهر الأخطاء خلال دقائق.\\nالنشر المستمر (CD): كل تغيير ناجح يصل إلى الإنتاج آليًا عبر خط أنابيب (pipeline): بناء ← اختبار ← فحص أمني ← نشر. النشر المتكرر الصغير أقل خطرًا من الإطلاق الكبير النادر.","e":"Continuous integration: every commit is built and tested automatically, so bugs show up within minutes.\\nContinuous delivery/deployment: every passing change flows to production through a pipeline: build → test → security scan → deploy. Small frequent releases are less risky than rare big ones.","c":""},{"ta":"الحاويات","te":"Containers","a":"الحاوية تحزم التطبيق مع كل ما يحتاجه (المكتبات والإعدادات) في صورة (image) تعمل بالطريقة نفسها في أي مكان، فتنتهي مشكلة «يعمل على جهازي فقط».\\nKubernetes ينسّق مئات الحاويات: يشغّلها ويعيد تشغيل المتعطل ويوسّعها حسب الحمل.","e":"A container packages the app with everything it needs (libraries, config) into an image that runs the same everywhere, ending \"it works on my machine\".\\nKubernetes orchestrates hundreds of containers: it starts them, restarts failed ones and scales them with load.","c":"FROM node:22-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --omit=dev\nCOPY . .\nUSER node\nCMD [\"node\", \"server.js\"]"},{"ta":"البنية ككود","te":"Infrastructure as code","a":"بدل إنشاء الخوادم يدويًا من لوحة التحكم، تُكتب البنية (الشبكات والخوادم وقواعد البيانات) في ملفات مثل Terraform، وتُراجع في Git وتُطبق آليًا.\\nالنتيجة: بيئات متطابقة قابلة للتكرار، وتاريخ لكل تغيير، وإعادة بناء سريعة بعد كارثة.","e":"Instead of clicking servers together in a console, infrastructure (networks, servers, databases) is written in files such as Terraform, reviewed in Git and applied automatically.\\nThe result: identical, repeatable environments, a history of every change, and fast rebuilds after a disaster.","c":""},{"ta":"المراقبة","te":"Monitoring and observability","a":"ثلاث ركائز: السجلات (ماذا حدث)، والمقاييس (أرقام عبر الزمن مثل زمن الاستجابة ونسبة الأخطاء)، والتتبع (مسار الطلب عبر الخدمات).\\nضع تنبيهات على ما يهم المستخدم (الأخطاء، البطء)، واكتب دليل تشغيل لكل تنبيه.","e":"Three pillars: logs (what happened), metrics (numbers over time such as latency and error rate) and traces (a request's path across services).\\nAlert on what users feel (errors, slowness) and write a runbook for every alert.","c":""}],"Q":[{"qa":"ما التكامل المستمر (CI)؟","qe":"What is continuous integration (CI)?","o":[["بناء كل إيداع واختباره آليًا","Building and testing every commit automatically"],["دمج كل الفروع مرة في الشهر","Merging all branches once a month"],["نسخ قاعدة البيانات يوميًا","Copying the database daily"],["تحديث نظام التشغيل","Updating the OS"]],"wa":"الهدف اكتشاف الأخطاء خلال دقائق لا أسابيع.","we":"The goal is to catch bugs in minutes, not weeks."},{"qa":"ما المشكلة التي تحلها الحاويات؟","qe":"What problem do containers solve?","o":[["اختلاف البيئات: «يعمل على جهازي فقط»","Environment drift: \"works on my machine\""],["ضعف كلمات المرور","Weak passwords"],["بطء الشبكة","Slow networks"],["تعارضات Git","Git conflicts"]],"wa":"الصورة تحمل كل ما يحتاجه التطبيق فتعمل في كل مكان بالطريقة نفسها.","we":"The image carries everything the app needs, so it runs the same everywhere."},{"qa":"لماذا يحتوي ملف Dockerfile أعلاه على `USER node`؟","qe":"Why does the Dockerfile above contain `USER node`?","o":[["ليعمل التطبيق دون صلاحيات الجذر","So the app doesn't run as root"],["لتسريع البناء","To speed up the build"],["لأن Node يتطلب ذلك","Node requires it"],["لتثبيت المكتبات","To install packages"]],"wa":"أقل الصلاحيات داخل الحاوية يحد من أثر أي اختراق.","we":"Least privilege inside the container limits the damage of a compromise."},{"qa":"ما فائدة البنية ككود؟","qe":"What does infrastructure as code give you?","o":[["بيئات قابلة للتكرار والمراجعة في Git","Repeatable environments reviewed in Git"],["خوادم مجانية","Free servers"],["عدم الحاجة للاختبار","No need for testing"],["تشفيرًا تلقائيًا","Automatic encryption"]],"wa":"كل تغيير في البنية له إيداع ومراجعة ويمكن التراجع عنه.","we":"Every infrastructure change has a commit, a review and a way back."},{"qa":"أي ركيزة مراقبة تُظهر مسار طلب واحد عبر عدة خدمات؟","qe":"Which observability pillar shows one request's path across services?","o":[["التتبع","Tracing"],["المقاييس","Metrics"],["السجلات فقط","Logs only"],["النسخ الاحتياطي","Backups"]],"wa":"التتبع الموزّع يربط أجزاء الطلب بمعرّف واحد.","we":"Distributed tracing ties the pieces of a request together with one ID."},{"qa":"لماذا يُفضَّل النشر الصغير المتكرر؟","qe":"Why prefer small, frequent deployments?","o":[["لأن كل تغيير صغير أسهل في الفحص والتراجع","Each small change is easier to check and roll back"],["لأن المستخدمين يحبون التحديثات","Users like updates"],["لأنه يلغي الحاجة للاختبار","It removes the need for tests"],["لأنه أرخص في الخوادم","It's cheaper on servers"]],"wa":"عند حدوث خطأ تعرف بالضبط أي تغيير سببه.","we":"When something breaks you know exactly which change caused it."}],"T":[{"h":"持续集成","p":"chíxù jíchéng","ar":"التكامل المستمر","en":"continuous integration"},{"h":"持续部署","p":"chíxù bùshǔ","ar":"النشر المستمر","en":"continuous deployment"},{"h":"部署","p":"bùshǔ","ar":"نشر","en":"deployment"},{"h":"容器","p":"róngqì","ar":"حاوية","en":"container"},{"h":"镜像","p":"jìngxiàng","ar":"صورة (image)","en":"image"},{"h":"云计算","p":"yún jìsuàn","ar":"الحوسبة السحابية","en":"cloud computing"},{"h":"监控","p":"jiānkòng","ar":"مراقبة","en":"monitoring"},{"h":"运维","p":"yùnwéi","ar":"العمليات والتشغيل","en":"operations (ops)"},{"h":"流水线","p":"liúshuǐxiàn","ar":"خط أنابيب (pipeline)","en":"pipeline"},{"h":"自动化","p":"zìdònghuà","ar":"أتمتة","en":"automation"}],"D":[{"s":"A","zh":"流水线又失败了。","py":"Liúshuǐxiàn yòu shībài le.","ar":"فشل خط الأنابيب مرة أخرى.","en":"The pipeline failed again."},{"s":"B","zh":"是测试失败还是部署失败？","py":"Shì cèshì shībài háishi bùshǔ shībài?","ar":"هل فشل الاختبار أم النشر؟","en":"Did the tests fail or the deployment?"},{"s":"A","zh":"镜像构建的时候少了一个依赖。","py":"Jìngxiàng gòujiàn de shíhou shǎo le yí ge yīlài.","ar":"عند بناء الصورة كانت مكتبة تابعة ناقصة.","en":"A dependency was missing when building the image."},{"s":"B","zh":"改好以后让监控盯一下。","py":"Gǎi hǎo yǐhòu ràng jiānkòng dīng yíxià.","ar":"بعد الإصلاح راقب النظام عن قرب.","en":"After the fix, keep a close eye on monitoring."}]},{"k":"se-agile","tr":"se","ic":"🔁","zh":"敏捷开发","py":"mǐnjié kāifā","ar":"منهجيات العمل الرشيقة","en":"Agile and the software process","sa":"دورة حياة البرمجيات، وسكرم والدورات القصيرة، وقصص المستخدم، والتقدير، وتحديد الأولويات.","se":"The software life cycle, Scrum and sprints, user stories, estimation and prioritisation.","L":[{"ta":"دورة حياة البرمجيات","te":"The software life cycle","a":"المراحل: تحليل المتطلبات ← التصميم ← التنفيذ ← الاختبار ← النشر ← الصيانة. في نموذج الشلال تتم كل مرحلة مرة واحدة بالترتيب.\\nفي المنهجيات الرشيقة تتكرر الدورة كاملة كل أسبوعين تقريبًا، فيرى العميل نتائج مبكرة ويمكن تعديل الاتجاه.","e":"The phases: requirements → design → implementation → testing → deployment → maintenance. In waterfall each phase happens once, in order.\\nIn agile the whole loop repeats about every two weeks, so customers see results early and the direction can change.","c":""},{"ta":"سكرم","te":"Scrum","a":"الأدوار: مالك المنتج (يحدد الأولويات)، ومسؤول سكرم (يزيل العوائق)، وفريق التطوير.\\nالفعاليات: تخطيط الدورة (Sprint planning)، والاجتماع اليومي القصير (15 دقيقة: ماذا أنجزت؟ ماذا سأفعل؟ ما العوائق؟)، ومراجعة الدورة مع أصحاب المصلحة، والاسترجاع (Retrospective) لتحسين طريقة العمل.","e":"Roles: product owner (sets priorities), Scrum master (removes blockers) and the development team.\\nEvents: sprint planning, the daily stand-up (15 minutes: what did I do, what will I do, what's blocking me), the sprint review with stakeholders, and the retrospective to improve how the team works.","c":""},{"ta":"قصص المستخدم","te":"User stories","a":"تُكتب المتطلبات من منظور المستخدم: «بصفتي عميلًا، أريد حفظ بطاقتي، لكي أدفع أسرع».\\nلكل قصة معايير قبول واضحة قابلة للاختبار. القصة الجيدة صغيرة بما يكفي لتنتهي في دورة واحدة.","e":"Requirements are written from the user's point of view: \"As a customer, I want to save my card so that I can pay faster.\"\\nEach story has clear, testable acceptance criteria. A good story is small enough to finish in one sprint.","c":""},{"ta":"التقدير والأولويات","te":"Estimation and priorities","a":"يقدّر الفريق الجهد بنقاط نسبية (1، 2، 3، 5، 8…) لا بالساعات، لأن المقارنة أسهل من التنبؤ. سرعة الفريق (Velocity) = النقاط المنجزة في الدورة.\\nرتّب الأولويات بالقيمة مقابل الجهد، وقلل العمل الجاري في الوقت نفسه، وعرّف بوضوح معنى «منجز».","e":"Teams estimate effort in relative points (1, 2, 3, 5, 8…) rather than hours, because comparing is easier than predicting. Velocity = points completed per sprint.\\nPrioritise by value versus effort, limit work in progress, and define clearly what \"done\" means.","c":""}],"Q":[{"qa":"من يحدد أولويات العمل في سكرم؟","qe":"Who sets the priorities in Scrum?","o":[["مالك المنتج","The product owner"],["مسؤول سكرم","The Scrum master"],["أحدث مطوّر في الفريق","The newest developer"],["العميل وحده دائمًا","The customer alone, always"]],"wa":"مالك المنتج يرتب قائمة المهام حسب القيمة.","we":"The product owner orders the backlog by value."},{"qa":"ما الأسئلة الثلاثة في الاجتماع اليومي القصير؟","qe":"What are the three stand-up questions?","o":[["ماذا أنجزت؟ ماذا ستفعل؟ ما العوائق؟","What did I do? What will I do? What's blocking me?"],["كم ساعة عملت؟ كم بقي؟ من تأخر؟","How many hours? How many left? Who is late?"],["ما الميزانية؟ ما السعر؟ ما الربح؟","Budget? Price? Profit?"],["من المدير؟ من المسؤول؟ من المخطئ؟","Who's the boss? Who's in charge? Who's to blame?"]],"wa":"الاجتماع للتنسيق وكشف العوائق، لا لمحاسبة الأفراد.","we":"It's for coordination and surfacing blockers, not for blame."},{"qa":"أي صياغة قصة مستخدم صحيحة؟","qe":"Which is a well-formed user story?","o":[["«بصفتي عميلًا، أريد حفظ بطاقتي، لكي أدفع أسرع»","\"As a customer, I want to save my card so that I can pay faster\""],["«أضف جدول البطاقات»","\"Add a cards table\""],["«أصلح الكود»","\"Fix the code\""],["«يجب أن يكون التطبيق جيدًا»","\"The app should be good\""]],"wa":"الصيغة تحدد المستخدم والهدف والفائدة.","we":"The format names the user, the goal and the benefit."},{"qa":"ما الهدف من اجتماع الاسترجاع (Retrospective)؟","qe":"What is the retrospective for?","o":[["تحسين طريقة عمل الفريق","Improving how the team works"],["عرض المنتج للعميل","Demoing to the customer"],["تقدير المهام الجديدة","Estimating new work"],["تقييم أداء الأفراد للرواتب","Rating people for pay"]],"wa":"الفريق يراجع ما نجح وما يجب تغييره في الدورة القادمة.","we":"The team reviews what worked and what to change next sprint."},{"qa":"لماذا يُقدَّر الجهد بنقاط نسبية لا بساعات؟","qe":"Why estimate in relative points rather than hours?","o":[["لأن مقارنة المهام أسهل من التنبؤ بالوقت","Comparing tasks is easier than predicting time"],["لأن الساعات غير قانونية","Hours aren't allowed"],["لأن النقاط تحدد الرواتب","Points set salaries"],["لأنها أدق دائمًا من الساعات","Points are always exact"]],"wa":"نعرف أن مهمة أكبر من أخرى أكثر مما نعرف عدد ساعاتها.","we":"We know one task is bigger than another better than we know its hours."},{"qa":"ما الفرق الرئيسي بين نموذج الشلال والمنهجيات الرشيقة؟","qe":"What is the main difference between waterfall and agile?","o":[["الرشيقة تكرر الدورة كاملة في فترات قصيرة","Agile repeats the full cycle in short iterations"],["الشلال لا يتضمن اختبارًا","Waterfall has no testing"],["الرشيقة لا تكتب متطلبات","Agile writes no requirements"],["الشلال أسرع دائمًا","Waterfall is always faster"]],"wa":"التكرار القصير يتيح تعديل الاتجاه مبكرًا.","we":"Short iterations let the team change direction early."}],"T":[{"h":"敏捷开发","p":"mǐnjié kāifā","ar":"التطوير الرشيق","en":"agile development"},{"h":"需求","p":"xūqiú","ar":"متطلبات","en":"requirements"},{"h":"迭代","p":"diédài","ar":"دورة تكرار","en":"iteration"},{"h":"冲刺","p":"chōngcì","ar":"دورة عمل قصيرة (sprint)","en":"sprint"},{"h":"用户故事","p":"yònghù gùshi","ar":"قصة المستخدم","en":"user story"},{"h":"站会","p":"zhànhuì","ar":"اجتماع يومي قصير","en":"stand-up meeting"},{"h":"产品经理","p":"chǎnpǐn jīnglǐ","ar":"مدير المنتج","en":"product manager"},{"h":"里程碑","p":"lǐchéngbēi","ar":"معلم رئيسي","en":"milestone"},{"h":"上线","p":"shàngxiàn","ar":"إطلاق، تشغيل فعلي","en":"go live"},{"h":"估算","p":"gūsuàn","ar":"تقدير","en":"estimate"}],"D":[{"s":"A","zh":"这个用户故事能在这个冲刺完成吗？","py":"Zhège yònghù gùshi néng zài zhège chōngcì wánchéng ma?","ar":"هل يمكن إنجاز قصة المستخدم هذه في هذه الدورة؟","en":"Can this user story be finished this sprint?"},{"s":"B","zh":"估算是八个点，有点大。","py":"Gūsuàn shì bā ge diǎn, yǒudiǎn dà.","ar":"تقديرها ثماني نقاط، كبيرة قليلًا.","en":"It's estimated at eight points; a bit big."},{"s":"A","zh":"那我们拆成两个故事吧。","py":"Nà wǒmen chāi chéng liǎng ge gùshi ba.","ar":"إذن لنقسمها إلى قصتين.","en":"Then let's split it into two stories."},{"s":"B","zh":"好，先做最重要的部分上线。","py":"Hǎo, xiān zuò zuì zhòngyào de bùfen shàngxiàn.","ar":"حسنًا، ننجز الجزء الأهم أولًا ونطلقه.","en":"OK, build and ship the most important part first."}]},{"k":"cy-found","tr":"cy","ic":"🛡️","zh":"安全基础","py":"ānquán jīchǔ","ar":"أسس الأمن السيبراني","en":"Security foundations","sa":"ثالوث السرية والسلامة والإتاحة، والتهديد والثغرة والمخاطرة، والدفاع المتعدد الطبقات ومبدأ أقل الصلاحيات.","se":"The CIA triad, threats, vulnerabilities and risk, defence in depth and least privilege.","L":[{"ta":"ثالوث CIA","te":"The CIA triad","a":"كل قرار أمني يحمي واحدًا أو أكثر من ثلاثة أهداف:\\nالسرية (Confidentiality): لا يطّلع على البيانات إلا المخوَّل. السلامة (Integrity): لا تتغير البيانات دون إذن ودون أن نكتشف ذلك. الإتاحة (Availability): يصل المستخدمون المخوَّلون إلى النظام حين يحتاجونه.\\nتسريب قاعدة بيانات يمس السرية، وتعديل مبلغ تحويل يمس السلامة، وهجوم حجب الخدمة يمس الإتاحة.","e":"Every security decision protects one or more of three goals:\\nConfidentiality: only authorised people see the data. Integrity: data does not change without permission, or we detect it when it does. Availability: authorised users reach the system when they need it.\\nA leaked database hits confidentiality, a tampered transfer amount hits integrity, and a denial-of-service attack hits availability.","c":""},{"ta":"التهديد والثغرة والمخاطرة","te":"Threat, vulnerability and risk","a":"الثغرة (Vulnerability) ضعف في النظام، مثل برنامج غير محدَّث. التهديد (Threat) جهة أو حدث قد يستغل الثغرة، مثل مجموعة فدية. المخاطرة (Risk) = احتمال الاستغلال × أثره على العمل.\\nلا يمكن إزالة كل المخاطر؛ تعالجها المؤسسة بالتقليل أو النقل (كالتأمين) أو التجنب أو القبول الواعي.","e":"A vulnerability is a weakness, such as unpatched software. A threat is an actor or event that could exploit it, such as a ransomware gang. Risk = likelihood of exploitation × business impact.\\nYou cannot remove every risk; organisations reduce, transfer (for example insurance), avoid, or knowingly accept it.","c":""},{"ta":"الدفاع المتعدد الطبقات","te":"Defence in depth","a":"لا تعتمد على حاجز واحد. اجمع طبقات مستقلة: جدار ناري، ومصادقة متعددة العوامل، وتحديثات، وتشفير، ومراقبة، ونسخ احتياطية، وتدريب الموظفين.\\nإذا سقطت طبقة أوقفت الطبقة التالية المهاجم أو كشفته.","e":"Never rely on a single barrier. Stack independent layers: firewall, multi-factor authentication, patching, encryption, monitoring, backups and staff training.\\nIf one layer fails, the next one stops or exposes the attacker.","c":""},{"ta":"أقل الصلاحيات وانعدام الثقة","te":"Least privilege and zero trust","a":"أقل الصلاحيات: امنح كل مستخدم وبرنامج ما يحتاجه لعمله فقط، ولأقصر مدة. حساب محاسب لا يحتاج صلاحية مدير على الخوادم.\\nانعدام الثقة (Zero Trust): لا تثق بأي طلب لمجرد أنه من داخل الشبكة؛ تحقّق من الهوية والجهاز والسياق في كل مرة.","e":"Least privilege: give every user and program only what its job needs, for the shortest time. An accountant's account doesn't need admin rights on servers.\\nZero trust: never trust a request just because it comes from inside the network; verify identity, device and context every time.","c":""}],"Q":[{"qa":"مهاجم عدّل مبلغ تحويل بنكي أثناء نقله. أي عنصر من CIA تأثر؟","qe":"An attacker changed a bank transfer amount in transit. Which part of CIA was hit?","o":[["السلامة","Integrity"],["السرية","Confidentiality"],["الإتاحة","Availability"],["عدم الإنكار","Non-repudiation"]],"wa":"البيانات تغيّرت دون إذن، وهذا تعريف المساس بالسلامة.","we":"The data changed without permission, which is exactly an integrity breach."},{"qa":"هجوم حجب خدمة أوقف المتجر الإلكتروني ساعتين. ما الهدف المتأثر؟","qe":"A denial-of-service attack took the online shop down for two hours. Which goal was hit?","o":[["الإتاحة","Availability"],["السلامة","Integrity"],["السرية","Confidentiality"],["المصادقة","Authentication"]],"wa":"المستخدمون الشرعيون لم يصلوا إلى الخدمة.","we":"Legitimate users could not reach the service."},{"qa":"خادم يعمل بنظام تشغيل لم يُحدَّث منذ سنتين. هذا مثال على:","qe":"A server runs an OS that hasn't been patched in two years. This is an example of:","o":[["ثغرة","A vulnerability"],["تهديد","A threat"],["حادثة","An incident"],["ضابط أمني","A security control"]],"wa":"الضعف موجود في النظام نفسه، حتى قبل أن يستغله أحد.","we":"The weakness exists in the system itself, even before anyone exploits it."},{"qa":"شراء تأمين سيبراني هو مثال على:","qe":"Buying cyber insurance is an example of:","o":[["نقل المخاطرة","Transferring risk"],["تجنب المخاطرة","Avoiding risk"],["قبول المخاطرة","Accepting risk"],["إزالة الثغرة","Removing the vulnerability"]],"wa":"الأثر المالي ينتقل إلى شركة التأمين، لكن الحادثة نفسها قد تقع.","we":"The financial impact moves to the insurer, but the incident can still happen."},{"qa":"أي ممارسة تطبق مبدأ أقل الصلاحيات؟","qe":"Which practice applies least privilege?","o":[["منح موظف الدعم صلاحية قراءة فقط لما يحتاجه","Giving support staff read-only access to what they need"],["منح كل الموظفين صلاحية مدير لتسريع العمل","Giving everyone admin rights to speed things up"],["مشاركة حساب واحد بين الفريق","Sharing one account across the team"],["تعطيل السجلات لتوفير المساحة","Disabling logs to save space"]],"wa":"أقل صلاحية كافية تحدّ مما يفعله حساب مخترق.","we":"The smallest sufficient access limits what a compromised account can do."},{"qa":"ما الفكرة الأساسية لـ«انعدام الثقة» Zero Trust؟","qe":"What is the core idea of zero trust?","o":[["التحقق من كل طلب بغض النظر عن موقعه في الشبكة","Verify every request regardless of network location"],["منع كل الاتصالات الخارجية","Block all external traffic"],["الثقة بكل الأجهزة الداخلية","Trust every internal device"],["إلغاء كلمات المرور","Abolish passwords"]],"wa":"الشبكة الداخلية ليست منطقة آمنة تلقائيًا.","we":"The internal network is not automatically a safe zone."}],"T":[{"h":"网络安全","p":"wǎngluò ānquán","ar":"الأمن السيبراني","en":"cybersecurity"},{"h":"信息安全","p":"xìnxī ānquán","ar":"أمن المعلومات","en":"information security"},{"h":"机密性","p":"jīmìxìng","ar":"السرية","en":"confidentiality"},{"h":"完整性","p":"wánzhěngxìng","ar":"السلامة","en":"integrity"},{"h":"可用性","p":"kěyòngxìng","ar":"الإتاحة","en":"availability"},{"h":"威胁","p":"wēixié","ar":"تهديد","en":"threat"},{"h":"漏洞","p":"lòudòng","ar":"ثغرة","en":"vulnerability"},{"h":"风险","p":"fēngxiǎn","ar":"مخاطرة","en":"risk"},{"h":"最小权限","p":"zuìxiǎo quánxiàn","ar":"أقل الصلاحيات","en":"least privilege"},{"h":"纵深防御","p":"zòngshēn fángyù","ar":"الدفاع المتعدد الطبقات","en":"defence in depth"}],"D":[{"s":"A","zh":"这个漏洞的风险高吗？","py":"Zhège lòudòng de fēngxiǎn gāo ma?","ar":"هل مخاطر هذه الثغرة عالية؟","en":"Is this vulnerability high risk?"},{"s":"B","zh":"很高，服务器能从外网访问。","py":"Hěn gāo, fúwùqì néng cóng wàiwǎng fǎngwèn.","ar":"عالية جدًا، فالخادم متاح من الإنترنت.","en":"Very high; the server is reachable from the internet."},{"s":"A","zh":"那今天就要打补丁。","py":"Nà jīntiān jiù yào dǎ bǔdīng.","ar":"إذن يجب تثبيت الرقعة اليوم.","en":"Then we need to patch it today."},{"s":"B","zh":"对，补丁之前先限制访问。","py":"Duì, bǔdīng zhīqián xiān xiànzhì fǎngwèn.","ar":"صحيح، ولنقيّد الوصول قبل التحديث.","en":"Yes, and restrict access until it's patched."}]},{"k":"cy-crypto","tr":"cy","ic":"🔐","zh":"密码学","py":"mìmǎxué","ar":"علم التشفير","en":"Cryptography","sa":"التشفير المتماثل وغير المتماثل، ودوال التجزئة، والتوقيع الرقمي، والشهادات وبروتوكول TLS.","se":"Symmetric and asymmetric encryption, hashing, digital signatures, certificates and TLS.","L":[{"ta":"التشفير المتماثل","te":"Symmetric encryption","a":"يستخدم المفتاح نفسه للتشفير وفك التشفير. خوارزمية AES هي المعيار اليوم، وهي سريعة جدًا وتصلح لتشفير الملفات والأقراص وقواعد البيانات.\\nالتحدي: كيف تتبادل المفتاح السري مع الطرف الآخر بأمان؟","e":"One shared key both encrypts and decrypts. AES is today's standard: very fast and used for files, disks and databases.\\nThe challenge: how do you share the secret key with the other side safely?","c":""},{"ta":"التشفير غير المتماثل","te":"Asymmetric encryption","a":"لكل طرف زوج مفاتيح: مفتاح عام يُنشر للجميع، ومفتاح خاص لا يغادر صاحبه. ما يُشفَّر بالعام لا يفكه إلا الخاص.\\nهو أبطأ من AES، لذلك يُستخدم عمليًا لتبادل مفتاح متماثل مؤقت بأمان، ثم تُشفَّر البيانات بـ AES. هذا ما يحدث في كل اتصال HTTPS.","e":"Each party has a key pair: a public key shared with everyone and a private key that never leaves its owner. What the public key encrypts only the private key can decrypt.\\nIt is slower than AES, so in practice it is used to agree on a temporary symmetric key, and then AES encrypts the data. That is what happens in every HTTPS connection.","c":""},{"ta":"دوال التجزئة","te":"Hash functions","a":"دالة التجزئة (مثل SHA-256) تحوّل أي مُدخل إلى بصمة بطول ثابت. هي باتجاه واحد: لا يمكن استرجاع المُدخل من البصمة، وتغيير حرف واحد يغيّر البصمة كليًا.\\nالتجزئة ليست تشفيرًا. لتخزين كلمات المرور استخدم دوال بطيئة مخصصة مثل bcrypt أو Argon2 مع ملح (salt) فريد لكل مستخدم، ولا تستخدم MD5 أو SHA-1.","e":"A hash function (such as SHA-256) maps any input to a fixed-length fingerprint. It is one-way: you cannot recover the input from the hash, and changing one character changes the whole hash.\\nHashing is not encryption. To store passwords use slow, purpose-built functions such as bcrypt or Argon2 with a unique salt per user, never MD5 or SHA-1.","c":"const data = new TextEncoder().encode(\"hello\");\nconst buf = await crypto.subtle.digest(\"SHA-256\", data);\nconsole.log([...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, \"0\")).join(\"\"));"},{"ta":"التوقيع الرقمي والشهادات","te":"Digital signatures and certificates","a":"التوقيع الرقمي: يوقّع المرسل بصمة الرسالة بمفتاحه الخاص، ويتحقق أي شخص بالمفتاح العام. يثبت ذلك هوية المرسل وأن الرسالة لم تتغير.\\nالشهادة الرقمية تربط مفتاحًا عامًا باسم نطاق، وتوقّعها جهة تصديق موثوقة (CA). المتصفح يتحقق من الشهادة قبل أن يعرض القفل في HTTPS.","e":"Digital signature: the sender signs the message hash with their private key and anyone verifies it with the public key. That proves who sent it and that it wasn't altered.\\nA digital certificate binds a public key to a domain name and is signed by a trusted certificate authority (CA). The browser checks it before showing the HTTPS padlock.","c":""}],"Q":[{"qa":"ما الفرق الأساسي بين التشفير المتماثل وغير المتماثل؟","qe":"What is the key difference between symmetric and asymmetric encryption?","o":[["المتماثل يستخدم مفتاحًا واحدًا مشتركًا، وغير المتماثل زوج مفاتيح","Symmetric uses one shared key; asymmetric uses a key pair"],["المتماثل لا يمكن فكه أبدًا","Symmetric can never be decrypted"],["غير المتماثل أسرع دائمًا","Asymmetric is always faster"],["لا يوجد فرق عملي","There is no practical difference"]],"wa":"ولهذا يُستخدم غير المتماثل لتبادل مفتاح متماثل سريع.","we":"That is why asymmetric crypto is used to exchange a fast symmetric key."},{"qa":"أي طريقة مناسبة لتخزين كلمات مرور المستخدمين؟","qe":"Which is a proper way to store user passwords?","o":[["bcrypt or Argon2 with a unique salt","bcrypt or Argon2 with a unique salt"],["MD5 without salt","MD5 without salt"],["تشفير AES بمفتاح ثابت في الكود","AES with a key hard-coded in the source"],["نص صريح في جدول محمي","Plain text in a protected table"]],"wa":"الدوال البطيئة مع ملح فريد تجعل التخمين الجماعي مكلفًا جدًا.","we":"Slow functions with a unique salt make mass guessing very expensive."},{"qa":"ما الذي يثبته التوقيع الرقمي؟","qe":"What does a digital signature prove?","o":[["هوية المرسل وأن الرسالة لم تتغير","Who sent the message and that it wasn't changed"],["أن الرسالة مشفرة","That the message is encrypted"],["أن المرسل يستخدم HTTPS","That the sender uses HTTPS"],["أن الرسالة وصلت بسرعة","That the message arrived quickly"]],"wa":"يُتحقق منه بالمفتاح العام، ولا يصنعه إلا صاحب المفتاح الخاص.","we":"It is verified with the public key and only the private-key holder can create it."},{"qa":"أي مفتاح يجب ألا يغادر جهاز صاحبه أبدًا؟","qe":"Which key must never leave its owner?","o":[["المفتاح الخاص","The private key"],["المفتاح العام","The public key"],["شهادة جهة التصديق","The CA certificate"],["مفتاح الجلسة بعد انتهائها","The session key after it expires"]],"wa":"من يملك المفتاح الخاص يستطيع انتحال هويتك وفك رسائلك.","we":"Whoever holds the private key can impersonate you and read your messages."},{"qa":"غيّرت حرفًا واحدًا في ملف. ماذا يحدث لبصمة SHA-256؟","qe":"You change one character in a file. What happens to its SHA-256 hash?","o":[["تتغير البصمة كلها تقريبًا","Almost the whole hash changes"],["يتغير حرف واحد في البصمة","One character of the hash changes"],["لا تتغير","It doesn't change"],["تصبح أطول","It gets longer"]],"wa":"«تأثير الانهيار» يجعل أي تعديل صغير ظاهرًا فورًا.","we":"The avalanche effect makes any small change obvious."},{"qa":"ما دور جهة التصديق (CA)؟","qe":"What does a certificate authority do?","o":[["توقّع شهادات تربط المفاتيح العامة بأسماء النطاقات","Signs certificates binding public keys to domain names"],["تخزن كلمات مرور المستخدمين","Stores users' passwords"],["تفك تشفير حركة المرور","Decrypts network traffic"],["تمنع هجمات حجب الخدمة","Blocks denial-of-service attacks"]],"wa":"المتصفح يثق بالموقع لأنه يثق بالجهة التي وقّعت شهادته.","we":"The browser trusts the site because it trusts the CA that signed its certificate."}],"T":[{"h":"密码学","p":"mìmǎxué","ar":"علم التشفير","en":"cryptography"},{"h":"加密","p":"jiāmì","ar":"تشفير","en":"encryption"},{"h":"解密","p":"jiěmì","ar":"فك التشفير","en":"decryption"},{"h":"明文","p":"míngwén","ar":"نص صريح","en":"plaintext"},{"h":"密文","p":"mìwén","ar":"نص مشفّر","en":"ciphertext"},{"h":"密钥","p":"mìyào","ar":"مفتاح تشفير","en":"cryptographic key"},{"h":"公钥","p":"gōngyào","ar":"مفتاح عام","en":"public key"},{"h":"私钥","p":"sīyào","ar":"مفتاح خاص","en":"private key"},{"h":"哈希","p":"hāxī","ar":"تجزئة (hash)","en":"hash"},{"h":"数字签名","p":"shùzì qiānmíng","ar":"توقيع رقمي","en":"digital signature"},{"h":"证书","p":"zhèngshū","ar":"شهادة","en":"certificate"}],"D":[{"s":"A","zh":"用户密码是怎么存的？","py":"Yònghù mìmǎ shì zěnme cún de?","ar":"كيف تُخزَّن كلمات مرور المستخدمين؟","en":"How are user passwords stored?"},{"s":"B","zh":"用加盐哈希，不存明文。","py":"Yòng jiāyán hāxī, bù cún míngwén.","ar":"بتجزئة مع ملح، ولا نخزن النص الصريح.","en":"Salted hashes; we never store plaintext."},{"s":"A","zh":"私钥放在哪里？","py":"Sīyào fàng zài nǎlǐ?","ar":"وأين يُحفظ المفتاح الخاص؟","en":"Where is the private key kept?"},{"s":"B","zh":"在密钥管理系统里，只有服务能读。","py":"Zài mìyào guǎnlǐ xìtǒng lǐ, zhǐyǒu fúwù néng dú.","ar":"في نظام إدارة المفاتيح، ولا تقرؤه إلا الخدمة.","en":"In the key management system; only the service can read it."}]},{"k":"cy-iam","tr":"cy","ic":"🪪","zh":"身份与访问管理","py":"shēnfèn yǔ fǎngwèn guǎnlǐ","ar":"إدارة الهوية والوصول","en":"Identity and access management","sa":"المصادقة والتفويض، والمصادقة متعددة العوامل، والدخول الموحد، والصلاحيات حسب الدور، والجلسات والرموز.","se":"Authentication vs authorisation, MFA, single sign-on, role-based access, sessions and tokens.","L":[{"ta":"المصادقة والتفويض","te":"Authentication and authorisation","a":"المصادقة (Authentication) تجيب: من أنت؟ عبر كلمة مرور أو بصمة أو مفتاح أمان.\\nالتفويض (Authorization) يجيب: ماذا يُسمح لك أن تفعل؟ مستخدم مصادَق عليه قد لا يملك صلاحية حذف الطلبات.\\nكثير من الاختراقات سببها خلل في التفويض: يُتحقق من الهوية ولا يُتحقق من الصلاحية.","e":"Authentication answers \"who are you?\" with a password, fingerprint or security key.\\nAuthorisation answers \"what may you do?\": a logged-in user may still lack the right to delete orders.\\nMany breaches come from broken authorisation: identity is checked but permission is not.","c":""},{"ta":"المصادقة متعددة العوامل","te":"Multi-factor authentication","a":"العوامل ثلاثة أنواع: شيء تعرفه (كلمة مرور)، وشيء تملكه (هاتف أو مفتاح أمان)، وشيء أنت عليه (بصمة).\\nMFA تجمع عاملين مختلفين أو أكثر، فتوقف معظم هجمات سرقة كلمات المرور. أقواها مفاتيح FIDO2 ومفاتيح المرور (passkeys) لأنها تقاوم التصيد؛ رسائل SMS أضعفها.","e":"Factors come in three kinds: something you know (password), something you have (phone or security key) and something you are (fingerprint).\\nMFA combines two or more different kinds and stops most stolen-password attacks. Strongest are FIDO2 keys and passkeys because they resist phishing; SMS codes are the weakest.","c":""},{"ta":"كلمات المرور الجيدة","te":"Good passwords","a":"الطول أهم من التعقيد: عبارة مرور من أربع كلمات عشوائية أقوى من «P@ssw0rd!». لا تعِد استخدام كلمة المرور في أكثر من موقع، واستخدم مدير كلمات مرور.\\nعلى جانب النظام: احظر كلمات المرور المسرّبة الشائعة، وقيّد المحاولات المتكررة، ولا تفرض تغييرًا دوريًا بلا سبب.","e":"Length beats complexity: a passphrase of four random words is stronger than \"P@ssw0rd!\". Never reuse a password across sites; use a password manager.\\nOn the system side: block common leaked passwords, rate-limit repeated attempts, and don't force periodic changes without a reason.","c":""},{"ta":"الصلاحيات حسب الدور والرموز","te":"Roles, SSO and tokens","a":"التحكم حسب الدور (RBAC): تُمنح الصلاحيات للأدوار (محاسب، مشرف) ثم يُسند الدور للمستخدم، فتسهل الإدارة والمراجعة.\\nالدخول الموحد (SSO) عبر OpenID Connect يتيح حسابًا واحدًا لعدة تطبيقات. بعد الدخول يحمل المستخدم رمزًا (token) أو جلسة؛ احمِه بأعلام `HttpOnly` و`Secure` وبمدة صلاحية قصيرة.","e":"Role-based access control (RBAC): permissions go to roles (accountant, admin) and roles go to users, which keeps management and audits simple.\\nSingle sign-on (SSO) through OpenID Connect gives one account for many apps. After login the user carries a token or session; protect it with `HttpOnly` and `Secure` flags and a short lifetime.","c":""}],"Q":[{"qa":"مستخدم سجّل دخوله بنجاح لكنه لا يستطيع فتح لوحة الإدارة. أي عملية منعته؟","qe":"A user logged in successfully but can't open the admin panel. Which process stopped them?","o":[["التفويض","Authorisation"],["المصادقة","Authentication"],["التشفير","Encryption"],["التدقيق","Auditing"]],"wa":"هويته مؤكدة، لكن صلاحياته لا تشمل الإدارة.","we":"Their identity is confirmed, but their permissions don't include admin."},{"qa":"أي طريقة مصادقة ثانية تقاوم التصيد بشكل أفضل؟","qe":"Which second factor best resists phishing?","o":[["FIDO2 security key / passkey","FIDO2 security key / passkey"],["رمز SMS","SMS code"],["سؤال أمان","Security question"],["رمز يُرسل بالبريد الإلكتروني","Emailed code"]],"wa":"المفتاح يرتبط بنطاق الموقع الحقيقي فلا يعمل على موقع مزيف.","we":"The key is bound to the real site's domain, so it won't work on a fake one."},{"qa":"أي كلمة مرور أقوى؟","qe":"Which password is stronger?","o":[["correct-horse-battery-staple","correct-horse-battery-staple"],["P@ssw0rd!","P@ssw0rd!"],["Admin2024","Admin2024"],["Qwerty123","Qwerty123"]],"wa":"الطول العشوائي يرفع عدد الاحتمالات أكثر بكثير من الرموز المتوقعة.","we":"Random length raises the number of possibilities far more than predictable symbols."},{"qa":"ما «شيء تملكه» بين عوامل المصادقة؟","qe":"Which is \"something you have\"?","o":[["هاتف عليه تطبيق المصادقة","A phone with an authenticator app"],["كلمة المرور","A password"],["بصمة الإصبع","A fingerprint"],["تاريخ الميلاد","Date of birth"]],"wa":"الحيازة المادية للجهاز هي العامل.","we":"Physical possession of the device is the factor."},{"qa":"ما فائدة علم `HttpOnly` على ملف تعريف الجلسة؟","qe":"What does the `HttpOnly` flag on a session cookie do?","o":[["يمنع جافاسكربت في الصفحة من قراءته","Stops JavaScript in the page from reading it"],["يشفّر الملف تلقائيًا","Encrypts the cookie automatically"],["يجعله صالحًا إلى الأبد","Makes it valid forever"],["يرسله عبر HTTP فقط دون HTTPS","Sends it over HTTP only, not HTTPS"]],"wa":"يحد من سرقة الجلسة عبر ثغرات XSS.","we":"It limits session theft through XSS bugs."},{"qa":"ما ميزة التحكم حسب الدور (RBAC)؟","qe":"What is the benefit of role-based access control?","o":[["إدارة الصلاحيات ومراجعتها عبر أدوار بدل أفراد","Managing and reviewing permissions via roles, not individuals"],["إلغاء الحاجة لكلمات المرور","Removing the need for passwords"],["تسريع الشبكة","Faster networking"],["تشفير قواعد البيانات","Encrypting databases"]],"wa":"موظف ينتقل لقسم آخر يتغير دوره فقط.","we":"When someone moves department, only their role changes."}],"T":[{"h":"身份认证","p":"shēnfèn rènzhèng","ar":"مصادقة الهوية","en":"authentication"},{"h":"授权","p":"shòuquán","ar":"تفويض","en":"authorisation"},{"h":"多因素认证","p":"duō yīnsù rènzhèng","ar":"مصادقة متعددة العوامل","en":"multi-factor authentication"},{"h":"密码","p":"mìmǎ","ar":"كلمة المرور","en":"password"},{"h":"单点登录","p":"dāndiǎn dēnglù","ar":"الدخول الموحد","en":"single sign-on"},{"h":"访问控制","p":"fǎngwèn kòngzhì","ar":"التحكم في الوصول","en":"access control"},{"h":"权限","p":"quánxiàn","ar":"صلاحية","en":"permission"},{"h":"角色","p":"juésè","ar":"دور","en":"role"},{"h":"会话","p":"huìhuà","ar":"جلسة","en":"session"},{"h":"令牌","p":"lìngpái","ar":"رمز (token)","en":"token"}],"D":[{"s":"A","zh":"新员工的账号开好了吗？","py":"Xīn yuángōng de zhànghào kāi hǎo le ma?","ar":"هل أُنشئ حساب الموظف الجديد؟","en":"Is the new employee's account set up?"},{"s":"B","zh":"开好了，只给了财务角色的权限。","py":"Kāi hǎo le, zhǐ gěi le cáiwù juésè de quánxiàn.","ar":"نعم، بصلاحيات دور المالية فقط.","en":"Yes, with only the finance role's permissions."},{"s":"A","zh":"多因素认证也要开启。","py":"Duō yīnsù rènzhèng yě yào kāiqǐ.","ar":"ويجب تفعيل المصادقة متعددة العوامل أيضًا.","en":"MFA must be turned on too."},{"s":"B","zh":"已经开了，用的是安全密钥。","py":"Yǐjīng kāi le, yòng de shì ānquán mìyào.","ar":"فُعّلت، باستخدام مفتاح أمان.","en":"It's on, using a security key."}]},{"k":"cy-net","tr":"cy","ic":"🌐","zh":"网络安全防护","py":"wǎngluò ānquán fánghù","ar":"أمن الشبكات","en":"Network security","sa":"المنافذ والبروتوكولات، والجدران النارية، وتقسيم الشبكة، والشبكات الافتراضية الخاصة، وأنظمة كشف التسلل، وأمن DNS.","se":"Ports and protocols, firewalls, segmentation, VPNs, intrusion detection and DNS security.","L":[{"ta":"المنافذ والبروتوكولات","te":"Ports and protocols","a":"كل خدمة على الخادم تستمع على منفذ: 22 لـ SSH، و53 لـ DNS، و80 لـ HTTP، و443 لـ HTTPS، و3389 لسطح المكتب البعيد RDP.\\nكل منفذ مفتوح على الإنترنت هو سطح هجوم. افتح فقط ما تحتاجه، وفضّل البروتوكولات المشفرة (HTTPS بدل HTTP، وSSH بدل Telnet).","e":"Every service on a server listens on a port: 22 SSH, 53 DNS, 80 HTTP, 443 HTTPS, 3389 Remote Desktop (RDP).\\nEvery port open to the internet is attack surface. Open only what you need and prefer encrypted protocols (HTTPS over HTTP, SSH over Telnet).","c":""},{"ta":"الجدار الناري","te":"Firewalls","a":"الجدار الناري يفحص كل حزمة مقابل قائمة قواعد بالترتيب، وأول قاعدة مطابقة تحدد القرار: سماح أو منع. القاعدة الأخيرة يجب أن تكون «امنع كل شيء آخر».\\nالجدار الناري للتطبيقات (WAF) يعمل على مستوى HTTP ويصد أنماط هجمات الويب الشائعة.","e":"A firewall checks each packet against an ordered list of rules; the first matching rule decides: allow or deny. The last rule should be \"deny everything else\".\\nA web application firewall (WAF) works at the HTTP level and blocks common web attack patterns.","c":"1  allow  tcp  any        → 10.0.1.5:443\n2  allow  tcp  10.0.9.0/24 → 10.0.1.5:22\n3  deny   any  any        → any"},{"ta":"تقسيم الشبكة وVPN","te":"Segmentation and VPNs","a":"قسّم الشبكة إلى مناطق: خوادم الويب العامة في منطقة DMZ، وقواعد البيانات في منطقة داخلية، وأجهزة الموظفين في أخرى. إذا اختُرق جهاز موظف لا يصل المهاجم مباشرة إلى قاعدة البيانات.\\nالشبكة الافتراضية الخاصة (VPN) تنشئ نفقًا مشفرًا عبر الإنترنت للعمل عن بعد.","e":"Split the network into zones: public web servers in a DMZ, databases in an internal zone, staff devices in another. If a laptop is compromised, the attacker cannot reach the database directly.\\nA VPN builds an encrypted tunnel across the internet for remote work.","c":""},{"ta":"كشف التسلل وDNS","te":"Intrusion detection and DNS","a":"نظام كشف التسلل (IDS) يراقب حركة المرور وينبّه عند أنماط مشبوهة، ونظام منع التسلل (IPS) يحجبها أيضًا.\\nDNS يحوّل الأسماء إلى عناوين. هجمات مثل تسميم ذاكرة DNS قد توجّه المستخدم لموقع مزيف؛ وDNSSEC يوقّع السجلات رقميًا لمنع ذلك.","e":"An intrusion detection system (IDS) watches traffic and alerts on suspicious patterns; an intrusion prevention system (IPS) also blocks them.\\nDNS turns names into addresses. Attacks such as DNS cache poisoning can send users to a fake site; DNSSEC signs records to prevent that.","c":""}],"Q":[{"qa":"ما المنفذ الافتراضي لـ HTTPS؟","qe":"What is the default HTTPS port?","o":[["443","443"],["80","80"],["22","22"],["3389","3389"]],"wa":"المنفذ 80 لـ HTTP غير المشفر.","we":"Port 80 is for unencrypted HTTP."},{"qa":"كيف يقرر الجدار الناري مصير الحزمة؟","qe":"How does a firewall decide a packet's fate?","o":[["بأول قاعدة مطابقة في القائمة المرتبة","By the first matching rule in the ordered list"],["بآخر قاعدة في القائمة","By the last rule in the list"],["بأغلبية القواعد المطابقة","By a majority of matching rules"],["بشكل عشوائي","At random"]],"wa":"ترتيب القواعد مهم: قاعدة سماح عامة في الأعلى تُبطل كل ما بعدها.","we":"Order matters: a broad allow rule at the top overrides everything below it."},{"qa":"لماذا نفصل قاعدة البيانات في منطقة شبكية داخلية؟","qe":"Why put the database in a separate internal network zone?","o":[["ليصعب على مهاجم اخترق جهازًا آخر الوصول إليها","So an attacker who compromises another machine can't reach it easily"],["لتسريع الاستعلامات","To speed up queries"],["لأن قواعد البيانات لا تعمل في DMZ","Databases can't run in a DMZ"],["لتوفير عناوين IP","To save IP addresses"]],"wa":"التقسيم يحد من الحركة الجانبية للمهاجم.","we":"Segmentation limits an attacker's lateral movement."},{"qa":"ما الفرق بين IDS وIPS؟","qe":"What is the difference between an IDS and an IPS?","o":[["IDS ينبّه فقط، وIPS يحجب الحركة أيضًا","An IDS only alerts; an IPS also blocks"],["IDS للبريد وIPS للويب","IDS is for email, IPS for web"],["لا فرق بينهما","They are the same"],["IPS ينبّه فقط","An IPS only alerts"]],"wa":"نظام المنع يقف في مسار الحركة فيستطيع إيقافها.","we":"A prevention system sits inline, so it can stop traffic."},{"qa":"ما المنفذ الذي يجب ألا يُفتح للإنترنت عادةً لأنه هدف شائع لهجمات الفدية؟","qe":"Which port should normally never be open to the internet because ransomware gangs target it?","o":[["3389 (RDP)","3389 (RDP)"],["443 (HTTPS)","443 (HTTPS)"],["53 (DNS)","53 (DNS)"],["123 (NTP)","123 (NTP)"]],"wa":"سطح المكتب البعيد المكشوف من أكثر طرق الدخول الأولي شيوعًا.","we":"Exposed Remote Desktop is one of the most common initial-access routes."},{"qa":"ما الذي يحميه DNSSEC؟","qe":"What does DNSSEC protect?","o":[["صحة سجلات DNS عبر توقيعها رقميًا","The authenticity of DNS records by signing them"],["سرية الاستعلامات بتشفيرها","Query privacy through encryption"],["سرعة الاستجابة","Response speed"],["كلمات مرور المستخدمين","User passwords"]],"wa":"DNSSEC يمنع تزوير الإجابات، لكنه لا يخفي ما تبحث عنه.","we":"DNSSEC stops forged answers but does not hide what you look up."}],"T":[{"h":"防火墙","p":"fánghuǒqiáng","ar":"جدار ناري","en":"firewall"},{"h":"端口","p":"duānkǒu","ar":"منفذ","en":"port"},{"h":"协议","p":"xiéyì","ar":"بروتوكول","en":"protocol"},{"h":"入侵检测","p":"rùqīn jiǎncè","ar":"كشف التسلل","en":"intrusion detection"},{"h":"虚拟专用网","p":"xūnǐ zhuānyòngwǎng","ar":"شبكة افتراضية خاصة","en":"virtual private network"},{"h":"流量","p":"liúliàng","ar":"حركة المرور (الشبكة)","en":"network traffic"},{"h":"数据包","p":"shùjùbāo","ar":"حزمة بيانات","en":"packet"},{"h":"网络分段","p":"wǎngluò fēnduàn","ar":"تقسيم الشبكة","en":"network segmentation"},{"h":"路由器","p":"lùyóuqì","ar":"موجّه (راوتر)","en":"router"},{"h":"拒绝服务攻击","p":"jùjué fúwù gōngjī","ar":"هجوم حجب الخدمة","en":"denial-of-service attack"}],"D":[{"s":"A","zh":"为什么3389端口对外开放？","py":"Wèishénme sān sān bā jiǔ duānkǒu duì wài kāifàng?","ar":"لماذا المنفذ 3389 مفتوح للخارج؟","en":"Why is port 3389 open to the outside?"},{"s":"B","zh":"供应商要远程维护。","py":"Gōngyìngshāng yào yuǎnchéng wéihù.","ar":"المورّد يحتاج صيانة عن بعد.","en":"The vendor needs remote maintenance."},{"s":"A","zh":"太危险了，改成通过虚拟专用网访问。","py":"Tài wēixiǎn le, gǎi chéng tōngguò xūnǐ zhuānyòngwǎng fǎngwèn.","ar":"هذا خطير جدًا، لنجعل الوصول عبر VPN.","en":"Too dangerous; switch to access through the VPN."},{"s":"B","zh":"好，我今天就改防火墙规则。","py":"Hǎo, wǒ jīntiān jiù gǎi fánghuǒqiáng guīzé.","ar":"حسنًا، سأعدّل قواعد الجدار الناري اليوم.","en":"OK, I'll change the firewall rules today."}]},{"k":"cy-web","tr":"cy","ic":"🕸️","zh":"Web应用安全","py":"Web yìngyòng ānquán","ar":"أمن تطبيقات الويب","en":"Web application security","sa":"قائمة OWASP العشرة: الحقن، وXSS، وكسر التحكم في الوصول، وCSRF، وSSRF، والإعدادات الخاطئة.","se":"The OWASP Top 10: injection, XSS, broken access control, CSRF, SSRF and misconfiguration.","L":[{"ta":"كسر التحكم في الوصول","te":"Broken access control","a":"أول خطر في قائمة OWASP العشرة. مثال: الرابط `/invoice?id=1001` يعرض فاتورتك، فيغيّر المستخدم الرقم إلى 1002 فيرى فاتورة غيره (IDOR).\\nالعلاج: تحقّق على الخادم في كل طلب من أن المستخدم يملك المورد المطلوب، ولا تعتمد على إخفاء الأزرار في الواجهة.","e":"Number one on the OWASP Top 10. Examp
