le: `/invoice?id=1001` shows your invoice, the user changes it to 1002 and sees someone else's (IDOR).\\nThe fix: on the server, check on every request that the user owns the requested resource; hiding buttons in the UI is not a control.","c":""},{"ta":"حقن SQL","te":"SQL injection","a":"يحدث حين يُلصق مُدخل المستخدم مباشرة داخل استعلام، فيستطيع المهاجم تغيير معنى الاستعلام كله.\\nالعلاج القاطع: الاستعلامات ذات المعاملات (Parameterized queries) حيث تُرسل البيانات منفصلة عن نص الاستعلام، فلا تُفسَّر أبدًا كأوامر.","e":"It happens when user input is pasted straight into a query, letting an attacker change the query's whole meaning.\\nThe definitive fix: parameterised queries, where data travels separately from the query text and is never interpreted as code.","c":"// vulnerable\ndb.query(\"SELECT * FROM users WHERE name = '\" + name + \"'\");\n// safe\ndb.query(\"SELECT * FROM users WHERE name = ?\", [name]);"},{"ta":"البرمجة عبر المواقع XSS","te":"Cross-site scripting (XSS)","a":"يحقن المهاجم جافاسكربت في صفحة يراها مستخدمون آخرون، مثل تعليق يحوي `<script>`، فيسرق جلساتهم أو يتصرف باسمهم.\\nالعلاج: رمّز المخرجات حسب السياق (استخدم `textContent` بدل `innerHTML`)، واعتمد سياسة أمان المحتوى CSP، وعلّم ملفات الجلسة بـ HttpOnly.","e":"The attacker injects JavaScript into a page other users see, such as a comment containing `<script>`, to steal sessions or act as them.\\nThe fix: encode output for its context (use `textContent` instead of `innerHTML`), add a Content Security Policy, and mark session cookies HttpOnly.","c":"// vulnerable\nel.innerHTML = comment;\n// safe\nel.textContent = comment;"},{"ta":"CSRF وSSRF والإعدادات","te":"CSRF, SSRF and misconfiguration","a":"تزوير الطلب عبر المواقع (CSRF): موقع خبيث يجعل متصفحك يرسل طلبًا لموقع أنت مسجّل فيه. يُعالج برموز CSRF وخاصية `SameSite` لملفات تعريف الارتباط.\\nتزوير الطلب من جهة الخادم (SSRF): يُقنع المهاجمُ الخادمَ بجلب رابط داخلي مثل خدمة بيانات السحابة. عالجه بقائمة مسموحة للعناوين.\\nالإعدادات الخاطئة: حسابات افتراضية، ورسائل أخطاء تكشف التفاصيل، ولوحات إدارة مكشوفة.","e":"Cross-site request forgery (CSRF): a malicious site makes your browser send a request to a site where you're logged in. Fix with CSRF tokens and `SameSite` cookies.\\nServer-side request forgery (SSRF): the attacker tricks the server into fetching an internal URL such as the cloud metadata service. Fix with an allow-list of destinations.\\nMisconfiguration: default accounts, verbose error messages, exposed admin panels.","c":""}],"Q":[{"qa":"يغيّر مستخدم `id=1001` إلى `id=1002` في الرابط فيرى بيانات عميل آخر. ما الثغرة؟","qe":"A user changes `id=1001` to `id=1002` in the URL and sees another customer's data. What is the flaw?","o":[["كسر التحكم في الوصول (IDOR)","Broken access control (IDOR)"],["حقن SQL","SQL injection"],["XSS","XSS"],["CSRF","CSRF"]],"wa":"الخادم لم يتحقق من ملكية المورد قبل إرساله.","we":"The server never checked ownership of the resource before returning it."},{"qa":"ما العلاج الصحيح لحقن SQL؟","qe":"What is the correct fix for SQL injection?","o":[["الاستعلامات ذات المعاملات","Parameterised queries"],["حذف علامات التنصيص من المُدخل","Stripping quotes from input"],["إخفاء رسائل الخطأ فقط","Only hiding error messages"],["تشفير قاعدة البيانات","Encrypting the database"]],"wa":"فصل البيانات عن الكود يمنع تفسيرها كأوامر مهما كان محتواها.","we":"Keeping data separate from code means it is never interpreted as commands, whatever it contains."},{"qa":"أي سطر آمن لعرض تعليق مستخدم في الصفحة؟","qe":"Which line safely shows a user's comment on the page?","o":[["el.textContent = comment","el.textContent = comment"],["el.innerHTML = comment","el.innerHTML = comment"],["document.write(comment)","document.write(comment)"],["eval(comment)","eval(comment)"]],"wa":"`textContent` يعرض النص حرفيًا ولا ينفّذ أي وسوم.","we":"`textContent` shows text literally and never runs tags."},{"qa":"ما الذي يحمي من CSRF؟","qe":"What protects against CSRF?","o":[["رموز CSRF وخاصية SameSite","CSRF tokens and SameSite cookies"],["كلمات مرور أطول","Longer passwords"],["التشفير المتماثل","Symmetric encryption"],["جدار ناري للشبكة","A network firewall"]],"wa":"الموقع الخبيث لا يعرف الرمز السري، والمتصفح لا يرسل الملف عبر المواقع.","we":"The malicious site can't know the secret token, and the browser won't send the cookie cross-site."},{"qa":"خادم يجلب صورة من رابط يرسله المستخدم، فيرسل المهاجم رابط خدمة بيانات السحابة الداخلية. ما الهجوم؟","qe":"A server fetches an image from a user-supplied URL; the attacker sends the internal cloud metadata URL. What attack is this?","o":[["SSRF","SSRF"],["CSRF","CSRF"],["XSS","XSS"],["IDOR","IDOR"]],"wa":"الخادم نفسه أصبح أداة للوصول إلى الشبكة الداخلية.","we":"The server itself becomes a tool for reaching the internal network."},{"qa":"رسالة خطأ تعرض نص الاستعلام ومسار الملفات للمستخدم. هذا مثال على:","qe":"An error page shows the SQL query and file paths to users. This is an example of:","o":[["إعدادات أمنية خاطئة","Security misconfiguration"],["تشفير ضعيف","Weak cryptography"],["ثغرة يوم صفر","A zero-day"],["هجوم حجب خدمة","Denial of service"]],"wa":"التفاصيل التقنية تساعد المهاجم؛ اعرض رسالة عامة وسجّل التفاصيل داخليًا.","we":"Technical details help attackers; show a generic message and log the details internally."}],"T":[{"h":"注入攻击","p":"zhùrù gōngjī","ar":"هجوم الحقن","en":"injection attack"},{"h":"跨站脚本","p":"kuàzhàn jiǎoběn","ar":"البرمجة عبر المواقع (XSS)","en":"cross-site scripting"},{"h":"跨站请求伪造","p":"kuàzhàn qǐngqiú wěizào","ar":"تزوير الطلب عبر المواقع","en":"cross-site request forgery"},{"h":"越权","p":"yuèquán","ar":"تجاوز الصلاحيات","en":"privilege overreach"},{"h":"参数化查询","p":"cānshùhuà cháxún","ar":"استعلام بمعاملات","en":"parameterised query"},{"h":"输入验证","p":"shūrù yànzhèng","ar":"التحقق من المُدخلات","en":"input validation"},{"h":"输出编码","p":"shūchū biānmǎ","ar":"ترميز المُخرجات","en":"output encoding"},{"h":"会话劫持","p":"huìhuà jiéchí","ar":"اختطاف الجلسة","en":"session hijacking"},{"h":"安全配置","p":"ānquán pèizhì","ar":"الإعدادات الأمنية","en":"security configuration"},{"h":"内容安全策略","p":"nèiróng ānquán cèlüè","ar":"سياسة أمان المحتوى","en":"content security policy"}],"D":[{"s":"A","zh":"测试发现评论区有跨站脚本漏洞。","py":"Cèshì fāxiàn pínglùnqū yǒu kuàzhàn jiǎoběn lòudòng.","ar":"كشف الاختبار ثغرة XSS في قسم التعليقات.","en":"Testing found an XSS flaw in the comments section."},{"s":"B","zh":"是不是直接用了 innerHTML？","py":"Shì bu shì zhíjiē yòng le innerHTML?","ar":"هل استُخدم innerHTML مباشرة؟","en":"Did someone use innerHTML directly?"},{"s":"A","zh":"对，要改成输出编码。","py":"Duì, yào gǎi chéng shūchū biānmǎ.","ar":"نعم، يجب تغييره إلى ترميز المُخرجات.","en":"Yes, we need to switch to output encoding."},{"s":"B","zh":"顺便加上内容安全策略。","py":"Shùnbiàn jiā shàng nèiróng ānquán cèlüè.","ar":"ولنضف معها سياسة أمان المحتوى.","en":"And add a content security policy while we're at it."}]},{"k":"cy-code","tr":"cy","ic":"🧑‍💻","zh":"安全编码","py":"ānquán biānmǎ","ar":"البرمجة الآمنة","en":"Secure coding","sa":"التحقق من المُدخلات، وإدارة الأسرار، والمكتبات التابعة، والتحليل الساكن، ومعالجة الأخطاء بأمان.","se":"Input validation, secrets management, dependencies, static analysis and safe error handling.","L":[{"ta":"لا تثق بالمُدخلات","te":"Never trust input","a":"كل ما يأتي من خارج نظامك مُدخل غير موثوق: حقول النماذج، والروابط، والترويسات، والملفات المرفوعة، وحتى ردود الخدمات الأخرى.\\nتحقّق على الخادم بقائمة مسموحة (allow-list): النوع والطول والصيغة والمدى. القائمة المسموحة أقوى من محاولة حجب كل المُدخلات الخبيثة.","e":"Everything from outside your system is untrusted: form fields, URLs, headers, uploaded files, even other services' responses.\\nValidate on the server with an allow-list: type, length, format and range. Allow-lists beat trying to block every bad input.","c":"function validAge(x) {\n  const n = Number(x);\n  return Number.isInteger(n) && n >= 0 && n <= 130;\n}\nconsole.log(validAge(\"42\"), validAge(\"42; DROP TABLE\"));"},{"ta":"الأسرار خارج الكود","te":"Secrets out of the code","a":"كلمات مرور قواعد البيانات ومفاتيح الواجهات البرمجية لا توضع في الكود ولا في Git أبدًا؛ حتى بعد حذفها تبقى في التاريخ.\\nضعها في متغيرات البيئة أو خدمة إدارة أسرار (Vault، Secrets Manager)، وبدّلها فورًا إن تسربت. أدوات فحص الأسرار في CI تمنع الإيداع العرضي.","e":"Database passwords and API keys never go in source code or Git; even after deletion they stay in history.\\nKeep them in environment variables or a secrets manager (Vault, Secrets Manager) and rotate them at once if leaked. Secret scanners in CI block accidental commits.","c":"// bad\nconst API_KEY = \"sk_live_51H...\";\n// good\nconst API_KEY = process.env.PAYMENT_API_KEY;"},{"ta":"المكتبات التابعة","te":"Dependencies","a":"معظم كود تطبيقك الحديث مكتبات خارجية. ثغرة في مكتبة واحدة (مثل Log4Shell) تكشف آلاف التطبيقات.\\nثبّت الإصدارات بملف قفل، وافحص التبعيات آليًا (SCA مثل `npm audit`)، وحدّثها بانتظام، وتحقق من اسم الحزمة قبل تثبيتها لتجنب الحزم المنتحلة.","e":"Most of a modern app is third-party libraries. One flaw in a single library (such as Log4Shell) exposes thousands of apps.\\nPin versions with a lockfile, scan dependencies automatically (SCA such as `npm audit`), update regularly, and check package names before installing to avoid typosquats.","c":""},{"ta":"التحليل الساكن ومعالجة الأخطاء","te":"Static analysis and errors","a":"التحليل الساكن (SAST) يفحص الكود قبل تشغيله بحثًا عن أنماط خطرة، ويعمل تلقائيًا في كل طلب سحب.\\nعند الخطأ: افشل بأمان (امنع الوصول ولا تسمح به)، واعرض رسالة عامة للمستخدم، وسجّل التفاصيل داخليًا دون كلمات مرور أو بيانات بطاقات.","e":"Static analysis (SAST) scans code before it runs for dangerous patterns and runs automatically on every pull request.\\nOn errors: fail closed (deny access, don't grant it), show users a generic message, and log details internally without passwords or card data.","c":""}],"Q":[{"qa":"ما أفضل طريقة للتحقق من المُدخلات؟","qe":"What is the best approach to input validation?","o":[["قائمة مسموحة على الخادم","An allow-list checked on the server"],["قائمة محجوبة في المتصفح فقط","A block-list in the browser only"],["الوثوق بالمُدخلات من المستخدمين المسجلين","Trusting input from logged-in users"],["إزالة المسافات فقط","Only trimming spaces"]],"wa":"المتصفح يمكن تجاوزه، والقائمة المحجوبة لا تحصي كل الاحتمالات.","we":"The browser can be bypassed and a block-list never covers every case."},{"qa":"طوّر أودع مفتاح API في Git ثم حذفه في إيداع لاحق. هل المشكلة حُلّت؟","qe":"A developer committed an API key to Git and deleted it in the next commit. Is it fixed?","o":[["لا، المفتاح باقٍ في التاريخ ويجب تبديله فورًا","No: it stays in history and must be rotated now"],["نعم، الحذف كافٍ","Yes, deleting it is enough"],["نعم إن كان المستودع خاصًا","Yes, if the repo is private"],["فقط إن أُعيد تسمية الملف","Only if the file is renamed"]],"wa":"أي شخص يملك نسخة من المستودع يستطيع قراءة الإيداع القديم.","we":"Anyone with a copy of the repository can read the old commit."},{"qa":"ما فائدة `npm audit` وأدوات SCA؟","qe":"What do `npm audit` and SCA tools do?","o":[["تكشف ثغرات معروفة في المكتبات التابعة","Find known vulnerabilities in dependencies"],["تشفّر الكود","Encrypt your code"],["تسرّع البناء","Speed up the build"],["تكتب الاختبارات","Write the tests"]],"wa":"تقارن إصدارات مكتباتك بقواعد بيانات الثغرات المعلنة.","we":"They compare your library versions with public vulnerability databases."},{"qa":"نظام التحقق من الصلاحيات تعطل بسبب خطأ. ماذا يجب أن يحدث؟","qe":"The permission check crashes with an error. What should happen?","o":[["يُمنع الوصول (الفشل الآمن)","Access is denied (fail closed)"],["يُسمح بالوصول حتى لا يتوقف العمل","Access is granted so work continues"],["يُعرض تتبع الخطأ للمستخدم","The stack trace is shown to the user"],["يُعاد تشغيل الخادم بلا تسجيل","The server restarts with no logging"]],"wa":"الخطأ لا يجب أن يصبح بابًا خلفيًا.","we":"An error must never become a back door."},{"qa":"أين يُحفظ مفتاح بوابة الدفع؟","qe":"Where should a payment gateway key live?","o":[["في خدمة إدارة أسرار أو متغير بيئة","In a secrets manager or environment variable"],["ثابتًا في كود الواجهة","Hard-coded in front-end code"],["في ملف README","In the README"],["في تعليق داخل الكود","In a code comment"]],"wa":"الكود يُنسخ ويُشارك، أما الأسرار فتُدار وتُبدّل بشكل منفصل.","we":"Code gets copied and shared; secrets are managed and rotated separately."},{"qa":"ما التحليل الساكن (SAST)؟","qe":"What is static analysis (SAST)?","o":[["فحص الكود المصدري دون تشغيله","Scanning source code without running it"],["مهاجمة التطبيق أثناء تشغيله","Attacking the running app"],["مراقبة الشبكة","Monitoring the network"],["اختبار الأداء","Performance testing"]],"wa":"SAST يقرأ الكود، أما DAST فيختبر التطبيق وهو يعمل.","we":"SAST reads code; DAST tests the running application."}],"T":[{"h":"安全编码","p":"ānquán biānmǎ","ar":"البرمجة الآمنة","en":"secure coding"},{"h":"白名单","p":"báimíngdān","ar":"قائمة مسموحة","en":"allow-list"},{"h":"黑名单","p":"hēimíngdān","ar":"قائمة محظورة","en":"block-list"},{"h":"硬编码","p":"yìngbiānmǎ","ar":"كتابة ثابتة في الكود","en":"hard-coding"},{"h":"密钥管理","p":"mìyào guǎnlǐ","ar":"إدارة المفاتيح","en":"key management"},{"h":"依赖项","p":"yīlàixiàng","ar":"مكتبة تابعة","en":"dependency"},{"h":"静态分析","p":"jìngtài fēnxī","ar":"التحليل الساكن","en":"static analysis"},{"h":"加盐","p":"jiāyán","ar":"إضافة الملح","en":"salting"},{"h":"转义","p":"zhuǎnyì","ar":"تهريب الأحرف (escaping)","en":"escaping"},{"h":"敏感数据","p":"mǐngǎn shùjù","ar":"بيانات حساسة","en":"sensitive data"}],"D":[{"s":"A","zh":"代码里有一个硬编码的密钥。","py":"Dàimǎ lǐ yǒu yí ge yìngbiānmǎ de mìyào.","ar":"في الكود مفتاح مكتوب بشكل ثابت.","en":"There's a hard-coded key in the code."},{"s":"B","zh":"已经提交到仓库了吗？","py":"Yǐjīng tíjiāo dào cāngkù le ma?","ar":"هل أُودع في المستودع بالفعل؟","en":"Has it already been committed to the repo?"},{"s":"A","zh":"提交了，上个星期。","py":"Tíjiāo le, shàng ge xīngqī.","ar":"نعم، الأسبوع الماضي.","en":"Yes, last week."},{"s":"B","zh":"马上换一个新密钥，旧的作废。","py":"Mǎshàng huàn yí ge xīn mìyào, jiù de zuòfèi.","ar":"بدّله بمفتاح جديد فورًا وأبطل القديم.","en":"Swap in a new key right away and revoke the old one."}]},{"k":"cy-threat","tr":"cy","ic":"🦠","zh":"恶意软件与威胁","py":"èyì ruǎnjiàn yǔ wēixié","ar":"البرمجيات الخبيثة والتهديدات","en":"Malware and threats","sa":"الفيروسات والديدان وأحصنة طروادة وبرامج الفدية، والتصيد والهندسة الاجتماعية، وسلسلة الهجوم وإطار MITRE ATT&CK.","se":"Viruses, worms, trojans and ransomware, phishing and social engineering, the kill chain and MITRE ATT&CK.","L":[{"ta":"أنواع البرمجيات الخبيثة","te":"Kinds of malware","a":"الفيروس يلتصق بملف ويحتاج من يشغّله. الدودة تنتشر وحدها عبر الشبكة. حصان طروادة يتنكر في برنامج مفيد. برنامج الفدية يشفّر الملفات ويطلب مالًا، وغالبًا يسرق البيانات قبل ذلك ليهدد بنشرها. شبكة البوتات أجهزة مخترقة يتحكم بها المهاجم عن بعد.","e":"A virus attaches to a file and needs someone to run it. A worm spreads by itself across the network. A trojan pretends to be useful software. Ransomware encrypts files and demands money, and usually steals data first to threaten a leak. A botnet is a fleet of compromised devices the attacker controls remotely.","c":""},{"ta":"التصيد والهندسة الاجتماعية","te":"Phishing and social engineering","a":"المهاجم يستغل الثقة والاستعجال بدل الثغرات التقنية: بريد «من البنك» يطلب تحديث البيانات خلال ساعة، أو اتصال من «الدعم الفني» يطلب رمز التحقق.\\nعلامات التحذير: مرسل لا يطابق النطاق الحقيقي، واستعجال وتهديد، وروابط تختلف وجهتها عن نصها، ومرفقات غير متوقعة، وطلب كلمات مرور أو رموز.","e":"Attackers exploit trust and urgency instead of technical flaws: an email \"from the bank\" demanding an update within an hour, or a call from \"IT support\" asking for your verification code.\\nWarning signs: a sender that doesn't match the real domain, urgency and threats, links whose destination differs from their text, unexpected attachments, and requests for passwords or codes.","c":""},{"ta":"سلسلة الهجوم","te":"The attack chain","a":"معظم الاختراقات تمر بمراحل: الاستطلاع ← الدخول الأولي (تصيد أو ثغرة) ← التثبيت والاستمرار ← رفع الصلاحيات ← الحركة الجانبية ← تحقيق الهدف (سرقة أو تشفير).\\nإطار MITRE ATT&CK يفهرس تكتيكات المهاجمين وتقنياتهم الحقيقية، فيستخدمه المدافعون لقياس قدرتهم على كشف كل تقنية. كل مرحلة تُكسر فيها السلسلة توقف الهجوم.","e":"Most intrusions follow stages: reconnaissance → initial access (phishing or a vulnerability) → persistence → privilege escalation → lateral movement → actions on objectives (theft or encryption).\\nMITRE ATT&CK catalogues real attackers' tactics and techniques, so defenders use it to measure which techniques they can detect. Breaking the chain at any stage stops the attack.","c":""},{"ta":"التهديدات المتقدمة وثغرات اليوم صفر","te":"Advanced threats and zero-days","a":"التهديد المتقدم المستمر (APT) مجموعة ممولة جيدًا تستهدف مؤسسة بعينها لفترة طويلة بصبر وتخفٍّ.\\nثغرة اليوم صفر غير معروفة للمصنّع ولا رقعة لها بعد. الدفاع ضدها يعتمد على الطبقات: أقل الصلاحيات، والتقسيم، والمراقبة السلوكية، والنسخ الاحتياطية غير المتصلة.","e":"An advanced persistent threat (APT) is a well-funded group that targets one organisation patiently and stealthily over a long time.\\nA zero-day is a flaw the vendor doesn't know about yet, so no patch exists. Defending against it relies on layers: least privilege, segmentation, behavioural monitoring and offline backups.","c":""}],"Q":[{"qa":"أي نوع ينتشر وحده عبر الشبكة دون تدخل المستخدم؟","qe":"Which kind spreads across the network by itself, with no user action?","o":[["الدودة","Worm"],["الفيروس","Virus"],["حصان طروادة","Trojan"],["برنامج الإعلانات","Adware"]],"wa":"الدودة تستغل ثغرة لتنسخ نفسها من جهاز إلى آخر.","we":"A worm exploits a flaw to copy itself from machine to machine."},{"qa":"بريد من «support@paypa1-security.com» يطلب تأكيد الحساب خلال ساعة. ما أوضح علامة تحذير؟","qe":"An email from \"support@paypa1-security.com\" asks you to confirm your account within an hour. What is the clearest red flag?","o":[["نطاق مرسل مزيف مع استعجال","A look-alike sender domain plus urgency"],["أن البريد باللغة الإنجليزية","It's in English"],["أنه وصل صباحًا","It arrived in the morning"],["أن فيه شعار الشركة","It has the company logo"]],"wa":"الرقم 1 بدل الحرف l، والضغط الزمني من أساليب التصيد الكلاسيكية.","we":"The digit 1 replacing the letter l, plus time pressure, are classic phishing tricks."},{"qa":"ما أفضل حماية من برامج الفدية بعد وقوع الإصابة؟","qe":"What is the best protection from ransomware once infection happens?","o":[["نسخ احتياطية غير متصلة ومُجرّبة","Offline, tested backups"],["دفع الفدية فورًا","Paying the ransom at once"],["إعادة تشغيل الأجهزة","Rebooting the machines"],["تغيير خلفية الشاشة","Changing the wallpaper"]],"wa":"النسخ غير المتصلة لا يستطيع البرنامج تشفيرها، والتجربة تضمن أن الاستعادة تعمل.","we":"Offline copies can't be encrypted by the malware, and testing proves restore works."},{"qa":"ما فائدة إطار MITRE ATT&CK للمدافعين؟","qe":"How does MITRE ATT&CK help defenders?","o":[["يفهرس تقنيات المهاجمين لقياس تغطية الكشف","It catalogues attacker techniques to measure detection coverage"],["يحجب الهجمات تلقائيًا","It blocks attacks automatically"],["يشفّر الشبكة","It encrypts the network"],["يحدد رواتب فريق الأمن","It sets security team salaries"]],"wa":"هو لغة مشتركة لوصف ما يفعله المهاجم وما نستطيع رصده.","we":"It's a shared language for what attackers do and what we can see."},{"qa":"ما ثغرة اليوم صفر؟","qe":"What is a zero-day?","o":[["ثغرة غير معروفة للمصنّع ولا رقعة لها بعد","A flaw unknown to the vendor with no patch yet"],["ثغرة عمرها يوم واحد","A flaw that is one day old"],["هجوم يقع منتصف الليل","An attack at midnight"],["برنامج بلا أي ثغرة","Software with no flaws"]],"wa":"لهذا لا يكفي التحديث وحده، ونحتاج طبقات دفاع أخرى.","we":"That is why patching alone isn't enough and other layers are needed."},{"qa":"اتصل «الدعم الفني» يطلب رمز التحقق الذي وصلك برسالة. ماذا تفعل؟","qe":"\"IT support\" calls asking for the code you just got by text. What do you do?","o":[["ترفض وتبلّغ فريق الأمن","Refuse and report it to security"],["تعطيه الرمز إن كان مهذبًا","Give it if they're polite"],["تعطيه نصف الرمز","Give half the code"],["تتجاهل الأمر دون إبلاغ","Ignore it without reporting"]],"wa":"الدعم الحقيقي لا يطلب رموز التحقق أبدًا.","we":"Real support never asks for verification codes."}],"T":[{"h":"恶意软件","p":"èyì ruǎnjiàn","ar":"برمجيات خبيثة","en":"malware"},{"h":"病毒","p":"bìngdú","ar":"فيروس","en":"virus"},{"h":"木马","p":"mùmǎ","ar":"حصان طروادة","en":"trojan"},{"h":"蠕虫","p":"rúchóng","ar":"دودة","en":"worm"},{"h":"勒索软件","p":"lèsuǒ ruǎnjiàn","ar":"برنامج فدية","en":"ransomware"},{"h":"钓鱼","p":"diàoyú","ar":"تصيّد (احتيالي)","en":"phishing"},{"h":"社会工程学","p":"shèhuì gōngchéngxué","ar":"الهندسة الاجتماعية","en":"social engineering"},{"h":"僵尸网络","p":"jiāngshī wǎngluò","ar":"شبكة بوتات","en":"botnet"},{"h":"零日漏洞","p":"líng rì lòudòng","ar":"ثغرة اليوم صفر","en":"zero-day vulnerability"},{"h":"攻击者","p":"gōngjīzhě","ar":"مهاجم","en":"attacker"}],"D":[{"s":"A","zh":"我收到一封奇怪的邮件，让我马上改密码。","py":"Wǒ shōudào yì fēng qíguài de yóujiàn, ràng wǒ mǎshàng gǎi mìmǎ.","ar":"وصلتني رسالة غريبة تطلب تغيير كلمة المرور فورًا.","en":"I got a strange email telling me to change my password right now."},{"s":"B","zh":"别点链接，可能是钓鱼邮件。","py":"Bié diǎn liànjiē, kěnéng shì diàoyú yóujiàn.","ar":"لا تضغط الرابط، قد تكون رسالة تصيد.","en":"Don't click the link; it may be phishing."},{"s":"A","zh":"发件人的域名也不对。","py":"Fājiànrén de yùmíng yě bú duì.","ar":"ونطاق المرسل غير صحيح أيضًا.","en":"The sender's domain is wrong too."},{"s":"B","zh":"转发给安全团队，然后删掉。","py":"Zhuǎnfā gěi ānquán tuánduì, ránhòu shān diào.","ar":"أعد توجيهها لفريق الأمن ثم احذفها.","en":"Forward it to the security team, then delete it."}]},{"k":"cy-soc","tr":"cy","ic":"📡","zh":"安全运营","py":"ānquán yùnyíng","ar":"العمليات الأمنية","en":"Security operations","sa":"مركز العمليات الأمنية، والسجلات ونظام SIEM، والتنبيهات والإنذارات الكاذبة، واستخبارات التهديدات، والصيد الاستباقي.","se":"The SOC, logs and SIEM, alerts and false positives, threat intelligence and threat hunting.","L":[{"ta":"مركز العمليات الأمنية","te":"The security operations centre","a":"مركز العمليات الأمنية (SOC) فريق يراقب على مدار الساعة. المستوى الأول يفرز التنبيهات، والثاني يحقق في الحالات الجدية، والثالث يتعامل مع الحوادث المعقدة ويصطاد التهديدات.\\nأهم مقياسين: متوسط زمن الكشف (MTTD) ومتوسط زمن الاستجابة (MTTR).","e":"A security operations centre (SOC) watches around the clock. Tier 1 triages alerts, tier 2 investigates real cases, tier 3 handles complex incidents and hunts threats.\\nThe two key metrics: mean time to detect (MTTD) and mean time to respond (MTTR).","c":""},{"ta":"السجلات ونظام SIEM","te":"Logs and SIEM","a":"السجلات هي ذاكرة الأمن: تسجيلات الدخول، وأوامر المديرين، وحركة الشبكة، وأحداث السحابة. نظام SIEM يجمعها من كل المصادر ويطبّعها ويربط الأحداث ببعضها.\\nمثال على قاعدة ربط: خمسون محاولة دخول فاشلة من عنوان واحد، ثم دخول ناجح، يعني تخمينًا ناجحًا لكلمة المرور.","e":"Logs are security's memory: logins, admin commands, network flows, cloud events. A SIEM collects them from every source, normalises them and correlates events.\\nA sample correlation rule: fifty failed logins from one address followed by a success means a password-guessing attack worked.","c":"2026-11-19 03:12:01 FAIL login user=admin src=185.220.101.4\n2026-11-19 03:12:02 FAIL login user=admin src=185.220.101.4\n... (48 more)\n2026-11-19 03:13:40 OK   login user=admin src=185.220.101.4"},{"ta":"التنبيهات والإنذارات الكاذبة","te":"Alerts and false positives","a":"الإنذار الكاذب تنبيه على نشاط سليم، والسلبي الكاذب هجوم حقيقي لم يُنبَّه عليه، وهو الأخطر.\\nكثرة الإنذارات الكاذبة تُرهق المحللين فيتجاهلون التنبيهات. الحل: ضبط القواعد، وإضافة السياق (من المستخدم؟ ما أهمية الجهاز؟)، وأتمتة المهام المتكررة (SOAR).","e":"A false positive is an alert on harmless activity; a false negative is a real attack with no alert, and it is the more dangerous one.\\nToo many false positives exhaust analysts until they ignore alerts. The fix: tune rules, add context (who is the user? how critical is the host?) and automate repetitive steps (SOAR).","c":""},{"ta":"الاستخبارات والصيد","te":"Intelligence and hunting","a":"استخبارات التهديدات تزودك بمؤشرات الاختراق (IoC) كعناوين IP وبصمات ملفات خبيثة، وبأساليب المجموعات التي تستهدف قطاعك.\\nصيد التهديدات بحث استباقي عن مهاجم تجاوز الأدوات دون تنبيه، يبدأ بفرضية مثل: «هل يستخدم أحد PowerShell مشفّرًا على أجهزة المحاسبة؟».","e":"Threat intelligence gives you indicators of compromise (IoCs) such as IP addresses and malware hashes, plus the methods of groups targeting your sector.\\nThreat hunting is a proactive search for an attacker who slipped past the tools without an alert, starting from a hypothesis such as \"is anyone running encoded PowerShell on finance laptops?\".","c":""}],"Q":[{"qa":"خمسون محاولة دخول فاشلة ثم دخول ناجح من العنوان نفسه. ماذا يعني ذلك غالبًا؟","qe":"Fifty failed logins then a success from the same address. What does it most likely mean?","o":[["تخمين ناجح لكلمة المرور","A successful password-guessing attack"],["مستخدم نسي كلمة مروره مرة","A user forgot their password once"],["عطل في الخادم","A server fault"],["تحديث تلقائي","An automatic update"]],"wa":"النمط كلاسيكي لهجوم القوة الغاشمة أو حشو بيانات الاعتماد.","we":"It's the classic pattern of brute force or credential stuffing."},{"qa":"أي الخطأين أخطر في الكشف؟","qe":"Which detection error is more dangerous?","o":[["السلبي الكاذب: هجوم بلا تنبيه","False negative: an attack with no alert"],["الإنذار الكاذب","False positive"],["كلاهما بلا أثر","Neither matters"],["التنبيه المكرر","Duplicate alerts"]],"wa":"الهجوم غير المرصود يستمر بلا أي استجابة.","we":"An unseen attack continues with no response at all."},{"qa":"ما الذي يفعله نظام SIEM؟","qe":"What does a SIEM do?","o":[["يجمع السجلات من كل المصادر ويربط الأحداث","Collects logs from every source and correlates events"],["يحجب الفيروسات على الأجهزة","Blocks viruses on laptops"],["يشفّر البريد الإلكتروني","Encrypts email"],["يدير كلمات المرور","Manages passwords"]],"wa":"الربط بين أحداث متفرقة يكشف ما لا يظهر في سجل واحد.","we":"Correlating scattered events reveals what no single log shows."},{"qa":"ما مؤشر الاختراق (IoC)؟","qe":"What is an indicator of compromise (IoC)?","o":[["أثر تقني لهجوم مثل عنوان IP أو بصمة ملف خبيث","A technical trace of an attack, such as an IP or malware hash"],["سياسة كلمات المرور","A password policy"],["تقرير مالي","A financial report"],["شهادة SSL","An SSL certificate"]],"wa":"تُضاف المؤشرات إلى أدوات الكشف لرصد الهجوم نفسه عندك.","we":"IoCs are fed into detection tools to spot the same attack in your environment."},{"qa":"المحللون يتجاهلون التنبيهات لكثرتها. ما الحل الأنسب؟","qe":"Analysts ignore alerts because there are too many. What helps most?","o":[["ضبط القواعد وإضافة السياق والأتمتة","Tune rules, add context and automate"],["إيقاف كل التنبيهات","Turn off all alerts"],["توظيف محلل واحد إضافي فقط","Hire just one more analyst"],["حذف السجلات القديمة","Delete old logs"]],"wa":"التنبيه المفيد قليل ودقيق ويحمل سياقه.","we":"A useful alert is rare, accurate and carries its context."},{"qa":"ما صيد التهديدات؟","qe":"What is threat hunting?","o":[["بحث استباقي عن مهاجم لم يُكتشف بعد","A proactive search for an undetected attacker"],["انتظار التنبيهات","Waiting for alerts"],["شراء أدوات جديدة","Buying new tools"],["اختبار الاختراق الخارجي فقط","External penetration testing only"]],"wa":"يفترض الصائد أن الاختراق وقع ويبحث عن آثاره.","we":"The hunter assumes a breach and looks for its traces."}],"T":[{"h":"安全运营中心","p":"ānquán yùnyíng zhōngxīn","ar":"مركز العمليات الأمنية","en":"security operations centre"},{"h":"日志","p":"rìzhì","ar":"سجل","en":"log"},{"h":"告警","p":"gàojǐng","ar":"تنبيه","en":"alert"},{"h":"误报","p":"wùbào","ar":"إنذار كاذب","en":"false positive"},{"h":"漏报","p":"lòubào","ar":"سلبي كاذب (هجوم غير مرصود)","en":"false negative"},{"h":"威胁情报","p":"wēixié qíngbào","ar":"استخبارات التهديدات","en":"threat intelligence"},{"h":"威胁狩猎","p":"wēixié shòuliè","ar":"صيد التهديدات","en":"threat hunting"},{"h":"关联分析","p":"guānlián fēnxī","ar":"تحليل الربط","en":"correlation analysis"},{"h":"基线","p":"jīxiàn","ar":"خط الأساس","en":"baseline"},{"h":"异常行为","p":"yìcháng xíngwéi","ar":"سلوك شاذ","en":"anomalous behaviour"}],"D":[{"s":"A","zh":"凌晨三点有一个高危告警。","py":"Língchén sān diǎn yǒu yí ge gāowēi gàojǐng.","ar":"في الثالثة فجرًا ظهر تنبيه عالي الخطورة.","en":"There was a high-severity alert at 3 a.m."},{"s":"B","zh":"是误报吗？","py":"Shì wùbào ma?","ar":"هل هو إنذار كاذب؟","en":"Is it a false positive?"},{"s":"A","zh":"不是，日志显示管理员账号从国外登录。","py":"Bú shì, rìzhì xiǎnshì guǎnlǐyuán zhànghào cóng guówài dēnglù.","ar":"لا، السجل يُظهر دخول حساب المدير من الخارج.","en":"No, the log shows the admin account logging in from abroad."},{"s":"B","zh":"马上锁定账号，开始调查。","py":"Mǎshàng suǒdìng zhànghào, kāishǐ diàochá.","ar":"اقفل الحساب فورًا وابدأ التحقيق.","en":"Lock the account now and start investigating."}]},{"k":"cy-ir","tr":"cy","ic":"🚨","zh":"应急响应与取证","py":"yìngjí xiǎngyìng yǔ qǔzhèng","ar":"الاستجابة للحوادث والتحقيق الجنائي","en":"Incident response and forensics","sa":"مراحل الاستجابة: التحضير والكشف والاحتواء والاستئصال والتعافي والدروس المستفادة، مع حفظ الأدلة وسلسلة الحيازة.","se":"Response phases: preparation, detection, containment, eradication, recovery and lessons learned, plus evidence handling and chain of custody.","L":[{"ta":"مراحل الاستجابة","te":"The response phases","a":"وفق NIST: التحضير (خطة وفريق وأدوات مسبقًا) ← الكشف والتحليل ← الاحتواء ← الاستئصال ← التعافي ← الدروس المستفادة.\\nأهم مرحلة هي التحضير: خطة مكتوبة، وأرقام التواصل، وصلاحيات جاهزة، وتمارين محاكاة قبل وقوع أي حادثة.","e":"Following NIST: preparation (plan, team and tools in advance) → detection and analysis → containment → eradication → recovery → lessons learned.\\nThe most important phase is preparation: a written plan, contact numbers, ready permissions and tabletop exercises before anything happens.","c":""},{"ta":"الاحتواء","te":"Containment","a":"الهدف إيقاف انتشار الضرر بسرعة دون إتلاف الأدلة: اعزل الجهاز المصاب عن الشبكة (لا تطفئه، فالذاكرة تحوي أدلة)، واقفل الحسابات المخترقة، واحجب عناوين المهاجم.\\nالاحتواء قصير المدى يشتري الوقت، ثم يأتي الاستئصال: إزالة البرامج الخبيثة وسد الثغرة التي دخل منها المهاجم.","e":"The goal is to stop the damage spreading quickly without destroying evidence: isolate the infected machine from the network (don't power it off; memory holds evidence), lock compromised accounts and block the attacker's addresses.\\nShort-term containment buys time; then eradication removes the malware and closes the hole the attacker came through.","c":""},{"ta":"الأدلة الرقمية","te":"Digital evidence","a":"اجمع الأدلة من الأكثر تبخرًا إلى الأقل: الذاكرة، ثم الاتصالات الشبكية، ثم الأقراص، ثم السجلات المحفوظة.\\nخذ نسخة مطابقة (Image) للقرص واحسب بصمتها لتثبت أنها لم تتغير، واعمل على النسخة لا الأصل. سلسلة الحيازة توثّق من استلم الدليل ومتى وماذا فعل به، وبدونها قد يُرفض الدليل.","e":"Collect evidence from most volatile to least: memory, then network connections, then disks, then stored logs.\\nTake a forensic image of the disk and hash it to prove it hasn't changed, and work on the copy, not the original. Chain of custody records who handled the evidence, when and what they did; without it the evidence may be rejected.","c":""},{"ta":"التعافي والدروس المستفادة","te":"Recovery and lessons learned","a":"أعد الأنظمة من نسخ نظيفة، وراقبها عن قرب لأسابيع، وغيّر كلمات المرور والمفاتيح.\\nبعد كل حادثة اعقد مراجعة بلا لوم: ماذا حدث؟ لماذا لم نكتشفه أسرع؟ ماذا نغيّر؟ وحوّل الإجابات إلى مهام لها مالك وموعد.","e":"Restore systems from clean copies, watch them closely for weeks, and rotate passwords and keys.\\nAfter every incident hold a blameless review: what happened, why didn't we detect it sooner, what do we change? Turn the answers into tasks with an owner and a date.","c":""}],"Q":[{"qa":"ما أول مرحلة في دورة الاستجابة للحوادث حسب NIST؟","qe":"What is the first phase of the NIST incident response cycle?","o":[["التحضير","Preparation"],["الاحتواء","Containment"],["الاستئصال","Eradication"],["التعافي","Recovery"]],"wa":"الخطة والفريق والأدوات يجب أن تكون جاهزة قبل الحادثة.","we":"The plan, team and tools must exist before the incident."},{"qa":"اكتشفت جهازًا مصابًا ببرنامج فدية. ما الإجراء الصحيح أولًا؟","qe":"You find a laptop infected with ransomware. What is the right first action?","o":[["عزله عن الشبكة دون إطفائه","Isolate it from the network without powering it off"],["إطفاؤه فورًا","Shut it down immediately"],["إعادة تثبيت النظام فورًا","Reinstall the OS at once"],["تركه يعمل كما هو","Leave it as it is"]],"wa":"العزل يوقف الانتشار، وإبقاؤه يعمل يحفظ أدلة الذاكرة.","we":"Isolation stops the spread; keeping it on preserves memory evidence."},{"qa":"ما ترتيب جمع الأدلة الصحيح؟","qe":"What is the right order for collecting evidence?","o":[["من الأكثر تبخرًا إلى الأقل: الذاكرة أولًا","Most volatile first: memory first"],["الأقراص أولًا لأنها الأكبر","Disks first because they're biggest"],["السجلات القديمة أولًا","Old logs first"],["لا يهم الترتيب","Order doesn't matter"]],"wa":"محتوى الذاكرة يضيع عند الإطفاء أو إعادة التشغيل.","we":"Memory contents vanish on shutdown or reboot."},{"qa":"لماذا تحسب بصمة (hash) لنسخة القرص الجنائية؟","qe":"Why hash the forensic disk image?","o":[["لإثبات أن الدليل لم يتغير","To prove the evidence hasn't changed"],["لتشفير الدليل","To encrypt the evidence"],["لتصغير حجم النسخة","To shrink the image"],["لتسريع التحليل","To speed up analysis"]],"wa":"أي تغيير ولو بت واحد يغيّر البصمة.","we":"Any change, even one bit, changes the hash."},{"qa":"ما «سلسلة الحيازة»؟","qe":"What is chain of custody?","o":[["توثيق من تعامل مع الدليل ومتى وماذا فعل","A record of who handled evidence, when and what they did"],["قائمة الأجهزة المصابة","A list of infected machines"],["ترتيب مراحل الاستجابة","The order of response phases"],["سلسلة رسائل البريد للمهاجم","The attacker's email thread"]],"wa":"بدونها يمكن الطعن في صحة الدليل أمام جهة قانونية.","we":"Without it the evidence can be challenged in a legal setting."},{"qa":"ما روح مراجعة ما بعد الحادثة؟","qe":"What is the spirit of a post-incident review?","o":[["بلا لوم وتركز على تحسين الأنظمة","Blameless, focused on improving systems"],["البحث عن موظف لمعاقبته","Finding someone to punish"],["إخفاء الحادثة عن الإدارة","Hiding it from management"],["إغلاق الملف بأسرع وقت","Closing the case as fast as possible"]],"wa":"اللوم يجعل الناس يخفون الأخطاء، فتتكرر الحوادث.","we":"Blame makes people hide mistakes, so incidents repeat."}],"T":[{"h":"应急响应","p":"yìngjí xiǎngyìng","ar":"الاستجابة للطوارئ","en":"incident response"},{"h":"遏制","p":"èzhì","ar":"احتواء","en":"containment"},{"h":"根除","p":"gēnchú","ar":"استئصال","en":"eradication"},{"h":"恢复","p":"huīfù","ar":"تعافٍ، استعادة","en":"recovery"},{"h":"取证","p":"qǔzhèng","ar":"جمع الأدلة الجنائية","en":"forensics"},{"h":"证据","p":"zhèngjù","ar":"دليل","en":"evidence"},{"h":"隔离","p":"gélí","ar":"عزل","en":"isolation"},{"h":"溯源","p":"sùyuán","ar":"تتبع المصدر","en":"attribution, tracing the source"},{"h":"复盘","p":"fùpán","ar":"مراجعة ما بعد الحادثة","en":"post-incident review"},{"h":"安全事件","p":"ānquán shìjiàn","ar":"حادثة أمنية","en":"security incident"}],"D":[{"s":"A","zh":"财务部有三台电脑被勒索软件加密了。","py":"Cáiwùbù yǒu sān tái diànnǎo bèi lèsuǒ ruǎnjiàn jiāmì le.","ar":"ثلاثة أجهزة في قسم المالية شفّرها برنامج فدية.","en":"Three finance computers have been encrypted by ransomware."},{"s":"B","zh":"先断网隔离，不要关机。","py":"Xiān duàn wǎng gélí, búyào guānjī.","ar":"افصلها عن الشبكة أولًا ولا تطفئها.","en":"Disconnect them first, and don't shut them down."},{"s":"A","zh":"备份还能用吗？","py":"Bèifèn hái néng yòng ma?","ar":"هل النسخ الاحتياطية صالحة؟","en":"Are the backups still usable?"},{"s":"B","zh":"离线备份没受影响，可以恢复。","py":"Líxiàn bèifèn méi shòu yǐngxiǎng, kěyǐ huīfù.","ar":"النسخ غير المتصلة لم تتأثر، يمكننا الاستعادة.","en":"The offline backups weren't affected; we can restore."}]},{"k":"cy-cloud","tr":"cy","ic":"☁️","zh":"云安全与开发安全","py":"yún ānquán yǔ kāifā ānquán","ar":"أمن السحابة وDevSecOps","en":"Cloud security and DevSecOps","sa":"نموذج المسؤولية المشتركة، وإعدادات الهوية والتخزين، وأمن الحاويات، وأمن سلسلة التوريد، ونقل الأمان إلى بداية التطوير.","se":"The shared responsibility model, identity and storage misconfiguration, container security, supply chain security and shifting left.","L":[{"ta":"المسؤولية المشتركة","te":"Shared responsibility","a":"مزوّد السحابة مسؤول عن أمن السحابة نفسها: مراكز البيانات والأجهزة وطبقة الافتراضية. وأنت مسؤول عن أمنك داخل السحابة: الهويات والصلاحيات والبيانات وإعدادات الشبكة والتطبيقات.\\nمعظم حوادث السحابة سببها إعدادات خاطئة من العميل، لا اختراق المزوّد.","e":"The cloud provider is responsible for security of the cloud: data centres, hardware and the virtualisation layer. You are responsible for security in the cloud: identities, permissions, data, network settings and applications.\\nMost cloud incidents come from customer misconfiguration, not from the provider being breached.","c":""},{"ta":"الإعدادات الخاطئة الأخطر","te":"The riskiest misconfigurations","a":"حاوية تخزين (Bucket) مفتوحة للعامة تسرّب ملايين السجلات. مفاتيح وصول طويلة الأمد في الكود أو على جهاز مطوّر. أدوار بصلاحيات `*` على كل شيء. قواعد بيانات بعنوان عام. سجلات تدقيق معطّلة.\\nالعلاج: حجب الوصول العام افتراضيًا، وأدوار مؤقتة بدل المفاتيح الثابتة، وأدوات إدارة الوضع الأمني (CSPM) التي تفحص الإعدادات باستمرار.","e":"A storage bucket open to the public leaks millions of records. Long-lived access keys in code or on a developer laptop. Roles with `*` permissions on everything. Databases with public addresses. Disabled audit logs.\\nThe fix: block public access by default, use temporary roles instead of static keys, and run posture management (CSPM) tools that check settings continuously.","c":""},{"ta":"نقل الأمان إلى البداية","te":"Shifting security left","a":"DevSecOps يدمج الأمان في كل مرحلة من خط الأنابيب بدل فحصه في النهاية: تحليل الكود الساكن (SAST)، وفحص المكتبات التابعة (SCA)، وفحص الأسرار، وفحص صور الحاويات، ثم اختبار التطبيق وهو يعمل (DAST).\\nإصلاح الثغرة أثناء الكتابة أرخص بكثير من إصلاحها بعد الإطلاق.","e":"DevSecOps builds security into every pipeline stage instead of checking at the end: static code analysis (SAST), dependency scanning (SCA), secret scanning, container image scanning, then testing the running app (DAST).\\nFixing a flaw while writing code is far cheaper than after release.","c":""},{"ta":"سلسلة التوريد","te":"The software supply chain","a":"المهاجمون يستهدفون الأدوات والمكتبات التي تبنيها، كما في هجوم SolarWinds: اختراق خطوة البناء لدى مورّد واحد أصاب آلاف العملاء.\\nالدفاع: قائمة مكونات البرمجيات (SBOM)، وتوقيع الصور والحزم، وحماية خط البناء بأقل الصلاحيات، والتحقق من مصدر كل تبعية.","e":"Attackers target the tools and libraries you build with, as in the SolarWinds attack: compromising one vendor's build step infected thousands of customers.\\nDefences: a software bill of materials (SBOM), signed images and packages, a least-privilege build pipeline, and verifying where every dependency comes from.","c":""}],"Q":[{"qa":"من المسؤول عن صلاحيات المستخدمين داخل حسابك السحابي؟","qe":"Who is responsible for user permissions inside your cloud account?","o":[["أنت (العميل)","You, the customer"],["مزوّد السحابة","The cloud provider"],["لا أحد","Nobody"],["مزوّد الإنترنت","Your internet provider"]],"wa":"الهويات والصلاحيات جزء من «أمنك داخل السحابة».","we":"Identities and permissions are part of security in the cloud, which is yours."},{"qa":"ما السبب الأكثر شيوعًا لحوادث السحابة؟","qe":"What is the most common cause of cloud incidents?","o":[["إعدادات خاطئة من العميل","Customer misconfiguration"],["اختراق مراكز بيانات المزوّد","Provider data centres being breached"],["الكوارث الطبيعية","Natural disasters"],["انقطاع الكهرباء","Power cuts"]],"wa":"حاويات مفتوحة وصلاحيات واسعة تتصدر أسباب التسريب.","we":"Open buckets and broad permissions top the list of leak causes."},{"qa":"ما البديل الأفضل لمفاتيح الوصول الثابتة طويلة الأمد؟","qe":"What is the better alternative to long-lived static access keys?","o":[["أدوار وبيانات اعتماد مؤقتة","Roles with temporary credentials"],["كتابة المفاتيح في ملف README","Putting keys in the README"],["مفتاح واحد مشترك لكل الفريق","One shared key for the whole team"],["مفاتيح أطول","Longer keys"]],"wa":"البيانات المؤقتة تنتهي صلاحيتها تلقائيًا، فتسريبها أقل ضررًا.","we":"Temporary credentials expire automatically, so a leak does less harm."},{"qa":"ماذا يعني «نقل الأمان إلى اليسار» Shift left؟","qe":"What does \"shift left\" mean?","o":[["دمج فحوص الأمان مبكرًا في التطوير","Building security checks in early in development"],["نقل الخوادم إلى منطقة أخرى","Moving servers to another region"],["تأجيل الأمان لما بعد الإطلاق","Postponing security until after launch"],["كتابة الكود من اليسار إلى اليمين","Writing code left to right"]],"wa":"خط الزمن يُرسم من اليسار، والبداية أرخص مكان لإصلاح الأخطاء.","we":"Timelines run left to right, and the start is the cheapest place to fix flaws."},{"qa":"ما قائمة مكونات البرمجيات (SBOM)؟","qe":"What is a software bill of materials (SBOM)?","o":[["قائمة بكل المكونات والمكتبات في البرنامج وإصداراتها","A list of every component and library in the software and its version"],["فاتورة شراء التراخيص","A licence purchase invoice"],["مخطط قاعدة البيانات","A database diagram"],["خطة الاختبار","A test plan"]],"wa":"عند ظهور ثغرة في مكتبة تعرف فورًا أي أنظمتك تتأثر.","we":"When a library flaw appears you know at once which systems are affected."},{"qa":"أي فحص يختبر التطبيق وهو يعمل؟","qe":"Which scan tests the application while it runs?","o":[["DAST","DAST"],["SAST","SAST"],["SCA","SCA"],["SBOM","SBOM"]],"wa":"الفحص الديناميكي يرسل طلبات حقيقية للتطبيق ويراقب الاستجابات.","we":"Dynamic testing sends real requests to the app and watches the responses."}],"T":[{"h":"云安全","p":"yún ānquán","ar":"أمن السحابة","en":"cloud security"},{"h":"责任共担","p":"zérèn gòngdān","ar":"المسؤولية المشتركة","en":"shared responsibility"},{"h":"访问密钥","p":"fǎngwèn mìyào","ar":"مفتاح الوصول","en":"access key"},{"h":"存储桶","p":"cúnchǔtǒng","ar":"حاوية تخزين (bucket)","en":"storage bucket"},{"h":"错误配置","p":"cuòwù pèizhì","ar":"إعداد خاطئ","en":"misconfiguration"},{"h":"供应链攻击","p":"gōngyìngliàn gōngjī","ar":"هجوم سلسلة التوريد","en":"supply chain attack"},{"h":"漏洞扫描","p":"lòudòng sǎomiáo","ar":"فحص الثغرات","en":"vulnerability scanning"},{"h":"安全左移","p":"ānquán zuǒyí","ar":"نقل الأمان إلى البداية","en":"shift-left security"},{"h":"容器安全","p":"róngqì ānquán","ar":"أمن الحاويات","en":"container security"},{"h":"零信任","p":"líng xìnrèn","ar":"انعدام الثقة","en":"zero trust"}],"D":[{"s":"A","zh":"扫描发现一个存储桶是公开的。","py":"Sǎomiáo fāxiàn yí ge cúnchǔtǒng shì gōngkāi de.","ar":"كشف الفحص أن إحدى حاويات التخزين عامة.","en":"The scan found a storage bucket that is public."},{"s":"B","zh":"里面有用户数据吗？","py":"Lǐmiàn yǒu yònghù shùjù ma?","ar":"هل فيها بيانات مستخدمين؟","en":"Is there user data in it?"},{"s":"A","zh":"有一些日志文件。","py":"Yǒu yìxiē rìzhì wénjiàn.","ar":"فيها بعض ملفات السجلات.","en":"There are some log files."},{"s":"B","zh":"马上关闭公开访问，再查访问日志。","py":"Mǎshàng guānbì gōngkāi fǎngwèn, zài chá fǎngwèn rìzhì.","ar":"أغلق الوصول العام فورًا، ثم افحص سجلات الوصول.","en":"Close public access now, then check the access logs."}]},{"k":"cy-grc","tr":"cy","ic":"📜","zh":"治理、风险与合规","py":"zhìlǐ, fēngxiǎn yǔ héguī","ar":"الحوكمة والمخاطر والامتثال","en":"Governance, risk and compliance","sa":"السياسات الأمنية، وتقييم المخاطر، وأطر ISO 27001 وNIST CSF، وضوابط الهيئة الوطنية للأمن السيبراني ونظام حماية البيانات الشخصية، واستمرارية الأعمال.","se":"Security policies, risk assessment, ISO 27001 and NIST CSF, Saudi NCA controls and the PDPL, and business continuity.","L":[{"ta":"الحوكمة والسياسات","te":"Governance and policy","a":"الحوكمة تحدد من يقرر في الأمن ومن يُحاسَب: مجلس الإدارة يحدد شهية المخاطر، ومسؤول أمن المعلومات (CISO) يقود البرنامج.\\nالسياسة وثيقة عليا تقول «ماذا» (مثلًا: كل البيانات الحساسة مشفرة)، والمعيار يحدد «كيف بالضبط» (AES-256)، والإجراء يصف الخطوات.","e":"Governance defines who decides and who is accountable in security: the board sets risk appetite and the CISO runs the programme.\\nA policy is a high-level document saying what (for example, all sensitive data is encrypted); a standard says exactly how (AES-256); a procedure lists the steps.","c":""},{"ta":"تقييم المخاطر","te":"Risk assessment","a":"حدد الأصول (البيانات والأنظمة)، والتهديدات، والثغرات، ثم قيّم الاحتمال والأثر لكل مخاطرة في سجل المخاطر.\\nلكل مخاطرة قرار ومالك: معالجة بضوابط، أو نقل، أو تجنب، أو قبول موثّق. ركّز الموارد على المخاطر الأعلى أولًا.","e":"Identify assets (data and systems), threats and vulnerabilities, then rate the likelihood and impact of each risk in a risk register.\\nEach risk gets a decision and an owner: treat with controls, transfer, avoid, or accept in writing. Spend resources on the highest risks first.","c":""},{"ta":"الأطر والمعايير","te":"Frameworks and standards","a":"ISO/IEC 27001: معيار دولي لنظام إدارة أمن المعلومات، تحصل عليه المؤسسة بشهادة بعد تدقيق.\\nNIST CSF 2.0: إطار من ست وظائف: الحوكمة، والتحديد، والحماية، والكشف، والاستجابة، والتعافي.\\nفي المملكة: الضوابط الأساسية للأمن السيبراني (ECC) من الهيئة الوطنية للأمن السيبراني، ونظام حماية البيانات الشخصية (PDPL). وفي الصين: نظام الحماية المتدرجة (等级保护) وقانون حماية المعلومات الشخصية.","e":"ISO/IEC 27001: the international standard for an information security management system, certified after an audit.\\nNIST CSF 2.0: a framework of six functions: Govern, Identify, Protect, Detect, Respond, Recover.\\nIn Saudi Arabia: the NCA Essential Cybersecurity Controls (ECC) and the Personal Data Protection Law (PDPL). In China: the Multi-Level Protection Scheme (等级保护) and the Personal Information Protection Law.","c":""},{"ta":"استمرارية الأعمال والتوعية","te":"Continuity and awareness","a":"خطة استمرارية الأعمال تحدد كيف تستمر الخدمات الحرجة أثناء الكارثة. مقياسان مهمان: هدف زمن الاستعادة (RTO) كم يمكن أن نتوقف، وهدف نقطة الاستعادة (RPO) كم من البيانات يمكن أن نخسر.\\nالتدريب على التوعية الأمنية مع محاكاة التصيد يقلل الخطأ البشري، وهو سبب كثير من الحوادث.","e":"A business continuity plan says how critical services keep running during a disaster. Two key measures: the recovery time objective (RTO), how long you can be down, and the recovery point objective (RPO), how much data you can lose.\\nSecurity awareness training with phishing simulations reduces human error, which causes many incidents.","c":""}],"Q":[{"qa":"ما الفرق بين السياسة والمعيار؟","qe":"What is the difference between a policy and a standard?","o":[["السياسة تقول «ماذا»، والمعيار يحدد «كيف بالضبط»","A policy says what; a standard says exactly how"],["لا فرق","There is none"],["المعيار أعلى من السياسة دائمًا","A standard always outranks policy"],["السياسة تقنية فقط","A policy is purely technical"]],"wa":"مثلًا: «شفّر البيانات الحساسة» سياسة، و«AES-256» معيار.","we":"For example, \"encrypt sensitive data\" is policy; \"AES-256\" is the standard."},{"qa":"ما الوظائف الست في إطار NIST CSF 2.0؟","qe":"What are the six functions of NIST CSF 2.0?","o":[["الحوكمة، التحديد، الحماية، الكشف، الاستجابة، التعافي","Govern, Identify, Protect, Detect, Respond, Recover"],["التخطيط، البناء، الاختبار، النشر، المراقبة، الإغلاق","Plan, Build, Test, Deploy, Monitor, Close"],["السرية، السلامة، الإتاحة، المصادقة، التفويض، التدقيق","Confidentiality, Integrity, Availability, AuthN, AuthZ, Audit"],["التحليل، التصميم، التنفيذ، التشغيل، الصيانة، الاستبدال","Analyse, Design, Implement, Operate, Maintain, Replace"]],"wa":"أضيفت وظيفة الحوكمة في الإصدار 2.0 عام 2024.","we":"Govern was added in version 2.0 in 2024."},{"qa":"ما الجهة التي أصدرت الضوابط الأساسية للأمن السيبراني (ECC) في السعودية؟","qe":"Which body issued Saudi Arabia's Essential Cybersecurity Controls (ECC)?","o":[["الهيئة الوطنية للأمن السيبراني","The National Cybersecurity Authority (NCA)"],["البنك المركزي الأوروبي","The European Central Bank"],["المعهد الأمريكي NIST","The US NIST"],["منظمة ISO","ISO"]],"wa":"الضوابط تلزم الجهات الحكومية والبنية التحتية الحساسة.","we":"The controls apply to government bodies and critical infrastructure."},{"qa":"الشركة تتحمل خسارة بيانات ساعة واحدة على الأكثر. أي مقياس هذا؟","qe":"The company can lose at most one hour of data. Which measure is this?","o":[["RPO (recovery point objective)","RPO (recovery point objective)"],["RTO (recovery time objective)","RTO (recovery time objective)"],["MTTR","MTTR"],["SLA","SLA"]],"wa":"RPO يحدد عمر آخر نسخة مقبولة، وبالتالي تكرار النسخ الاحتياطي.","we":"RPO sets how old the last acceptable copy may be, and so how often you back up."},{"qa":"ما الذي يحتويه سجل المخاطر؟","qe":"What does a risk register contain?","o":[["المخاطر واحتمالها وأثرها وقرارها ومالكها","Risks, likelihood, impact, decision and owner"],["كلمات مرور الأنظمة","System passwords"],["قائمة الموظفين ورواتبهم","Staff list and salaries"],["سجلات الجدار الناري","Firewall logs"]],"wa":"السجل أداة إدارة حية تُراجع دوريًا.","we":"The register is a living management tool reviewed regularly."},{"qa":"ما نظام «الحماية المتدرجة» 等级保护؟","qe":"What is the Multi-Level Protection Scheme (等级保护)?","o":[["نظام صيني يصنّف الأنظمة حسب أهميتها ويحدد ضوابط كل مستوى","China's scheme grading systems by importance with controls per level"],["معيار أوروبي للخصوصية","A European privacy standard"],["اسم برنامج مكافحة فيروسات","An antivirus product"],["خوارزمية تشفير","An encryption algorithm"]],"wa":"الشركات العاملة في الصين تحتاج غالبًا إلى الامتثال له.","we":"Companies operating in China usually need to comply with it."}],"T":[{"h":"合规","p":"héguī","ar":"امتثال","en":"compliance"},{"h":"审计","p":"shěnjì","ar":"تدقيق","en":"audit"},{"h":"安全策略","p":"ānquán cèlüè","ar":"سياسة أمنية","en":"security policy"},{"h":"风险评估","p":"fēngxiǎn pínggū","ar":"تقييم المخاطر","en":"risk assessment"},{"h":"等级保护","p":"děngjí bǎohù","ar":"الحماية المتدرجة","en":"multi-level protection scheme"},{"h":"个人信息保护","p":"gèrén xìnxī bǎohù","ar":"حماية المعلومات الشخصية","en":"personal information protection"},{"h":"数据分类","p":"shùjù fēnlèi","ar":"تصنيف البيانات","en":"data classification"},{"h":"业务连续性","p":"yèwù liánxùxìng","ar":"استمرارية الأعمال","en":"business continuity"},{"h":"控制措施","p":"kòngzhì cuòshī","ar":"ضوابط","en":"controls"},{"h":"安全意识培训","p":"ānquán yìshí péixùn","ar":"التدريب على التوعية الأمنية","en":"security awareness training"}],"D":[{"s":"A","zh":"下个月有合规审计，准备得怎么样？","py":"Xià ge yuè yǒu héguī shěnjì, zhǔnbèi de zěnmeyàng?","ar":"التدقيق على الامتثال الشهر القادم، كيف التحضير؟","en":"The compliance audit is next month; how's the preparation?"},{"s":"B","zh":"风险评估做完了，还缺几份制度文件。","py":"Fēngxiǎn pínggū zuò wán le, hái quē jǐ fèn zhìdù wénjiàn.","ar":"انتهى تقييم المخاطر، وتنقصنا بعض وثائق السياسات.","en":"The risk assessment is done; a few policy documents are missing."},{"s":"A","zh":"员工培训记录呢？","py":"Yuángōng péixùn jìlù ne?","ar":"وماذا عن سجلات تدريب الموظفين؟","en":"What about staff training records?"},{"s":"B","zh":"上周都整理好了。","py":"Shàng zhōu dōu zhěnglǐ hǎo le.","ar":"رُتّبت كلها الأسبوع الماضي.","en":"They were all sorted out last week."}]},{"k":"cy-eh","tr":"cy","ic":"🎯","zh":"渗透测试","py":"shèntòu cèshì","ar":"الاختراق الأخلاقي واختبار الاختراق","en":"Ethical hacking and penetration testing","sa":"التفويض والنطاق، ومنهجية الاختبار، وتقييم الثغرات ودرجات CVSS، والفرق الحمراء والزرقاء، والإفصاح المسؤول.","se":"Authorisation and scope, testing methodology, vulnerability assessment and CVSS, red and blue teams, and responsible disclosure.","L":[{"ta":"التفويض أولًا","te":"Authorisation first","a":"الفرق بين الاختراق الأخلاقي والجريمة هو الإذن المكتوب. قبل أي اختبار: عقد يحدد النطاق (أي أنظمة وعناوين بالضبط)، والممنوعات (مثل هجمات حجب الخدمة)، والتوقيت، وجهات الاتصال للطوارئ.\\nاختبار نظام خارج النطاق، حتى بنية حسنة، مخالف للقانون في معظم الدول، ومنها نظام مكافحة الجرائم المعلوماتية في السعودية.","e":"The difference between ethical hacking and crime is written permission. Before any test: a contract defining the scope (exactly which systems and addresses), what's forbidden (such as denial of service), timing, and emergency contacts.\\nTesting a system outside scope, even with good intentions, is illegal in most countries, including under Saudi Arabia's Anti-Cyber Crime Law.","c":""},{"ta":"منهجية الاختبار","te":"The testing method","a":"المراحل: التخطيط والنطاق ← جمع المعلومات (النطاقات، والخدمات المكشوفة) ← فحص الثغرات ← التحقق اليدوي من الثغرات المؤثرة ← التقرير ← إعادة الاختبار بعد الإصلاح.\\nالأطر المرجعية: OWASP Testing Guide لتطبيقات الويب، وPTES وNIST SP 800-115 للاختبار العام.","e":"The stages: planning and scope → information gathering (domains, exposed services) → vulnerability scanning → manual verification of impactful findings → reporting → retesting after fixes.\\nReference methods: the OWASP Testing Guide for web apps, and PTES and NIST SP 800-115 for general testing.","c":""},{"ta":"تقييم الثغرات والتقرير","te":"Rating and reporting","a":"نظام CVSS يعطي كل ثغرة درجة من 0 إلى 10 حسب سهولة الاستغلال وأثره. 9.0 فأكثر حرجة.\\nالتقرير الجيد يبدأ بملخص تنفيذي بلغة الأعمال، ثم لكل ثغرة: الوصف، والأثر، وخطوات إعادة الإنتاج، والدليل، وتوصية إصلاح واضحة. قيمة الاختبار في الإصلاحات التي يدفع إليها.","e":"CVSS gives each vulnerability a score from 0 to 10 based on how easy it is to exploit and its impact. 9.0 and above is critical.\\nA good report opens with an executive summary in business language, then for each finding: description, impact, reproduction steps, evidence and a clear fix. A test is worth the fixes it drives.","c":""},{"ta":"الفرق الحمراء والزرقاء والإفصاح","te":"Red, blue and disclosure","a":"الفريق الأحمر يحاكي مهاجمًا حقيقيًا لاختبار قدرة المؤسسة على الكشف والاستجابة. الفريق الأزرق يدافع. الفريق البنفسجي يجمعهما لتحسين الكشف معًا.\\nإذا وجدت ثغرة في منتج: أبلغ المصنّع بشكل خاص، وامنحه وقتًا للإصلاح قبل النشر (الإفصاح المسؤول)، أو استخدم برنامج مكافآت الثغرات الرسمي إن وُجد.","e":"The red team emulates a real attacker to test detection and response. The blue team defends. A purple team brings them together to improve detection.\\nIf you find a flaw in a product: report it privately to the vendor and give them time to fix it before publishing (responsible disclosure), or use the official bug bounty programme if there is one.","c":""}],"Q":[{"qa":"ما الذي يجعل اختبار الاختراق قانونيًا؟","qe":"What makes a penetration test legal?","o":[["إذن مكتوب بنطاق محدد","Written permission with a defined scope"],["أن تكون النية حسنة","Good intentions"],["ألا يتضرر شيء","Nothing gets damaged"],["أن تُبلغ بعد الاختبار","Telling them afterwards"]],"wa":"بدون إذن مكتوب يُعد الاختبار وصولًا غير مشروع.","we":"Without written permission the test is unauthorised access."},{"qa":"وجدت أثناء الاختبار خادمًا مثيرًا للاهتمام خارج النطاق المتفق عليه. ماذا تفعل؟","qe":"During a test you find an interesting server outside the agreed scope. What do you do?","o":[["تتوقف وتبلغ العميل وتطلب توسيع النطاق كتابيًا","Stop, tell the client and ask for a written scope change"],["تختبره بسرعة لأنه مهم","Test it quickly because it matters"],["تختبره دون ذكره في التقرير","Test it and leave it out of the report"],["تنشره على الإنترنت","Post it online"]],"wa":"النطاق حدّ قانوني لا يتغير شفهيًا.","we":"Scope is a legal boundary that doesn't change verbally."},{"qa":"ثغرة درجتها 9.8 في CVSS. ما تصنيفها؟","qe":"A vulnerability scores 9.8 on CVSS. How is it rated?","o":[["حرجة","Critical"],["منخفضة","Low"],["متوسطة","Medium"],["معلوماتية","Informational"]],"wa":"9.0 إلى 10 تصنيف حرج.","we":"9.0 to 10 is critical."},{"qa":"ما أهم جزء لقارئ الإدارة في تقرير الاختبار؟","qe":"Which part of a test report matters most to executives?","o":[["الملخص التنفيذي بلغة الأعمال","The executive summary in business language"],["قائمة الأدوات المستخدمة","The list of tools used"],["المخرجات الخام للفحص","Raw scanner output"],["عدد ساعات العمل","Hours worked"]],"wa":"الإدارة تحتاج الأثر والأولويات لا التفاصيل التقنية.","we":"Executives need impact and priorities, not technical detail."},{"qa":"ما الإفصاح المسؤول؟","qe":"What is responsible disclosure?","o":[["إبلاغ المصنّع سرًا ومنحه وقتًا للإصلاح قبل النشر","Reporting privately to the vendor and allowing time to fix before publishing"],["نشر الثغرة فورًا على وسائل التواصل","Posting the flaw on social media at once"],["بيع الثغرة لمن يدفع أكثر","Selling it to the highest bidder"],["عدم إخبار أحد أبدًا","Never telling anyone"]],"wa":"يحمي المستخدمين ويمنح المصنّع فرصة عادلة.","we":"It protects users and gives the vendor a fair chance."},{"qa":"ما دور الفريق الأحمر؟","qe":"What does a red team do?","o":[["يحاكي مهاجمًا حقيقيًا لاختبار الكشف والاستجابة","Emulates a real attacker to test detection and response"],["يكتب سياسات الأمن","Writes security policies"],["يدير الجدار الناري يوميًا","Runs the firewall day to day"],["يدقق الحسابات المالية","Audits the finances"]],"wa":"الفريق الأزرق يدافع، والأحمر يختبر دفاعه.","we":"The blue team defends; the red team tests that defence."}],"T":[{"h":"渗透测试","p":"shèntòu cèshì","ar":"اختبار الاختراق","en":"penetration testing"},{"h":"白帽子","p":"báimàozi","ar":"قبعة بيضاء (مخترق أخلاقي)","en":"white hat"},{"h":"测试范围","p":"cèshì fànwéi","ar":"نطاق الاختبار","en":"test scope"},{"h":"信息收集","p":"xìnxī shōují","ar":"جمع المعلومات","en":"information gathering"},{"h":"漏洞评估","p":"lòudòng pínggū","ar":"تقييم الثغرات","en":"vulnerability assessment"},{"h":"漏洞赏金","p":"lòudòng shǎngjīn","ar":"مكافأة الثغرات","en":"bug bounty"},{"h":"红队","p":"hóngduì","ar":"الفريق الأحمر","en":"red team"},{"h":"蓝队","p":"lánduì","ar":"الفريق الأزرق","en":"blue team"},{"h":"攻击面","p":"gōngjīmiàn","ar":"سطح الهجوم","en":"attack surface"},{"h":"修复建议","p":"xiūfù jiànyì","ar":"توصية الإصلاح","en":"remediation advice"}],"D":[{"s":"A","zh":"这次渗透测试的范围确定了吗？","py":"Zhè cì shèntòu cèshì de fànwéi quèdìng le ma?","ar":"هل حُدّد نطاق اختبار الاختراق هذه المرة؟","en":"Has the scope of this penetration test been agreed?"},{"s":"B","zh":"确定了，只测官网和手机应用接口。","py":"Quèdìng le, zhǐ cè guānwǎng hé shǒujī yìngyòng jiēkǒu.","ar":"نعم، الموقع الرسمي وواجهة تطبيق الجوال فقط.","en":"Yes, only the official website and the mobile app API."},{"s":"A","zh":"授权书签了吗？","py":"Shòuquánshū qiān le ma?","ar":"هل وُقّع خطاب التفويض؟","en":"Has the authorisation letter been signed?"},{"s":"B","zh":"签了，下周一开始。","py":"Qiān le, xià zhōuyī kāishǐ.","ar":"وُقّع، نبدأ الاثنين القادم.","en":"Signed; we start next Monday."}]}]</script><script type="application/json" id="d-talk">[{"k":"soft","zh":"软件工程","ar":"هندسة البرمجيات","en":"Software engineering","sec":"it","emo":"💻","scenes":[{"k":"standup","zh":"每日站会","ar":"الاجتماع اليومي القصير","en":"Daily stand-up","pz":"林组长","pa":"قائد الفريق لين","pe":"Team lead Lin","ma":"مطوّر الواجهة","me":"Front-end developer","sa":"اجتماع الصباح القصير مع قائد فريقك لين في شركة برمجيات في شنتشن.","se":"Morning stand-up with your team lead Lin at a software company in Shenzhen.","hsk":4,"turns":[{"p":["早上好，开始站会吧。你昨天做了什么？","Zǎoshang hǎo, kāishǐ zhànhuì ba. Nǐ zuótiān zuò le shénme?","صباح الخير، لنبدأ الاجتماع. ماذا أنجزت أمس؟","Morning, let’s start the stand-up. What did you do yesterday?"],"o":[{"t":"A","zh":"昨天我完成了登录页面的接口，还写了单元测试。","py":"Zuótiān wǒ wánchéng le dēnglù yèmiàn de jiēkǒu, hái xiě le dānyuán cèshì.","ar":"أمس أنهيت واجهة برمجة صفحة تسجيل الدخول، وكتبت اختبارات الوحدات.","en":"Yesterday I finished the login page API and wrote unit tests.","na":"","ne":""},{"t":"B","zh":"我写了很多代码。","py":"Wǒ xiě le hěn duō dàimǎ.","ar":"كتبت كودًا كثيرًا.","en":"I wrote a lot of code.","na":"حدّد ما أنجزته.","ne":"Say what you actually finished."},{"t":"X","zh":"我忘了。","py":"Wǒ wàng le.","ar":"نسيت.","en":"I forgot.","na":"حضّر تحديثك قبل الاجتماع.","ne":"Prepare your update before the meeting."}]},{"p":["很好。今天打算做什么？","Hěn hǎo. Jīntiān dǎsuàn zuò shénme?","جيد. ماذا ستعمل اليوم؟","Good. What’s your plan today?"],"o":[{"t":"A","zh":"今天我开始做支付功能，下午和后端一起联调。","py":"Jīntiān wǒ kāishǐ zuò zhīfù gōngnéng, xiàwǔ hé hòuduān yìqǐ liántiáo.","ar":"اليوم أبدأ ميزة الدفع، وعصرًا أختبر الربط مع فريق الخلفية.","en":"Today I start the payment feature and integrate with the back end this afternoon.","na":"","ne":""},{"t":"B","zh":"继续写代码。","py":"Jìxù xiě dàimǎ.","ar":"أكمل كتابة الكود.","en":"Keep coding.","na":"اذكر المهمة المحددة.","ne":"Name the specific task."},{"t":"X","zh":"今天我休息。","py":"Jīntiān wǒ xiūxi.","ar":"سأرتاح اليوم.","en":"I’m taking it easy today.","na":"غير مهني في اجتماع العمل.","ne":"Unprofessional in a work meeting."}]},{"p":["有没有遇到什么阻碍？","Yǒu méiyǒu yù dào shénme zǔ'ài?","هل تواجه أي عوائق؟","Any blockers?"],"o":[{"t":"A","zh":"有一个：测试环境的数据库连不上，需要运维帮忙。","py":"Yǒu yí ge: cèshì huánjìng de shùjùkù lián bu shàng, xūyào yùnwéi bāngmáng.","ar":"نعم، قاعدة بيانات بيئة الاختبار لا تتصل، وأحتاج مساعدة فريق التشغيل.","en":"One: I can’t connect to the test database and need help from ops.","na":"","ne":""},{"t":"B","zh":"有一点儿，我自己解决吧。","py":"Yǒu yìdiǎnr, wǒ zìjǐ jiějué ba.","ar":"شيء بسيط، سأحلّه بنفسي.","en":"A small one, I’ll handle it myself.","na":"أعلن العوائق مبكرًا ليساعدك الفريق.","ne":"Raise blockers early so the team can help."},{"t":"X","zh":"问题太多了，说不完。","py":"Wèntí tài duō le, shuō bu wán.","ar":"المشكلات كثيرة لا تنتهي.","en":"Too many problems to list.","na":"كن محددًا ومختصرًا.","ne":"Be specific and brief."}]},{"p":["好，会后我帮你联系运维。","Hǎo, huì hòu wǒ bāng nǐ liánxì yùnwéi.","حسنًا، بعد الاجتماع أتواصل لك مع فريق التشغيل.","OK, after the meeting I’ll contact ops for you."],"o":[{"t":"A","zh":"谢谢！另外，支付功能可能需要三天，比估计的多一天。","py":"Xièxie! Lìngwài, zhīfù gōngnéng kěnéng xūyào sān tiān, bǐ gūjì de duō yì tiān.","ar":"شكرًا! وأيضًا ميزة الدفع قد تحتاج ثلاثة أيام، أي يومًا أكثر من التقدير.","en":"Thanks! Also, payments may take three days, one more than estimated.","na":"","ne":""},{"t":"B","zh":"谢谢。","py":"Xièxie.","ar":"شكرًا.","en":"Thanks.","na":"نبّه مبكرًا إلى أي تأخير متوقّع.","ne":"Flag expected delays early."},{"t":"X","zh":"不用了，我不着急。","py":"Búyòng le, wǒ bù zháojí.","ar":"لا داعي، لست مستعجلًا.","en":"No need, I’m in no hurry.","na":"العائق يؤخّر الفريق كله.","ne":"The blocker delays the whole team."}]},{"p":["明白，我会更新迭代计划。","Míngbai, wǒ huì gēngxīn diédài jìhuà.","مفهوم، سأحدّث خطة الدورة.","Got it, I’ll update the sprint plan."],"o":[{"t":"A","zh":"好的，有进展我会在群里同步。","py":"Hǎo de, yǒu jìnzhǎn wǒ huì zài qún lǐ tóngbù.","ar":"حسنًا، سأحدّث المجموعة بأي تقدّم.","en":"Great, I’ll post progress in the group chat.","na":"","ne":""},{"t":"B","zh":"好的。","py":"Hǎo de.","ar":"حسنًا.","en":"OK.","na":"التزم بالتواصل.","ne":"Commit to keeping people updated."},{"t":"X","zh":"计划没用，写完就行。","py":"Jìhuà méi yòng, xiě wán jiù xíng.","ar":"الخطة بلا فائدة، المهم الإنهاء.","en":"Plans are useless, just finish it.","na":"التخطيط أساس عمل الفريق.","ne":"Planning is how teams coordinate."}]}]},{"k":"review","zh":"代码审查","ar":"مراجعة الكود","en":"Code review","pz":"老周","pa":"تشو الكبير","pe":"Senior engineer Zhou","ma":"المطوّر","me":"Developer","sa":"المهندس الأقدم تشو راجع طلب الدمج الذي قدّمته.","se":"Senior engineer Zhou has reviewed your merge request.","hsk":5,"turns":[{"p":["我看了你的合并请求，有几个地方想讨论一下。","Wǒ kàn le nǐ de hébìng qǐngqiú, yǒu jǐ ge dìfang xiǎng tǎolùn yíxià.","راجعت طلب الدمج، وأريد مناقشة بعض النقاط.","I looked at your merge request; I’d like to discuss a few points."],"o":[{"t":"A","zh":"好的，谢谢你帮我审查，请说。","py":"Hǎo de, xièxie nǐ bāng wǒ shěnchá, qǐng shuō.","ar":"حسنًا، شكرًا على المراجعة، تفضّل.","en":"Sure, thanks for reviewing. Go ahead.","na":"","ne":""},{"t":"B","zh":"我的代码没问题吧？","py":"Wǒ de dàimǎ méi wèntí ba?","ar":"كودي سليم، صحيح؟","en":"My code’s fine, right?","na":"نبرة دفاعية؛ تقبّل الملاحظات.","ne":"Defensive; welcome the feedback."},{"t":"X","zh":"我的代码不需要审查。","py":"Wǒ de dàimǎ bù xūyào shěnchá.","ar":"كودي لا يحتاج مراجعة.","en":"My code doesn’t need review.","na":"كل كود يحتاج مراجعة.","ne":"All code benefits from review."}]},{"p":["这个函数太长了，有两百多行，可读性不好。","Zhège hánshù tài cháng le, yǒu liǎngbǎi duō háng, kědúxìng bù hǎo.","هذه الدالة طويلة جدًا، أكثر من 200 سطر، وقراءتها صعبة.","This function is too long, over 200 lines; it’s hard to read."],"o":[{"t":"A","zh":"你说得对，我把它拆成几个小函数。","py":"Nǐ shuō de duì, wǒ bǎ tā chāi chéng jǐ ge xiǎo hánshù.","ar":"معك حق، سأقسمها إلى عدة دوال صغيرة.","en":"You’re right, I’ll split it into smaller functions.","na":"","ne":""},{"t":"B","zh":"可是它能运行。","py":"Kěshì tā néng yùnxíng.","ar":"لكنها تعمل.","en":"But it works.","na":"العمل وحده لا يكفي؛ الصيانة مهمة.","ne":"Working isn’t enough; maintainability matters."},{"t":"X","zh":"长一点儿更专业。","py":"Cháng yìdiǎnr gèng zhuānyè.","ar":"الأطول أكثر احترافية.","en":"Longer is more professional.","na":"العكس صحيح.","ne":"The opposite is true."}]},{"p":["还有，这里没有处理空值，可能会报错。","Hái yǒu, zhèlǐ méiyǒu chǔlǐ kōngzhí, kěnéng huì bàocuò.","وأيضًا هنا لا تعالج القيم الفارغة، وقد يحدث خطأ.","Also, null values aren’t handled here; it may throw an error."],"o":[{"t":"A","zh":"好的，我加一个判断，再补一个测试用例。","py":"Hǎo de, wǒ jiā yí ge pànduàn, zài bǔ yí ge cèshì yònglì.","ar":"حسنًا، أضيف شرط تحقق وحالة اختبار.","en":"OK, I’ll add a check and another test case.","na":"","ne":""},{"t":"B","zh":"用户不会输入空值的。","py":"Yònghù bú huì shūrù kōngzhí de.","ar":"المستخدم لن يُدخل قيمة فارغة.","en":"Users won’t enter empty values.","na":"لا تفترض ذلك أبدًا.","ne":"Never assume that."},{"t":"X","zh":"报错了再说。","py":"Bàocuò le zài shuō.","ar":"عندما يحدث الخطأ نرى.","en":"We’ll deal with it when it breaks.","na":"إصلاح الخطأ في الإنتاج أغلى.","ne":"Fixing it in production costs more."}]},{"p":["数据库查询放在循环里，性能会很差。","Shùjùkù cháxún fàng zài xúnhuán lǐ, xìngnéng huì hěn chà.","استعلام قاعدة البيانات داخل حلقة، والأداء سيكون سيئًا.","The database query is inside a loop; performance will be poor."],"o":[{"t":"A","zh":"明白，我改成一次批量查询。","py":"Míngbai, wǒ gǎi chéng yí cì pīliàng cháxún.","ar":"فهمت، سأحوّلها إلى استعلام مجمّع واحد.","en":"Got it, I’ll change it to one batch query.","na":"","ne":""},{"t":"B","zh":"数据不多，应该没事。","py":"Shùjù bù duō, yīnggāi méi shì.","ar":"البيانات قليلة، لا مشكلة.","en":"Not much data, should be fine.","na":"اليوم نعم، لكن البيانات ستكبر.","ne":"Today yes, but data grows."},{"t":"X","zh":"性能不重要。","py":"Xìngnéng bú zhòngyào.","ar":"الأداء غير مهم.","en":"Performance doesn’t matter.","na":"الأداء يؤثر مباشرة على المستخدم.","ne":"Performance directly affects users."}]},{"p":["改完再提交，我今天下午再看一遍。","Gǎi wán zài tíjiāo, wǒ jīntiān xiàwǔ zài kàn yí biàn.","عدّل ثم أرسل، وسأراجعها مجددًا عصر اليوم.","Submit after the changes; I’ll look again this afternoon."],"o":[{"t":"A","zh":"好的，我中午之前改完，谢谢你的建议！","py":"Hǎo de, wǒ zhōngwǔ zhīqián gǎi wán, xièxie nǐ de jiànyì!","ar":"حسنًا، أنهي التعديل قبل الظهر، شكرًا على ملاحظاتك!","en":"Sure, I’ll finish before noon. Thanks for the suggestions!","na":"","ne":""},{"t":"B","zh":"好。","py":"Hǎo.","ar":"حسنًا.","en":"OK.","na":"اشكر المراجع وحدد موعدًا.","ne":"Thank the reviewer and give a time."},{"t":"X","zh":"你自己改吧。","py":"Nǐ zìjǐ gǎi ba.","ar":"عدّلها بنفسك.","en":"Change it yourself.","na":"التعديل مسؤولية صاحب الكود.","ne":"The author owns the fix."}]}]},{"k":"incident","zh":"线上故障","ar":"عطل في بيئة الإنتاج","en":"Production incident","pz":"小马","pa":"ما الصغير","pe":"Ma (ops)","ma":"مطوّر الخلفية","me":"Back-end developer","sa":"الساعة التاسعة مساءً، وزميلك في فريق التشغيل ما يتصل بك بشأن عطل.","se":"9 p.m.: your ops colleague Ma calls you about an outage.","hsk":5,"turns":[{"p":["紧急情况！用户说应用打不开了！","Jǐnjí qíngkuàng! Yònghù shuō yìngyòng dǎ bu kāi le!","حالة طارئة! المستخدمون يقولون إن التطبيق لا يفتح!","Emergency! Users say the app won’t open!"],"o":[{"t":"A","zh":"收到。我先看一下监控和日志。","py":"Shōudào. Wǒ xiān kàn yíxià jiānkòng hé rìzhì.","ar":"وصلني. سأنظر أولًا إلى المراقبة والسجلات.","en":"On it. I’ll check monitoring and logs first.","na":"","ne":""},{"t":"B","zh":"可能是用户的网络有问题。","py":"Kěnéng shì yònghù de wǎngluò yǒu wèntí.","ar":"ربما شبكة المستخدمين.","en":"Maybe the users’ network.","na":"افتراض قبل التحقق.","ne":"An assumption before checking."},{"t":"X","zh":"我下班了，明天再说。","py":"Wǒ xiàbān le, míngtiān zài shuō.","ar":"انتهى دوامي، غدًا.","en":"I’m off work, tomorrow.","na":"عطل الإنتاج لا ينتظر.","ne":"An outage can’t wait."}]},{"p":["监控显示服务器的错误率突然升高了。","Jiānkòng xiǎnshì fúwùqì de cuòwùlǜ tūrán shēnggāo le.","المراقبة تُظهر ارتفاعًا مفاجئًا في معدل أخطاء الخادم.","Monitoring shows the server error rate suddenly spiked."],"o":[{"t":"A","zh":"半小时前我们发布了新版本，可能是这个原因。","py":"Bàn xiǎoshí qián wǒmen fābù le xīn bǎnběn, kěnéng shì zhège yuányīn.","ar":"أطلقنا إصدارًا جديدًا قبل نصف ساعة، قد يكون السبب.","en":"We released a new version half an hour ago; that may be it.","na":"","ne":""},{"t":"B","zh":"服务器太老了。","py":"Fúwùqì tài lǎo le.","ar":"الخوادم قديمة.","en":"The servers are too old.","na":"ابحث عمّا تغيّر قبل الارتفاع مباشرة.","ne":"Look at what changed right before the spike."},{"t":"X","zh":"错误率高一点儿没关系。","py":"Cuòwùlǜ gāo yìdiǎnr méi guānxi.","ar":"لا بأس بارتفاع الأخطاء قليلًا.","en":"A higher error rate is fine.","na":"المستخدمون لا يستطيعون الدخول.","ne":"Users can’t get in."}]},{"p":["那怎么办？","Nà zěnme bàn?","ماذا نفعل؟","So what do we do?"],"o":[{"t":"A","zh":"先回滚到上一个版本，让服务恢复，然后再查原因。","py":"Xiān huígǔn dào shàng yí ge bǎnběn, ràng fúwù huīfù, ránhòu zài chá yuányīn.","ar":"نرجع إلى الإصدار السابق أولًا لاستعادة الخدمة، ثم نبحث عن السبب.","en":"Roll back to the previous version first to restore service, then find the cause.","na":"","ne":""},{"t":"B","zh":"我们先找到问题再说。","py":"Wǒmen xiān zhǎo dào wèntí zài shuō.","ar":"لنجد المشكلة أولًا.","en":"Let’s find the bug first.","na":"استعادة الخدمة أولًا ثم التحقيق.","ne":"Restore service first, investigate after."},{"t":"X","zh":"把服务器关了吧。","py":"Bǎ fúwùqì guān le ba.","ar":"لنطفئ الخوادم.","en":"Let’s shut down the servers.","na":"يجعل العطل أسوأ.","ne":"That makes the outage worse."}]},{"p":["回滚完成了，错误率降下来了。","Huígǔn wánchéng le, cuòwùlǜ jiàng xiàlai le.","اكتمل الرجوع، وانخفض معدل الأخطاء.","Rollback done; the error rate dropped."],"o":[{"t":"A","zh":"太好了。我们在群里通知大家，服务已经恢复正常。","py":"Tài hǎo le. Wǒmen zài qún lǐ tōngzhī dàjiā, fúwù yǐjīng huīfù zhèngcháng.","ar":"ممتاز. لنبلغ الجميع في المجموعة أن الخدمة عادت طبيعية.","en":"Great. Let’s tell everyone in the group that service is back to normal.","na":"","ne":""},{"t":"B","zh":"好的，没事了。","py":"Hǎo de, méi shì le.","ar":"حسنًا، انتهى الأمر.","en":"OK, all good.","na":"أبلغ أصحاب المصلحة.","ne":"Inform stakeholders."},{"t":"X","zh":"不用告诉别人。","py":"Búyòng gàosu biérén.","ar":"لا داعي لإخبار أحد.","en":"No need to tell anyone.","na":"الشفافية مهمة في الأعطال.","ne":"Transparency matters in incidents."}]},{"p":["好的。这次要写故障报告吗？","Hǎo de. Zhè cì yào xiě gùzhàng bàogào ma?","حسنًا. هل نكتب تقرير عطل هذه المرة؟","OK. Do we write an incident report this time?"],"o":[{"t":"A","zh":"要写。我们明天开个复盘会，找到根本原因，避免再发生。","py":"Yào xiě. Wǒmen míngtiān kāi ge fùpán huì, zhǎo dào gēnběn yuányīn, bìmiǎn zài fāshēng.","ar":"نعم. نعقد غدًا اجتماع مراجعة لنجد السبب الجذري ونمنع تكراره.","en":"Yes. Tomorrow we hold a post-mortem to find the root cause and prevent a repeat.","na":"","ne":""},{"t":"B","zh":"写一个简单的吧。","py":"Xiě yí ge jiǎndān de ba.","ar":"لنكتب تقريرًا بسيطًا.","en":"Let’s write a short one.","na":"الأهم إيجاد السبب الجذري.","ne":"The key is finding the root cause."},{"t":"X","zh":"不用写，大家都忘了。","py":"Búyòng xiě, dàjiā dōu wàng le.","ar":"لا داعي، الجميع سينسى.","en":"No need, everyone’s forgotten.","na":"بلا مراجعة سيتكرر العطل.","ne":"Without a review it will happen again."}]}]},{"k":"product","zh":"需求讨论","ar":"مناقشة متطلبات المنتج","en":"Product requirements","pz":"小王","pa":"وانغ الصغير","pe":"Wang (PM)","ma":"المهندس المسؤول","me":"Tech lead","sa":"مديرة المنتج وانغ تريد إضافة واجهة عربية للتطبيق.","se":"Product manager Wang wants to add an Arabic interface to the app.","hsk":5,"turns":[{"p":["我们想在应用里加一个阿拉伯语版本。","Wǒmen xiǎng zài yìngyòng lǐ jiā yí ge Ālābóyǔ bǎnběn.","نريد إضافة نسخة عربية للتطبيق.","We want to add an Arabic version to the app."],"o":[{"t":"A","zh":"好主意。阿拉伯语从右往左写，界面布局需要调整。","py":"Hǎo zhǔyi. Ālābóyǔ cóng yòu wǎng zuǒ xiě, jièmiàn bùjú xūyào tiáozhěng.","ar":"فكرة جيدة. العربية تُكتب من اليمين إلى اليسار، فنحتاج إلى تعديل تخطيط الواجهة.","en":"Good idea. Arabic is written right to left, so the layout needs adjusting.","na":"","ne":""},{"t":"B","zh":"只要翻译一下就行。","py":"Zhǐyào fānyì yíxià jiù xíng.","ar":"تكفي الترجمة.","en":"Just translate it.","na":"الواجهة العربية تحتاج اتجاهًا معكوسًا لا ترجمة فقط.","ne":"Arabic needs a mirrored layout, not just translation."},{"t":"X","zh":"阿拉伯语用户很少。","py":"Ālābóyǔ yònghù hěn shǎo.","ar":"مستخدمو العربية قليلون.","en":"There are few Arabic users.","na":"أكثر من 400 مليون ناطق بالعربية.","ne":"Over 400 million people speak Arabic."}]},{"p":["需要多长时间？下个月能上线吗？","Xūyào duō cháng shíjiān? Xià ge yuè néng shàngxiàn ma?","كم تحتاج من الوقت؟ هل نطلقها الشهر القادم؟","How long will it take? Can it launch next month?"],"o":[{"t":"A","zh":"要看具体范围。如果只做主要页面，三周可以完成。","py":"Yào kàn jùtǐ fànwéi. Rúguǒ zhǐ zuò zhǔyào yèmiàn, sān zhōu kěyǐ wánchéng.","ar":"يعتمد على النطاق. إذا اقتصرنا على الصفحات الرئيسية فثلاثة أسابيع تكفي.","en":"It depends on scope. If we only do the main pages, three weeks.","na":"","ne":""},{"t":"B","zh":"没问题，肯定能。","py":"Méi wèntí, kěndìng néng.","ar":"لا مشكلة، أكيد.","en":"No problem, definitely.","na":"لا تَعِد قبل تحديد النطاق.","ne":"Don’t promise before scoping."},{"t":"X","zh":"至少需要一年。","py":"Zhìshǎo xūyào yì nián.","ar":"سنة على الأقل.","en":"At least a year.","na":"تقدير مبالغ فيه دون تحليل.","ne":"An inflated estimate with no analysis."}]},{"p":["主要页面是首页、搜索和支付。","Zhǔyào yèmiàn shì shǒuyè, sōusuǒ hé zhīfù.","الصفحات الرئيسية: الرئيسية والبحث والدفع.","The main pages are home, search and payment."],"o":[{"t":"A","zh":"明白。支付页面的金额和日期格式也要本地化。","py":"Míngbai. Zhīfù yèmiàn de jīn'é hé rìqī géshì yě yào běndìhuà.","ar":"مفهوم. يجب أيضًا توطين صيغ المبالغ والتواريخ في صفحة الدفع.","en":"Understood. Amount and date formats on the payment page must be localised too.","na":"","ne":""},{"t":"B","zh":"好的，知道了。","py":"Hǎo de, zhīdào le.","ar":"حسنًا، فهمت.","en":"OK, got it.","na":"انتبه لتفاصيل التوطين.","ne":"Think about localisation details."},{"t":"X","zh":"支付不重要。","py":"Zhīfù bú zhòngyào.","ar":"الدفع غير مهم.","en":"Payment isn’t important.","na":"الدفع أهم صفحة تجاريًا.","ne":"Payment is the most important page commercially."}]},{"p":["翻译谁来做？","Fānyì shéi lái zuò?","من سيتولّى الترجمة؟","Who will do the translation?"],"o":[{"t":"A","zh":"最好请专业的阿拉伯语翻译，再让当地用户测试一下。","py":"Zuìhǎo qǐng zhuānyè de Ālābóyǔ fānyì, zài ràng dāngdì yònghù cèshì yíxià.","ar":"الأفضل مترجم عربي محترف، ثم يجرّبه مستخدمون محليون.","en":"Best to hire a professional Arabic translator, then have local users test it.","na":"","ne":""},{"t":"B","zh":"用机器翻译吧。","py":"Yòng jīqì fānyì ba.","ar":"لنستخدم الترجمة الآلية.","en":"Use machine translation.","na":"خطر على جودة الواجهة؛ راجعها بشريًا.","ne":"Risky for UI quality; have a human review."},{"t":"X","zh":"不用翻译，用英语就行。","py":"Búyòng fānyì, yòng Yīngyǔ jiù xíng.","ar":"لا ترجمة، الإنجليزية تكفي.","en":"No translation, English is fine.","na":"يناقض هدف المشروع.","ne":"Defeats the purpose."}]},{"p":["好，你把估算发给我，我们周五评审。","Hǎo, nǐ bǎ gūsuàn fā gěi wǒ, wǒmen zhōuwǔ píngshěn.","حسنًا، أرسل لي التقدير ونراجعه الجمعة.","OK, send me the estimate and we’ll review it on Friday."],"o":[{"t":"A","zh":"好的，我明天把任务拆分和工作量估算发给你。","py":"Hǎo de, wǒ míngtiān bǎ rènwu chāifēn hé gōngzuòliàng gūsuàn fā gěi nǐ.","ar":"حسنًا، أرسل لك غدًا تقسيم المهام وتقدير الجهد.","en":"Sure, tomorrow I’ll send you the task breakdown and effort estimate.","na":"","ne":""},{"t":"B","zh":"好的。","py":"Hǎo de.","ar":"حسنًا.","en":"OK.","na":"حدّد ما سترسله ومتى.","ne":"Say what you’ll send and when."},{"t":"X","zh":"估算没意义。","py":"Gūsuàn méi yìyì.","ar":"التقدير بلا معنى.","en":"Estimates are meaningless.","na":"التقدير ضروري للتخطيط.","ne":"Estimates are needed for planning."}]}]},{"k":"interview","zh":"技术面试","ar":"مقابلة عمل تقنية","en":"Technical interview","pz":"刘总监","pa":"المدير ليو","pe":"Director Liu","ma":"المرشّح","me":"Candidate","sa":"تقدّمت لوظيفة مطوّر خلفية في شركة صينية تتوسع في الشرق الأوسط.","se":"You’re interviewing for a back-end role at a Chinese company expanding into the Middle East.","hsk":5,"turns":[{"p":["你好，请先简单介绍一下自己。","Nǐ hǎo, qǐng xiān jiǎndān jièshào yíxià zìjǐ.","مرحبًا، عرّف بنفسك باختصار.","Hello, please briefly introduce yourself."],"o":[{"t":"A","zh":"您好，我叫阿米尔，有五年后端开发经验，熟悉数据库和云服务。","py":"Nín hǎo, wǒ jiào Āmǐ'ěr, yǒu wǔ nián hòuduān kāifā jīngyàn, shúxī shùjùkù hé yún fúwù.","ar":"مرحبًا، اسمي أمير، لدي خمس سنوات خبرة في تطوير الخلفية، وأعرف قواعد البيانات والخدمات السحابية جيدًا.","en":"Hello, I’m Amir, with five years of back-end experience; I know databases and cloud services well.","na":"","ne":""},{"t":"B","zh":"我叫阿米尔。","py":"Wǒ jiào Āmǐ'ěr.","ar":"اسمي أمير.","en":"I’m Amir.","na":"قصير جدًا؛ اذكر خبرتك.","ne":"Too short; mention your experience."},{"t":"X","zh":"我的简历上都有，您自己看吧。","py":"Wǒ de jiǎnlì shang dōu yǒu, nín zìjǐ kàn ba.","ar":"كل شيء في سيرتي، اقرأها.","en":"It’s all on my CV, read it.","na":"يبدو متعاليًا.","ne":"Comes across as arrogant."}]},{"p":["说说你做过的最有挑战的项目。","Shuōshuo nǐ zuò guo de zuì yǒu tiǎozhàn de xiàngmù.","حدّثني عن أصعب مشروع نفّذته.","Tell me about your most challenging project."],"o":[{"t":"A","zh":"我负责过一个支付系统，每天处理一百万笔交易，我们把响应时间缩短了一半。","py":"Wǒ fùzé guo yí ge zhīfù xìtǒng, měi tiān chǔlǐ yìbǎi wàn bǐ jiāoyì, wǒmen bǎ xiǎngyìng shíjiān suōduǎn le yíbàn.","ar":"كنت مسؤولًا عن نظام دفع يعالج مليون معاملة يوميًا، وخفّضنا زمن الاستجابة إلى النصف.","en":"I owned a payment system handling a million transactions a day; we cut response time in half.","na":"","ne":""},{"t":"B","zh":"我做过很多项目。","py":"Wǒ zuò guo hěn duō xiàngmù.","ar":"نفّذت مشاريع كثيرة.","en":"I’ve done many projects.","na":"اختر مشروعًا واحدًا بنتيجة رقمية.","ne":"Pick one project with a measurable result."},{"t":"X","zh":"都很简单，没有挑战。","py":"Dōu hěn jiǎndān, méiyǒu tiǎozhàn.","ar":"كلها سهلة بلا تحدٍّ.","en":"They were all easy, no challenges.","na":"يوحي بقلة الخبرة.","ne":"Suggests little experience."}]},{"p":["如果系统突然变慢，你会怎么排查？","Rúguǒ xìtǒng tūrán biàn màn, nǐ huì zěnme páichá?","إذا أصبح النظام بطيئًا فجأة، كيف تتحرّى السبب؟","If the system suddenly slows down, how would you troubleshoot?"],"o":[{"t":"A","zh":"先看监控指标，找出哪个服务慢，再查日志和数据库的慢查询。","py":"Xiān kàn jiānkòng zhǐbiāo, zhǎo chū nǎge fúwù màn, zài chá rìzhì hé shùjùkù de màn cháxún.","ar":"أنظر أولًا إلى مؤشرات المراقبة لأعرف أي خدمة بطيئة، ثم أفحص السجلات والاستعلامات البطيئة.","en":"Check monitoring first to find which service is slow, then the logs and slow database queries.","na":"","ne":""},{"t":"B","zh":"重启服务器。","py":"Chóngqǐ fúwùqì.","ar":"أعيد تشغيل الخادم.","en":"Restart the server.","na":"قد يساعد مؤقتًا لكنه ليس تشخيصًا.","ne":"May help briefly but isn’t a diagnosis."},{"t":"X","zh":"等它自己变快。","py":"Děng tā zìjǐ biàn kuài.","ar":"أنتظر حتى يسرع وحده.","en":"Wait for it to speed up.","na":"إجابة غير مقبولة.","ne":"Not an acceptable answer."}]},{"p":["你为什么想加入我们公司？","Nǐ wèishénme xiǎng jiārù wǒmen gōngsī?","لماذا تريد الانضمام إلى شركتنا؟","Why do you want to join our company?"],"o":[{"t":"A","zh":"你们的产品在中东发展很快，我希望用我的经验帮助团队，也想继续成长。","py":"Nǐmen de chǎnpǐn zài Zhōngdōng fāzhǎn hěn kuài, wǒ xīwàng yòng wǒ de jīngyàn bāngzhù tuánduì, yě xiǎng jìxù chéngzhǎng.","ar":"منتجكم ينمو بسرعة في الشرق الأوسط، وأريد أن أفيد الفريق بخبرتي وأن أستمر في التطور.","en":"Your product is growing fast in the Middle East; I want to bring my experience to the team and keep growing.","na":"","ne":""},{"t":"B","zh":"因为工资高。","py":"Yīnwèi gōngzī gāo.","ar":"لأن الراتب مرتفع.","en":"Because the salary is high.","na":"صادق لكن قدّمه من زاوية القيمة.","ne":"Honest, but frame it around value."},{"t":"X","zh":"我也不知道。","py":"Wǒ yě bù zhīdào.","ar":"لا أعرف.","en":"I don’t know.","na":"يوحي بقلة الاهتمام.","ne":"Shows no interest."}]},{"p":["你有什么问题想问我们吗？","Nǐ yǒu shénme wèntí xiǎng wèn wǒmen ma?","هل لديك أسئلة لنا؟","Do you have any questions for us?"],"o":[{"t":"A","zh":"有。请问团队现在最大的技术挑战是什么？","py":"Yǒu. Qǐngwèn tuánduì xiànzài zuì dà de jìshù tiǎozhàn shì shénme?","ar":"نعم. ما أكبر تحدٍّ تقني يواجهه الفريق الآن؟","en":"Yes. What’s the team’s biggest technical challenge right now?","na":"","ne":""},{"t":"B","zh":"没有问题。","py":"Méiyǒu wèntí.","ar":"لا أس
